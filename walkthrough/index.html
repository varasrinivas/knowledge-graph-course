difference; an embedding search (M02) finds text that <em>talks like</em> <code>decode_jwt</code>, which is worse.","Only a parse tree distinguishes them, because defining, calling and mentioning are three different node types in the grammar. That is the entire reason extractors start with a parser instead of a regex."],"youDo":"<code>grep -rn decode_jwt labs/sample-project</code> and classify each of the five hits before reading on.","source":"labs/sample-project/shared/auth.py, labs/sample-project/docs/runbook-key-rotation.md","terminal":[{"kind":"prompt","text":"grep -rn decode_jwt labs/sample-project"},{"kind":"out","text":"README.md:18                       auth.py   # verify_token -> decode_jwt\nREADME.md:29                     - `verify_token` calls `decode_jwt` (same file)\ndocs/runbook-key-rotation.md:13  - During the dual-key window, `decode_jwt` tries…\nshared/auth.py:16                def decode_jwt(token: str) -> dict:\nshared/auth.py:45                    return decode_jwt(token.removeprefix(\"Bearer \")…"},{"kind":"out-fail","text":"5 lines, 3 files — and the tool that printed them cannot tell you which is which"}],"state":{"label":"the same eight characters, five times","before":{"title":"WHAT GREP RETURNS vs WHAT IT IS","view":{"type":"rows","columns":["hit","grammar node it sits in","graph meaning"],"rows":[{"cells":["<code>auth.py:16</code>","<code>function_definition → name</code>","a <b>node</b>"],"tone":"win"},{"cells":["<code>auth.py:45</code>","<code>call → function</code>","an <b>edge</b>"],"tone":"win"},{"cells":["<code>runbook-key-rotation.md:13</code>","not code — Markdown prose","nothing"],"tone":"bad"},{"cells":["<code>README.md:18</code>","not code — an ASCII diagram","nothing"],"tone":"bad"},{"cells":["<code>README.md:29</code>","not code — prose that is coincidentally correct","nothing, and you can't tell"],"tone":"bad"}]}}}},{"title":"Parse it — the tree, not the text","narrative":["Load the Python grammar, hand tree-sitter the file as <b>bytes</b> (its offsets are byte offsets — the moment a file has a non-ASCII character, <code>str</code> will quietly misalign your names), and take the tree.","What comes back is the same 45 lines reorganised as labeled structure: a <code>module</code> root, a <code>class_definition</code>, two <code>function_definition</code> children, and inside them <code>if_statement</code>, <code>raise_statement</code>, <code>return_statement</code> and <code>call</code> nodes. \"Abstract\" means it dropped the whitespace and most punctuation and kept the grammar.","Two properties matter more than the tree itself. It parses <b>incrementally</b> — edit one function and only that subtree rebuilds, which is what makes watch mode affordable. And it is <b>fault-tolerant</b>: delete a closing parenthesis and you get an <code>ERROR</code> node island, not a failed file, so a half-written branch costs you one node instead of a whole file's worth of nodes and edges."],"youDo":"<code>pip install tree-sitter tree-sitter-python</code>, then parse <code>shared/auth.py</code> and print <code>tree.root_node</code>. Then do the lab's step 2: break the syntax on a copy and re-parse.","terminal":[{"kind":"prompt","text":"python -c \"import tree_sitter_python; from tree_sitter import Language,Parser; p=Parser(Language(tree_sitter_python.language())); print(p.parse(open('shared/auth.py','rb').read()).root_node)\""},{"kind":"out","text":"(module\n  (expression_statement (string))\n  (import_statement (dotted_name (identifier))) …\n  (class_definition name: (identifier) superclasses: (argument_list (identifier))\n    body: (block (expression_statement (string))))\n  (function_definition name: (identifier)\n    parameters: (parameters (typed_parameter (identifier) type: (type (identifier))))\n    return_type: (type (identifier))\n    body: (block …))\n  (function_definition name: (identifier)\n    body: (block\n      (if_statement condition: (not_operator argument: (identifier))\n        consequence: (block (raise_statement (call function: (identifier)\n          arguments: (argument_list (string))))))\n      (return_statement (call function: (identifier) arguments: (argument_list …))))))"},{"kind":"out","text":"(trimmed for reading — the real S-expression runs to several hundred nodes)"}],"state":{"label":"shared/auth.py → one tree","before":{"title":"BEFORE — 45 lines of text","view":{"type":"diff","file":"shared/auth.py (excerpt)","lines":[["p","16  def decode_jwt(token: str) -> dict:"],["p","25          raise AuthError(\"malformed token: expected three dot-separated parts\")"],["p","41  def verify_token(token: str | None) -> dict:"],["p","44          raise AuthError(\"missing bearer token\")"],["p","45      return decode_jwt(token.removeprefix(\"Bearer \").strip())"]]}},"after":{"title":"AFTER — labeled nodes, each with a graph meaning","view":{"type":"rows","columns":["tree node type","found in auth.py","becomes"],"rows":[{"cells":["<code>function_definition</code>","2","graph nodes"],"tone":"win"},{"cells":["<code>class_definition</code>","1 — <code>AuthError</code>","a graph node"],"tone":"win"},{"cells":["<code>call</code>","21","candidate edges — see the next step"]},{"cells":["<code>import_statement</code>","6","<code>imports</code> edges in a richer extractor"]},{"cells":["<code>string</code>, <code>comment</code>","many","nothing — and that is why grep's three prose hits vanish here"]}]}}}},{"title":"The query — patterns, not regexes","narrative":["A tree is not yet a graph. The second half of every extractor is a set of <b>extraction queries</b>: S-expression patterns matched against the tree, with <code>@captures</code> naming the parts you want out.","Three patterns cover the whole of this file. One captures every function's name. The other two capture call targets — and the split between them is the gotcha that silently costs people every method call in a repo: a <code>call</code> node's <code>function</code> field holds a bare <code>identifier</code> for <code>decode_jwt(…)</code> but an <code>attribute</code> for <code>hmac.new(…)</code>. Match only the first and every <code>obj.method()</code> in your codebase disappears.","Run them over <code>auth.py</code>: 2 definition captures and <b>21</b> call-site captures, 17 of them distinct names. \"Language-specific\" is doing real work in the phrase <em>extraction query</em> — a Python <code>function_definition</code> is a Go <code>function_declaration</code>, and Ruby lets you drop the parentheses entirely. The grammar gives you the tree; the queries decide what in it becomes knowledge."],"youDo":"Add a fourth pattern for <code>(class_definition name: (identifier) @class.name)</code> and confirm it captures exactly one thing in this file.","source":"labs/sample-project/shared/auth.py","terminal":[{"kind":"prompt","text":"cat queries/python-calls.scm"},{"kind":"out","text":"(function_definition\n  name: (identifier) @def.name) @def\n\n(call\n  function: (identifier) @call.name)\n\n(call\n  function: (attribute\n    attribute: (identifier) @call.name))"},{"kind":"prompt","text":"python extract.py --query queries/python-calls.scm shared/auth.py"},{"kind":"out-pass","text":"@def.name   x2   decode_jwt (line 16) · verify_token (line 41)"},{"kind":"out-pass","text":"@call.name  x21  17 distinct names"}],"state":{"label":"21 call captures in one file","before":{"title":"WHAT THE QUERY CAPTURED","view":{"type":"rows","columns":["pattern","captures","note"],"rows":[{"cells":["<code>function_definition → name</code>","<code>decode_jwt</code>:16, <code>verify_token</code>:41","the definition table every grade is resolved against"]},{"cells":["<code>call → function: (identifier)</code>","<code>AuthError</code> ×4, <code>decode_jwt</code>, <code>len</code>, <code>time</code>, <code>split</code>…","bare-name calls"]},{"cells":["<code>call → function: (attribute)</code>","<code>new</code>, <code>digest</code>, <code>encode</code> ×2, <code>rstrip</code>, <code>decode</code>, <code>strip</code>…","<code>obj.method()</code> — drop this pattern and you lose all of them"],"tone":"bad"},{"cells":["total","21 call sites, 17 distinct names","not one of them is graded yet"]}]}}}},{"title":"Grade every capture — the ladder's bottom rung","narrative":["The tree tells you with certainty that <em>something named <code>decode_jwt</code></em> is called on line 45. It does not tell you <em>which</em> <code>decode_jwt</code>. Binding a name at a use site to the declaration it refers to is <b>name resolution</b>, and it is where structural extraction stops being trivially exact.","The bottom rung of the ladder is a table lookup. Target defined in this module and unambiguous → <code>EXTRACTED</code>, a parse-tree fact. Exactly one definition of that name elsewhere in the repo → <code>INFERRED</code>, a heuristic that is usually right. Two or more candidates → <code>AMBIGUOUS</code>, all of them emitted and none confirmed.","Twenty-one captures collapse to <b>five edges</b>. Sixteen — <code>hmac.new</code>, <code>json.loads</code>, <code>len</code>, <code>time.time</code> and the rest — resolve to nothing in this project and are <b>skipped, not guessed</b>. That skip is the discipline: an extractor that invented edges for stdlib names would produce a bigger graph and a worse one."],"claudeSays":"Each edge is written with its grade attached, so a consumer downstream can set a confidence floor instead of trusting everything equally.","source":"labs/shared_tools/kg_extract.py, labs/sample-project/shared/auth.py","terminal":[{"kind":"prompt","text":"python extract.py --grade shared/auth.py"},{"kind":"out-pass","text":"decode_jwt   -> AuthError   [EXTRACTED]   line 25"},{"kind":"out-pass","text":"decode_jwt   -> AuthError   [EXTRACTED]   line 32"},{"kind":"out-pass","text":"decode_jwt   -> AuthError   [EXTRACTED]   line 37"},{"kind":"out-pass","text":"verify_token -> AuthError   [EXTRACTED]   line 44"},{"kind":"out-pass","text":"verify_token -> decode_jwt  [EXTRACTED]   line 45"},{"kind":"out","text":"16 call sites skipped: external (stdlib / third-party)"}],"state":{"label":"21 captures → 5 graded edges","before":{"title":"BEFORE — the grading rule","view":{"type":"rows","columns":["candidates for the name","grade","why"],"rows":[{"cells":["one, in this module","<code>EXTRACTED</code>","the binding is explicit in source — 100% confidence"],"tone":"win"},{"cells":["one, elsewhere in the repo","<code>INFERRED</code>","bare-name matching with no import following — a guess by construction"]},{"cells":["two or more","<code>AMBIGUOUS</code>","emit all candidates labeled; it is a question, not an answer"]},{"cells":["none","skipped","external — the extractor declines to invent an edge"],"tone":"bad"}]}},"after":{"title":"AFTER — one edge, in the shape graph.json stores","view":{"type":"json","data":{"source":"function:shared.auth.verify_token","target":"function:shared.auth.decode_jwt","type":"calls","provenance":"EXTRACTED"},"highlight":["provenance"]}}}},{"title":"What the parser refuses to guess","narrative":["Now the limit, because a walkthrough that stopped at the happy path would be teaching you to over-trust the graph.","orderflow's <code>worker.py</code> registers <code>subscribe(\"payment.settled\", send_receipt)</code>, and billing later calls <code>publish(\"payment.settled\", …)</code>. The parser sees both calls perfectly and sees <b>nothing</b> of the relationship between them: the actual invocation of <code>send_receipt</code> happens at runtime, through a dict of handlers. Check the graph and <code>send_receipt</code> has zero callers. It is called on every settled payment.","Same story with <code>POOL.execute(…)</code>. The tree hands you the attribute name <code>execute</code> and says nothing about what <code>POOL</code> is — in Python, types are suggestions. On orderflow exactly one <code>execute</code> is defined, so the heuristic resolves it <code>INFERRED</code> and happens to be right. Define a second <code>execute</code> anywhere in the repo and the same call site must drop to <code>AMBIGUOUS</code> — nothing about the call changed, only the number of candidates.","And <code>getattr(module, name)()</code> is worse than ambiguous: the callee's name does not exist in the tree at all. No edge is the correct output. The middle rung of the ladder — <code>okf-rs generate --lsp</code>, asking pyright or rust-analyzer via <code>textDocument/definition</code> — buys back the name-collision cases at the cost of startup time and project configuration. It buys back none of the dynamic dispatch."],"youDo":"Run the extractor over orderflow and look up <code>send_receipt</code>'s callers. Then read <code>services/notifications/worker.py</code> and satisfy yourself the graph is wrong-by-omission — and that this is the honest answer, not a bug.","source":"labs/sample-project/services/notifications/worker.py, labs/sample-project/shared/events.py","terminal":[{"kind":"prompt","text":"graph_callers(symbol=\"send_receipt\")"},{"kind":"out","text":"[]"},{"kind":"prompt","text":"grep -n 'send_receipt' labs/sample-project/services/notifications/worker.py"},{"kind":"out","text":"7:def send_receipt(payload: dict) -> None:\n26:    subscribe(\"payment.settled\", send_receipt)"},{"kind":"gate","text":"the registration is visible · the dispatch is not · no static tool escapes this"}],"state":{"label":"three things a static parser cannot resolve","before":{"title":"THE BLIND SPOTS, WITH ORDERFLOW EXAMPLES","view":{"type":"rows","columns":["situation","orderflow example","honest output"],"rows":[{"cells":["dynamic dispatch through a handler table","<code>subscribe(\"payment.settled\", send_receipt)</code>","the <code>subscribe</code> call, and <b>no edge</b> to <code>send_receipt</code>"],"tone":"bad"},{"cells":["untyped receiver","<code>POOL.execute(\"invoices\", …)</code>","<code>INFERRED</code> today; <code>AMBIGUOUS</code> the day a second <code>execute</code> exists"]},{"cells":["reflection","<code>getattr(mod, name)()</code>","no edge — the callee's name is not in the tree"],"tone":"bad"},{"cells":["a name-resolution ladder rung above the heuristic","<code>okf-rs generate --lsp</code>","resolves collisions via <code>textDocument/definition</code>; dispatch stays invisible"]}]}},"after":{"title":"WHY REFUSING IS THE FEATURE","view":{"type":"note","text":"A tool that guessed at these would produce more edges, more wrong edges, and no way to tell them apart — the graph-world version of M02's confidently-plausible retrieval. The value of the structural layer is not that it knows everything; it is that <b>it labels what it knows</b>. Ask any code-context tool which of its answers are facts and which are guesses. Most of them cannot say."}}}},{"title":"The honest tally","narrative":["Scale the same two passes to the whole repo and the numbers come out where you can check them: 36 nodes, 22 edges, <b>9 EXTRACTED, 13 INFERRED, 0 AMBIGUOUS</b> — plus two runtime dispatches that produce no edge at all, which is the row nobody puts in a benchmark table.","No LLM was involved in any of it. No API key exists in these files, the structural pass costs $0 in tokens, and running it twice produces identical output — which is what makes a graph diff in a pull request mean something.","The number to carry out of this module is not 22. It is the split. Every one of the thirteen guesses happens to be correct on a repo this clean, and \"happens to be\" is only sayable out loud because the extractor graded itself. That grading is the front half of Graphify, and M04 hands you the production version of it."],"youDo":"<code>python labs/shared_tools/kg_extract.py labs/sample-project</code>, then diff its <code>shared.auth</code> edges against the five you graded by hand. They must agree on <code>verify_token → decode_jwt (EXTRACTED)</code>.","source":"labs/shared_tools/kg_extract.py, labs/sample-project","terminal":[{"kind":"prompt","text":"python labs/shared_tools/kg_extract.py labs/sample-project --out graph.json"},{"kind":"out-pass","text":"Rebuilt: 36 nodes, 22 edges -> graph.json"},{"kind":"out","text":"  nodes: {'class': 4, 'function': 18, 'module': 14}"},{"kind":"out","text":"  edges: {'EXTRACTED': 9, 'INFERRED': 13}"},{"kind":"out-pass","text":"no LLM calls · no API key · identical output on re-run"}],"state":{"label":"orderflow · the whole repo","before":{"title":"WHAT THE EXTRACTOR CLAIMS, GRADED","view":{"type":"rows","columns":["grade","count","how much to trust it"],"rows":[{"cells":["<code>EXTRACTED</code>","9","parse-tree facts — act on them"],"tone":"win"},{"cells":["<code>INFERRED</code>","13","all correct here; verify before anything destructive"]},{"cells":["<code>AMBIGUOUS</code>","0","no name in orderflow is defined twice — enjoy it while it lasts"]},{"cells":["<i>no edge emitted</i>","2 event-bus dispatches","<code>send_receipt</code> and <code>send_completion_note</code> have zero callers in the graph and are called in production"],"tone":"bad"}]}},"after":{"title":"WHAT YOU BOUGHT WITH DETERMINISM","view":{"type":"rows","columns":["property","the structural pass","an LLM reading your files"],"rows":[{"cells":["API cost","$0 — no model is called","tokens for every file, on every pass"],"tone":"win"},{"cells":["hallucination rate in EXTRACTED edges","zero — a node existed in a tree","nonzero, and unlabeled"],"tone":"win"},{"cells":["re-run on unchanged source","identical output, so a graph diff is readable","shuffles"],"tone":"win"},{"cells":["dynamic dispatch","invisible — 2 edges missing here","an LLM might actually guess these right"],"tone":"bad"}]}}}}]},{"id":"kg-graphify-run","badge":"WALKTHROUGH","color":"#10B981","time":"~5 min","title":"One command over orderflow","spec":"M04 · extract → serve → ask","intro":"Install Graphify, point it at a fifteen-file monorepo, and watch a queryable map fall out of it. Then the part nobody puts in the demo: check whether it was worth doing.","provenance":{"kind":"illustrative","source":"a replayed session over labs/sample-project. The run log follows the shape documented in labs/M04-graphify-end-to-end/README.md; the node, edge, caller and community figures are reproducible with labs/shared_tools/kg_extract.py and checkable by hand against labs/sample-project/README.md. Steps 3, 4, 5 and 6 carry their own citations."},"foot":"Reproduce every step in <code>labs/M04-graphify-end-to-end/README.md</code> · the four-arm measured version is Capstone 2","steps":[{"title":"Install once, register the skill","narrative":["Two commands. The first puts the <code>graphify</code> binary on your PATH; the second is the one people skip and then wonder why <code>/graphify</code> does nothing in their assistant.","<code>graphify install</code> writes the skill registration for every AI assistant it finds on the machine — Claude Code, Cursor, Codex, Gemini CLI. Nothing is deployed and no key is asked for, because the code pass never calls a model."],"youDo":"Run <code>uv tool install graphifyy &amp;&amp; graphify install</code>. If <code>graphify: command not found</code> follows, your uv or pipx bin directory is not on PATH — that is the entire failure mode.","terminal":[{"kind":"prompt","text":"uv tool install graphifyy && graphify install"},{"kind":"out","text":"Installed 1 executable: graphify"},{"kind":"out-pass","text":"Registered /graphify skill with: claude-code, cursor"},{"kind":"out","text":"Tip: set MOONSHOT_API_KEY to use Kimi K2.6 for semantic extraction — 3x cheaper, richer graphs."}],"state":{"label":"what you just installed","before":{"title":"TWO SURFACES, ONE TOOL","view":{"type":"rows","columns":["surface","how you invoke it","costs tokens?"],"rows":[{"cells":["CLI","<code>graphify update .</code>","no — code pass is deterministic"],"tone":"win"},{"cells":["assistant skill","<code>/graphify .</code>","no, for the code pass"]},{"cells":["semantic pass","<code>/graphify --update</code>","yes — docs, PDFs, images only"],"tone":"bad"}]}}}},{"title":"Point it at orderflow","narrative":["<code>orderflow</code> is the course's running example: a B2B order-tracking monorepo with a billing service, an orders service, a notifications worker and three shared modules. Fifteen files, deliberately small enough that you can verify every edge by hand.","One command from the project root. No configuration file, no schema to declare, no index to warm up. Read the log closely — three of its lines encode design decisions rather than status."],"youDo":"<code>cd labs/sample-project</code> then <code>graphify update .</code> — or type <code>/graphify .</code> inside your assistant, which runs the same pass.","claudeSays":"With the skill registered, the assistant shells out to the same binary and then reads <code>graphify-out/GRAPH_REPORT.md</code> instead of opening your source files.","source":"labs/M04-graphify-end-to-end/README.md#step-1","terminal":[{"kind":"prompt","text":"cd labs/sample-project && graphify update ."},{"kind":"out","text":"Re-extracting code files in . (no LLM needed)..."},{"kind":"out","text":"[graphify watch] Rebuilt: 36 nodes, 22 edges, 3 communities"},{"kind":"out","text":"[graphify watch] graph.json, graph.html and GRAPH_REPORT.md updated in graphify-out"},{"kind":"out-pass","text":"Code graph updated. For doc/paper/image changes run /graphify --update in your AI assistant."}],"state":{"label":"labs/sample-project/","before":{"title":"BEFORE — source only","view":{"type":"rows","columns":["path","what it is"],"rows":[{"cells":["services/billing/","app.py · invoice.py · webhooks.py"]},{"cells":["services/orders/","orders.py · metrics.py"]},{"cells":["services/notifications/","worker.py"]},{"cells":["shared/","auth.py · db.py · events.py"]},{"cells":["docs/","architecture · ADR-001 · key-rotation runbook"]}]}},"after":{"title":"AFTER — plus graphify-out/","view":{"type":"rows","columns":["path","what it is"],"rows":[{"cells":["services/ · shared/ · docs/","unchanged — nothing was rewritten"]},{"cells":["graphify-out/graph.json","the machine layer · M09's MCP server loads this"],"new":true},{"cells":["graphify-out/graph.html","self-contained clickable graph for humans"],"new":true},{"cells":["graphify-out/GRAPH_REPORT.md","plain-language audit — subsystems, god nodes"],"new":true},{"cells":["graphify-out/cache/","so re-runs only touch changed files"],"new":true}]}}}},{"title":"36 nodes, 22 edges — and which ones are guesses","narrative":["Open <code>graph.json</code> and count. Thirty-six nodes: fourteen modules, eighteen functions, four classes. Twenty-two edges between them.","The number that matters is the split on the right. Nine edges are <b>EXTRACTED</b> — read straight off the syntax tree, 100% confidence. Thirteen are <b>INFERRED</b> — a heuristic matched a bare name to a definition and attached a confidence score. Graphify is the tool in this space that tells you which of its answers are facts and which are guesses, and on a repo this small you can audit every one."],"youDo":"Offline route, same numbers: <code>python labs/shared_tools/kg_extract.py labs/sample-project --out graph.json</code>. It prints the node-kind and provenance breakdowns you see here.","source":"labs/shared_tools/kg_extract.py, labs/sample-project/README.md","terminal":[{"kind":"prompt","text":"python labs/shared_tools/kg_extract.py labs/sample-project --out graph.json"},{"kind":"out","text":"Rebuilt: 36 nodes, 22 edges -> graph.json"},{"kind":"out","text":"  nodes: {'class': 4, 'function': 18, 'module': 14}"},{"kind":"out","text":"  edges: {'EXTRACTED': 9, 'INFERRED': 13}"}],"state":{"label":"graph.json · 36 nodes, 22 edges","before":{"title":"NODES BY KIND","view":{"type":"bars","unit":"nodes","max":18,"items":[{"label":"function","value":18,"note":"def statements across the 15 files"},{"label":"module","value":14,"note":"one per importable file, __init__ included"},{"label":"class","value":4,"note":"DatabasePool, AuthError, WebhookError, Invoice"}]}},"after":{"title":"EDGES BY PROVENANCE","view":{"type":"bars","unit":"edges","max":18,"items":[{"label":"EXTRACTED","value":9,"tone":"win","note":"off the AST · 100% confidence · zero hallucination risk"},{"label":"INFERRED","value":13,"tone":"bad","note":"bare-name resolution · carries a confidence score · audit these"}]}}}},{"title":"It rediscovers the architecture doc","narrative":["Leiden clustering runs on every build. On orderflow the 36 nodes fall into three communities that line up with <code>billing</code>, <code>orders</code> and <code>notifications</code> — the exact subsystem split <code>docs/architecture.md</code> claims, recovered from call edges alone with no doc in sight.","It also flags one <b>god node</b>: <code>shared/db.py</code>. Billing and orders both depend on it, and it carries the highest betweenness of any shared module. That is not a bug report. It is a blast-radius warning — a change there touches more of the repo than a change anywhere else."],"youDo":"Open <code>graphify-out/graph.html</code>, find the three colored clusters, then read <code>GRAPH_REPORT.md</code> and check it names the same three. If the two disagree, you have found M11's desync problem four modules early.","source":"labs/sample-project/README.md#ground-truth","state":{"label":"clusters vs the architecture doc","before":{"title":"WHAT THE GRAPH FOUND, WITHOUT READING DOCS","view":{"type":"rows","columns":["community","members","matches docs/architecture.md?"],"rows":[{"cells":["billing","app.py · invoice.py · webhooks.py","yes"],"tone":"win"},{"cells":["orders","orders.py · metrics.py","yes"],"tone":"win"},{"cells":["notifications","worker.py","yes"],"tone":"win"},{"cells":["god node","<code>shared/db.py</code> — bridges all three","the doc never says this"],"new":true}]}},"after":{"title":"WHAT THAT DOES AND DOESN'T MEAN","view":{"type":"note","text":"Communities are a <b>hypothesis about your architecture</b>, not a verdict on it. On orderflow they match the doc because orderflow is clean. On a legacy monolith the clusters will cut across your stated module boundaries — and that disagreement is the finding, not an error in the tool."}}}},{"title":"Ask it a caller question","narrative":["Artifacts on disk are potential energy. The kinetic form is a query. Ask the thing an agent asks constantly: <em>who calls this?</em>","The answer comes back as a small structured object — the symbol, its kind, where it lives, its callers, its callees, its transitive blast radius, and whether the name was ambiguous. Compare that to the alternative: grep <code>decode_jwt</code>, open every hit, read enough of each file to tell a real call site from a mention in a docstring."],"youDo":"<code>graphify query \"What components depend on DatabasePool?\"</code> and <code>graphify path \"post_invoice\" \"decode_jwt\"</code>. Check both answers against the ground-truth list at the bottom of <code>labs/sample-project/README.md</code> — at fifteen files you genuinely can.","claudeSays":"The assistant fetches the matching nodes and edges and reasons over <em>those</em>. <code>shared/auth.py</code> never enters the context window.","source":"labs/M09-mcp-graph-server/solution/server.py#selftest","terminal":[{"kind":"prompt","text":"who calls decode_jwt?"},{"kind":"tool","text":"explore(symbol=\"decode_jwt\")"},{"kind":"out-pass","text":"{\n  \"symbol\": \"decode_jwt\",\n  \"kind\": \"function\",\n  \"location\": \"shared/auth.py:16\",\n  \"callers\": [\"shared.auth.verify_token\"],\n  \"callees\": [\"shared.auth.AuthError\"],\n  \"blast_radius\": 2,\n  \"ambiguous\": false\n}"},{"kind":"claude","text":"One direct caller: verify_token, same file. That is the route every\nservice takes — billing's post_invoice calls verify_token, which calls\ndecode_jwt. Blast radius 2, and the name is unambiguous, so this is\nthe complete list rather than a sample."}],"state":{"label":"one structural question, two routes","before":{"title":"BEFORE — no graph","view":{"type":"rows","columns":["step","what it costs"],"rows":[{"cells":["<code>grep -rn decode_jwt</code>","a hit list with no call/mention distinction"]},{"cells":["open each candidate file","the whole file enters context, every time"],"tone":"bad"},{"cells":["read enough to confirm","and you still cannot prove the list is complete"],"tone":"bad"}]}},"after":{"title":"AFTER — ask the graph","view":{"type":"json","data":{"symbol":"decode_jwt","kind":"function","location":"shared/auth.py:16","callers":"shared.auth.verify_token","blast_radius":2},"highlight":["callers","blast_radius"]}}}},{"title":"The part the demo leaves out","narrative":["orderflow is fifteen files. It is far below the roughly 500-file line where graph tooling starts paying for itself, and the honest read of this whole walkthrough is that on <em>this</em> repo the graph is a teaching aid, not a saving.","Here is that claim measured rather than asserted. Capstone 2 ran the same four-arm campaign on a 36-file Spring Boot service: 48 fresh sessions, medians of three per cell. Every graph configuration lost. The best arm was one 55-line root <code>CLAUDE.md</code>.","So take the mechanics from this module and hold the multiple loosely. The vendor's 71.5x came from a 52-file corpus with a favourable query; independent replications land between 6.8x and 49x; below the floor you go backwards. Measure your own repo before you commit to a pipeline."],"youDo":"Ask your assistant one structural question about orderflow with and without <code>/graphify .</code>, and write down both token counts. That number is yours, and you reuse it in the capstone.","source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-priorauth.json, labs/CAPSTONE-2-java-token-benchmark/live_bench/SCENARIOS.md#worked-example-2","state":{"label":"measured · priorauth-api-boot3 · 36 files · 4 questions, medians of 3","before":{"title":"BELOW THE FLOOR, THE GRAPH LOSES","view":{"type":"rows","columns":["arm","all four questions","vs baseline"],"rows":[{"cells":["init — one 55-line root CLAUDE.md","565K","−10% · best arm"],"tone":"win"},{"cells":["baseline — Read/Glob/Grep only","629K","the control"]},{"cells":["graph available alongside files","855K","+36%"],"tone":"bad"},{"cells":["graph forced, no file access","1,156K","+84%"],"tone":"bad"}]}},"after":{"title":"WHY IT GOES THAT WAY AT 36 FILES","view":{"type":"note","text":"At this size grep answers a caller question in <b>two turns</b>, so there is barely anything for the graph to beat — while the graph is small, half its edges are AMBIGUOUS, and forced edge-walking burned 17 to 18 turns on the comprehension questions. Which lever wins is a property of <b>the repo and the question mix</b>, not of the tool. Same campaign on spring-framework's 9,195 files flips the answer."}}}}]},{"id":"kg-tool-landscape","badge":"WALKTHROUGH","color":"#06B6D4","time":"~5 min","title":"Three tools, one repo","spec":"M05 · same fifteen files, three artifacts","intro":"Point Graphify, CodeGraph and okf-rs at the same monorepo. They disagree about what a node is, where the graph should live, and how it stays fresh — and all three are right. The output is a decision table, not a ranking.","provenance":{"kind":"illustrative","source":"a replayed comparison over labs/sample-project. The node, edge and provenance counts are reproducible with labs/shared_tools/kg_extract.py; the seven-project table in step 4 is CodeGraph's own vendor-published benchmark, labelled as such in the narrative; step 5 carries its own measured citation."},"foot":"Build the matrix for your own repo with M05's four-step exercise — no lab folder, it runs on your real project.","steps":[{"title":"Three commands, three artifacts","narrative":["<code>orderflow</code> is fifteen files: a billing service, an orders service, a notifications worker, three shared modules, three docs. Small enough that you can check every answer by hand — which is the only way to compare tools honestly.","Run all three over it. Watch the counts on the right, because the first surprise arrives before you have asked a single question: <b>the three tools do not agree on how many things are in this repo</b>. That is not one of them being wrong. It is three different answers to \"what is a node?\""],"youDo":"<code>cd labs/sample-project</code>, then run the three builds in turn. Nothing here asks for an API key — every one of these passes is deterministic.","terminal":[{"kind":"prompt","text":"codegraph init -i"},{"kind":"out","text":"Parsing with tree-sitter — 15 files, 1 language (python)"},{"kind":"out-pass","text":".codegraph/codegraph.db written · 22 symbols · 22 edges · FTS5 index built"},{"kind":"out","text":"MCP integration configured for: claude-code, cursor"},{"kind":"prompt","text":"okf-rs generate ."},{"kind":"out-pass","text":"Generated 36 concepts into knowledge"},{"kind":"out","text":"  Module 14   Class 4   Function 18"},{"kind":"prompt","text":"graphify update ."},{"kind":"out-pass","text":"[graphify watch] Rebuilt: 36 nodes, 22 edges, 3 communities"}],"state":{"label":"labs/sample-project · after three builds","before":{"title":"BEFORE — fifteen source files","view":{"type":"rows","columns":["path","what it is"],"rows":[{"cells":["services/billing/","app.py · invoice.py · webhooks.py"]},{"cells":["services/orders/","orders.py · metrics.py"]},{"cells":["services/notifications/","worker.py"]},{"cells":["shared/","auth.py · db.py · events.py"]},{"cells":["docs/","architecture · ADR-001 · key-rotation runbook"]}]}},"after":{"title":"AFTER — three artifacts that count differently","view":{"type":"rows","columns":["tool","what it wrote","how many \"things\"","why that number"],"rows":[{"cells":["CodeGraph","<code>.codegraph/codegraph.db</code>","22 symbols","functions + classes — a module is a container, not a symbol"],"new":true},{"cells":["okf-rs","<code>knowledge/</code> — 36 <code>.md</code> files","36 concepts","one file per module, class and function; the module gets a file too"],"new":true},{"cells":["Graphify","<code>graphify-out/</code> — json + html + md","36 nodes","14 modules, 18 functions, 4 classes — modules are first-class nodes"],"new":true},{"cells":["all three","22 call/import edges","identical","the <em>relationships</em> agree; only the node vocabulary differs"],"tone":"win"}]}}}},{"title":"Ask the same question three ways","narrative":["Now the query surface — axis 5, and the axis you feel every day. Ask the question an agent asks constantly: <em>who calls <code>decode_jwt</code>?</em>","Three tools, three routes to the same true answer. CodeGraph answers in one MCP tool call with snippets attached. okf-rs answers by <em>being a file you can read</em> — <code>cat</code> the concept and the <code>CalledBy</code> list is already written down, no runtime involved. Graphify answers through its CLI or skill and hands back a structured object with a blast radius on it.","The differences are not cosmetic. One is a database you must query, one is text you can grep and diff in a pull request, one is an artifact set with a human-readable report. Pick by how your team actually works, not by which log line is prettiest."],"youDo":"Register the okf-rs server once — <code>claude mcp add okf-rs -- /path/to/okf-mcp /path/to/project</code> — then ask the same question through each surface and check all three against the ground-truth list at the bottom of <code>labs/sample-project/README.md</code>.","claudeSays":"Whichever surface answers, the assistant reasons over the returned relationships. <code>shared/auth.py</code> never enters the context window.","terminal":[{"kind":"tool","text":"codegraph · MCP: explore(symbol=\"decode_jwt\")"},{"kind":"out-pass","text":"1 caller: shared.auth.verify_token (auth.py:41) + 6 lines of surrounding source"},{"kind":"prompt","text":"cat knowledge/functions/shared/auth/decode_jwt.md"},{"kind":"out","text":"## Signature\n`def decode_jwt(token: str) -> dict`\n## CalledBy\n- [verify_token](../../../functions/shared/auth/verify_token.md)"},{"kind":"tool","text":"graphify · explore(symbol=\"decode_jwt\")"},{"kind":"out-pass","text":"{ \"callers\": [\"shared.auth.verify_token\"], \"blast_radius\": 2, \"ambiguous\": false }"}],"state":{"label":"one question, three query surfaces","before":{"title":"AXIS 5 — how agents and humans ask","view":{"type":"rows","columns":["tool","how you ask","what comes back","readable without the tool?"],"rows":[{"cells":["CodeGraph","single MCP call","entry points, related symbols, code snippets","no — it is a SQLite file"]},{"cells":["okf-rs","<code>okf-rs search</code>, <code>okf-mcp</code>, or just open the file","a Markdown concept with Calls / CalledBy","yes — <code>cat</code>, <code>grep</code>, GitHub renders it"],"tone":"win"},{"cells":["Graphify","CLI, <code>/graphify</code> skill, or MCP","structured object + a plain-language report","partly — GRAPH_REPORT.md is prose"]}]}},"after":{"title":"WHAT THAT DECIDES FOR YOU","view":{"type":"note","text":"If your team reviews knowledge the way it reviews code — in pull requests, line by line — okf-rs's substrate wins before any benchmark is opened, because a database diff is unreadable and a Markdown diff is a review comment. If your team wants an agent to get one answer with zero ceremony, CodeGraph's single-call surface wins. <b>Neither of those is a performance argument.</b>"}}}},{"title":"What each one will not tell you","narrative":["Every tool has a shape of question it answers confidently and wrongly. These are the failure modes, and they are the part no launch post contains.","Watch the terminal. <code>okf-rs validate</code> passing is a real signal — the bundle is well-formed, no dangling links, no Calls/CalledBy asymmetry. It is not a signal that the bundle is <em>true</em>. Those are different questions, and only the second one matters to an agent about to refactor your payments code."],"youDo":"Run the CI recipe the module gives you — <code>okf-rs generate --no-cache &amp;&amp; okf-rs validate --ci</code> — on a bundle you have not regenerated since your last commit. <code>--ci</code> hardens warnings into failures, which is the only setting worth running.","source":"labs/shared_tools/kg_extract.py, labs/sample-project/README.md","terminal":[{"kind":"prompt","text":"okf-rs validate"},{"kind":"out-pass","text":"knowledge — no issues found"},{"kind":"gate","text":"\"no issues found\" answers is it well-formed? — not is it still true?"},{"kind":"prompt","text":"okf-rs generate --no-cache && okf-rs validate --ci"},{"kind":"out-fail","text":"error: 4 concepts differ from a fresh generate — bundle is stale"}],"state":{"label":"the blind spot in each design","before":{"title":"FAILURE MODES, NOT FEATURE GAPS","view":{"type":"rows","columns":["tool","the blind spot","how it bites"],"rows":[{"cells":["CodeGraph","edges arrive unlabelled — axis 3","on orderflow, 13 of the 22 edges are name-resolution <b>guesses</b> and 9 are read off the syntax tree. CodeGraph hands you all 22 with the same confidence"],"tone":"bad"},{"cells":["okf-rs","deterministic, and exactly as current as your last <code>generate</code>","<code>--enrich</code> writes LLM prose into missing descriptions. It never overwrites an existing one, but it also never tells the reader which sentences a model wrote"],"tone":"bad"},{"cells":["Graphify","sync is hooks or manual — no watchers, no stale flag","the graph drifts from the code and nothing announces it. M11 is an entire postmortem on this"],"tone":"bad"},{"cells":["semantic index (Cursor)","no relationships at all","returns similarity-ranked <b>leads</b> the agent must verify by opening files, where a structural graph returns <b>answers</b>"],"tone":"bad"},{"cells":["CodeGraph, layer 3","the one design that handles its own failure","unsynced files are explicitly flagged <code>stale</code>, telling agents to read them directly. This is the layer everyone else is missing"],"tone":"win"}]}}}},{"title":"The best benchmark in the field, and the shape hiding in it","narrative":["CodeGraph's team published the most careful comparison anyone has run: seven real open-source projects in seven languages, identical exploration tasks, the same model in headless mode (<code>claude -p</code>), four runs per arm, medians reported, the sole variable being whether the graph was available. It is vendor-reported — read it as such — but the methodology is serious.","Aggregates: 57% fewer tokens, 71% fewer tool calls, 46% faster, 35% cheaper. Now stop reading the aggregate and read the spread. The per-project column runs from <b>13% to 90%</b>, and the ordering is not random.","Savings track repo size. Rust benefits most, because <code>mod</code> / <code>use</code> / <code>pub use</code> re-exports punish agent traversal hardest. And small repos see almost nothing — the ~500-file floor again, now with per-language evidence. Same model in both arms, so none of this is the model getting smarter; every saved token was mechanical exploration deleted."],"state":{"label":"CodeGraph's 7-project benchmark · vendor-reported, medians of 4 runs","before":{"title":"TOKEN CUT BY PROJECT — sorted by what it teaches","view":{"type":"rows","columns":["codebase","language","size","token cut","read it as"],"rows":[{"cells":["Excalidraw","TypeScript","~640 files","90%","3.5M tokens down to 344K"],"tone":"win"},{"cells":["Tokio","Rust","~790 files","86%","cost fell 82% ($2.41 → $0.42) — the module system is the reason"],"tone":"win"},{"cells":["VS Code","TypeScript","10,000 files","78%","2.8M down to 601K — the biggest haystack"],"tone":"win"},{"cells":["Alamofire","Swift","~110 files","64%","small but still well above the floor"]},{"cells":["Django","Python","~3,000 files","36%","large and below trend — scatter is real"]},{"cells":["Gin","Go","~110 files","34%","brute force is not that punishing at this size"],"tone":"bad"},{"cells":["OkHttp","Java","~645 files","13%","the marginal value of a map shrinks — this is the honest floor"],"tone":"bad"}]}},"after":{"title":"THE THREE PATTERNS","view":{"type":"note","text":"<b>1 — size correlates with savings.</b> The larger the haystack, the more an agent flails without a map. <b>2 — Rust benefits disproportionately</b>, because its module system creates the exploration paths that cost most to walk. <b>3 — small repos see diminishing returns</b>: 13% on OkHttp, 34% on Gin. Pair every one of those rows with the aggregate before you quote it, and notice that a 57% headline is doing a lot of work to hide a 13%."}}}},{"title":"The decision table — choosing, not ranking","narrative":["There is no winner row here, and any table that produces one is selling something. What there is, is a set of constraints you already have, each of which eliminates candidates before benchmarks are relevant.","Run your own requirement down the left column. Most teams find that two axes decide the whole thing and the other four are tie-breakers — and which two decide is a property of your organisation, not of the tools.","Then toggle to the pane that keeps you honest: on a repo below the floor, the correct answer is <b>none of them</b>, and the measured evidence for that is unkind to everything on this page."],"youDo":"Fill the six axes for your own repo: count files with <code>git ls-files | wc -l</code>, write the requirement your environment imposes on each axis, then install only the tool the matrix points to and verify three answers by hand.","source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-priorauth.json","state":{"label":"your constraint decides, not the leaderboard","before":{"title":"WHAT YOU NEED → WHAT SURVIVES","view":{"type":"rows","columns":["your requirement","the axis it hits","what is left standing"],"rows":[{"cells":["\"Proprietary code never leaves developer machines\"","4 · local vs cloud","Graphify, CodeGraph, okf-rs. Gemini Code Assist and Copilot indexing are out regardless of quality"],"tone":"win"},{"cells":["\"We review knowledge in pull requests\"","1 · substrate + 2 · sync","okf-rs — a git-diffable Markdown bundle, byte-deterministic, so a diff shows exactly what the code change changed"],"tone":"win"},{"cells":["\"One answer, one call, zero configuration\"","5 · query surface","CodeGraph — single MCP call, auto-detects your assistants at install"],"tone":"win"},{"cells":["\"I must know which edges are guesses\"","3 · provenance labelling","Graphify or okf-rs. CodeGraph does not label, so every edge reads as fact"]},{"cells":["\"Nobody will ever remember to rebuild\"","2 · sync model","CodeGraph — OS watchers, 2s debounce, and a stale flag that admits when it is behind"]},{"cells":["\"Our ADRs and PDFs are knowledge too\"","6 · multimodal reach","Graphify — docs, PDFs, images, video through an LLM pass. The other two are code-focused"]},{"cells":["\"We need a shared platform for 400 engineers\"","1 + 4","Sourcegraph — self-hosted server, real maintenance cost, wrong answer for one developer"]},{"cells":["\"Our repo is 300 files\"","none of them","you are under the floor. The tooling tax exceeds the savings; write a good <code>CLAUDE.md</code> instead"],"tone":"bad"}]}},"after":{"title":"MEASURED — the floor, on a real 36-file repo","view":{"type":"note","text":"Capstone 2 ran a four-arm campaign on a 36-file Spring Boot service: four questions, three fresh sessions per cell, <b>48 sessions</b>. Every graph configuration lost. The cheapest arm was a single 55-line root <code>CLAUDE.md</code>; the most expensive was the graph forced on with file access removed. That is the same finding CodeGraph's OkHttp row shows at 13%, arrived at independently and from the other direction. <b>The six axes tell you which tool. The file count tells you whether to install one at all.</b>"}}}}]},{"id":"kg-okf-spec","badge":"WALKTHROUGH","color":"#EC4899","time":"~5 min","title":"The concept lint rejected","spec":"M06 · one required field, and the gate that enforces it","intro":"Author an OKF concept from scratch, watch a thirty-line validator throw it out, and fix it. The spec asks for exactly one field — and it is the one everybody forgets, because the five optional ones look more important.","provenance":{"kind":"illustrative","source":"a replayed authoring session in labs/M06-okf-authoring/. Every terminal line matches the output format of labs/M06-okf-authoring/solution/validate.py; the final pass in step 6 carries its own citation."},"foot":"Do it for real in <code>labs/M06-okf-authoring/</code> — two concepts and the validator, 25–35 minutes.","steps":[{"title":"Choose the path — you have just named the concept","narrative":["Before a single character of the file exists, you make the decision that matters most: where it goes. In OKF <b>the file's path is its identity</b>. <code>analytics/metrics/weekly_active_users.md</code> <em>is</em> the concept's ID. There is no UUID, no catalog registry, no page number to keep in sync.","That sounds like a small choice and it kills an entire class of maintenance bug. Every system that mints synthetic IDs eventually drifts from reality — the page moved, the record was cloned, the pointer dangles. When the path is the ID, moving a file is renaming a concept: visible in Git, reviewable in a PR, greppable everywhere it is referenced.","You are documenting orderflow's Weekly Active Users metric — the definition whose absence caused M02's churn-rate disaster. Put it where a person would look for it."],"youDo":"<code>cd labs/M06-okf-authoring/starter</code>, then <code>mkdir -p knowledge/analytics/metrics</code> and open <code>knowledge/analytics/metrics/weekly_active_users.md</code>.","terminal":[{"kind":"prompt","text":"cd labs/M06-okf-authoring/starter"},{"kind":"prompt","text":"mkdir -p knowledge/analytics/metrics && $EDITOR knowledge/analytics/metrics/weekly_active_users.md"}],"state":{"label":"path = identity","before":{"title":"THE SAME CONCEPT, FOUR PLACES YOU COULD PUT IT","view":{"type":"rows","columns":["path","the ID it creates","verdict"],"rows":[{"cells":["<code>analytics/metrics/weekly_active_users.md</code>","analytics/metrics/weekly_active_users","where a human looks for a metric definition"],"tone":"win"},{"cells":["<code>docs/notes/metrics.md</code>","docs/notes/metrics","a dumping ground — one file, many concepts, no granularity to disclose progressively"],"tone":"bad"},{"cells":["<code>wau.md</code> at the bundle root","wau","conformant, and unfindable the moment the bundle has forty files"],"tone":"bad"},{"cells":["<code>analytics/metrics/wau_v2_FINAL.md</code>","analytics/metrics/wau_v2_FINAL","the ID now encodes a revision. Renaming it later renames the concept"],"tone":"bad"}]}},"after":{"title":"AND THE FIELD THAT LOOKS REQUIRED BUT IS NOT","view":{"type":"note","text":"Google's own reference concept carries an <code>id:</code> field in its frontmatter. It is <b>redundant with the path by design</b> — a convenience mirror some producers write, not the identity. If you add one and then move the file, you now have two sources of truth for one fact, which is precisely the drift OKF's path rule was invented to avoid. Write it only if a downstream consumer demands it."}}}},{"title":"Write the frontmatter you think you need","narrative":["Here is the draft almost everybody writes first. It is careful work: a real title, an honest description, the owning team, the date it was last touched. It reads like good documentation because it <em>is</em> good documentation.","It is also invalid, and you will not spot why by looking at it — which is the whole point of the next step. Note what the author reached for instinctively: the human-legible fields. The one field the spec actually demands is the least interesting one on the page."],"youDo":"Fill the stubbed frontmatter in the starter file, then write the body: the rolling 7-day window, completed orders only, and the tester exclusions from <code>services/orders/metrics.py</code>.","state":{"label":"knowledge/analytics/metrics/weekly_active_users.md · draft 1","before":{"title":"AS AUTHORED — reads fine, fails the spec","view":{"type":"diff","file":"knowledge/analytics/metrics/weekly_active_users.md","lines":[["a","---"],["a","title: Weekly Active Users (WAU)"],["a","description: Unique customers with at least one completed order in a rolling 7-day window, excluding internal test accounts."],["a","owner: data-eng@orderflow.internal"],["a","updated_at: 2026-08-24"],["a","---"],["a",""],["a","# Weekly Active Users (WAU)"],["a",""],["a","The total unique count of `customer_id` values with at least one completed"],["a","order whose `completed_at` falls inside a rolling 7-day window."],["a",""],["a","## Computation Rules"],["a","- Excludes internal test accounts: `cust_qa_1`, `cust_qa_2`, `cust_loadtest`."]]}}}},{"title":"Lint throws it out","narrative":["Thirty lines of Python, one hard rule. It walks every <code>.md</code> under <code>knowledge/</code>, skips the two reserved filenames, and refuses anything without a <code>type</code>.","Read the summary line carefully: <b>zero</b> concepts valid. Not \"one concept with a warning\" — the file does not count as a concept at all, because <code>type</code> is what tells a consumer what kind of thing it is holding. Everything else in that frontmatter is colour.","The exit code is the part that matters operationally. A lint that prints a red line and returns 0 is decoration; this one stops a pipeline."],"youDo":"<code>python validate.py knowledge</code>, then <code>echo $?</code> to confirm you actually got a non-zero exit and not just a scary-looking log line.","terminal":[{"kind":"prompt","text":"python validate.py knowledge"},{"kind":"out-fail","text":"ERROR knowledge/analytics/metrics/weekly_active_users.md: missing required field 'type'"},{"kind":"out","text":"0 concepts valid, 1 errors"},{"kind":"gate","text":"exit 1 — nothing downstream runs. No agent is allowed to read this bundle."}],"state":{"label":"what the spec asks for vs what you wrote","before":{"title":"THE OKF v0.1 FRONTMATTER CONTRACT","view":{"type":"rows","columns":["field","status","in your draft?"],"rows":[{"cells":["<code>type</code>","<b>REQUIRED</b> — the only one","missing"],"tone":"bad"},{"cells":["<code>title</code>","recommended","yes"]},{"cells":["<code>description</code>","recommended","yes"]},{"cells":["<code>resource</code>","recommended","missing"]},{"cells":["<code>tags</code>","recommended","missing"]},{"cells":["<code>timestamp</code>","recommended","missing"]},{"cells":["<code>owner</code>, <code>updated_at</code>","unknown keys — perfectly legal","yes, both"],"tone":"win"}]}}}},{"title":"One line fixes it — and reveals what the spec never asked for","narrative":["Add <code>type: metric</code>. That is the fix. The validator now counts a concept, and immediately starts telling you about things the spec does not care about at all.","Those <code>warn</code> lines are <b>your lint being stricter than the format</b>. OKF would happily accept a file whose entire frontmatter is <code>type: metric</code> — no title, no description, nothing. Your pipeline refuses to be that relaxed, and it says so without failing the build.","Learn to read the two levels apart. Errors are the spec's floor. Warnings are your team's standard. Confusing them is how teams end up either shipping garbage or arguing about a linter."],"youDo":"Add the required field, then close the three warnings by adding <code>resource: ../../sample-project/services/orders/metrics.py</code>, <code>tags: [analytics, orders, canonical]</code> and a <code>timestamp</code>.","terminal":[{"kind":"prompt","text":"python validate.py knowledge"},{"kind":"out","text":"warn  knowledge/analytics/metrics/weekly_active_users.md: missing recommended field 'resource'"},{"kind":"out","text":"warn  knowledge/analytics/metrics/weekly_active_users.md: missing recommended field 'tags'"},{"kind":"out","text":"warn  knowledge/analytics/metrics/weekly_active_users.md: missing recommended field 'timestamp'"},{"kind":"out-pass","text":"1 concepts valid, 0 errors"}],"state":{"label":"draft 1 → draft 2","before":{"title":"THE FIX — one required line, three recommended ones","view":{"type":"diff","file":"knowledge/analytics/metrics/weekly_active_users.md","lines":[["p","---"],["a","type: metric"],["p","title: Weekly Active Users (WAU)"],["p","description: Unique customers with at least one completed order in a rolling 7-day window, excluding internal test accounts."],["a","resource: ../../sample-project/services/orders/metrics.py"],["a","tags: [analytics, orders, canonical]"],["a","timestamp: 2026-08-24T00:00:00Z"],["m","owner: data-eng@orderflow.internal"],["m","updated_at: 2026-08-24"],["p","---"]]}},"after":{"title":"WHY THE LAST TWO LINES CAME OUT","view":{"type":"note","text":"<code>owner</code> and <code>updated_at</code> were legal — consumers must tolerate unknown keys — but <code>timestamp</code> now says the same thing as <code>updated_at</code>, and two fields carrying one fact is the drift you are here to prevent. <b>Keep unknown keys when they add information your team needs; delete them when they duplicate a recommended field.</b>"}}}},{"title":"The link is an edge — and nothing will ever check it for you","narrative":["A metric is not knowledge on its own. WAU reads the <code>orders_fact</code> table, and that relationship is what turns a folder of Markdown into a graph. You write it as an ordinary relative link and the folder becomes traversable.","OKF links are <b>untyped</b>: the link is just a link, and the relationship's meaning lives in the prose around it — \"reads\", \"joined with\", \"see also\". That is a deliberate ceiling. Track 2's AST edges are typed and verified; these are curated. You want both.","Now the trap. The spec says a conformant consumer <b>must not reject a bundle for broken links</b>. So write a link to a file that does not exist yet, and the format is perfectly happy. Only a check you wrote yourself will ever say a word."],"youDo":"Add <code>- See [orders_fact](../tables/orders_fact.md) for the fact table this metric reads.</code> under a <code>## Related Components</code> heading — before you have written <code>orders_fact.md</code>.","terminal":[{"kind":"prompt","text":"python validate.py knowledge"},{"kind":"out-pass","text":"1 concepts valid, 0 errors"},{"kind":"gate","text":"clean — and the only link in the bundle points at a file that does not exist"},{"kind":"prompt","text":"okf lint"},{"kind":"out","text":"knowledge/analytics/metrics/weekly_active_users.md"},{"kind":"out-fail","text":"  x link-resolves   dangling link -> ../tables/orders_fact.md"},{"kind":"out","text":"13 rules run, 1 error"}],"state":{"label":"conformant vs trustworthy","before":{"title":"WHAT THE SPEC TOLERATES BY DESIGN","view":{"type":"rows","columns":["the bundle contains","conformant?","who catches it"],"rows":[{"cells":["a missing optional field","yes — must not reject","your lint, as a warning"]},{"cells":["<code>type: Whatever-I-Invented</code>","yes — there is no type registry","your own canonical type list"],"tone":"bad"},{"cells":["frontmatter keys nobody recognises","yes — must not reject","review, if anyone is looking"]},{"cells":["a link to a file that does not exist","yes — must not reject","<b>nobody</b>, unless you write the check"],"tone":"bad"},{"cells":["no <code>type</code> at all","NO — the one hard rule","the spec itself"],"tone":"win"}]}},"after":{"title":"THE ASYMMETRY TO MEMORISE","view":{"type":"note","text":"The spec is lenient <b>so that adoption is easy</b> — a team can start with one file today and be conformant, which is why OKF spread in weeks while schema-registry predecessors stalled for years. Your pipeline must be strict <b>so that trust is possible</b>. A bundle of dangling links, drifted type names and year-old timestamps is still technically conformant, and nothing anywhere will error. That gap is M11's entire subject."}}}},{"title":"What a valid concept looks like when it passes","narrative":["Write the other side of the link — <code>orders_fact.md</code>, with its schema table, a Joins section and a link back to the metric — and run the gate on the whole bundle.","Two concepts, zero errors, both directions of the edge present. Read the finished WAU file once more as an agent would: forty tokens of frontmatter answer <em>is this relevant?</em>, the body carries the <b>audited exclusion rule itself</b> rather than a pointer to where the rule lives, and the link hands over the next hop. An agent computing WAU generates the right query on the first attempt and can cite the file, its timestamp and its owner.","That is the whole consumption stack. No SDK, no schema registry, no service — <code>cat</code> to read it, <code>git clone</code> to ship it, thirty lines to gate it."],"youDo":"<code>python validate.py knowledge</code> — you should see the exact line in <code>expected_output/sample_output.txt</code>. Then break it on purpose: delete <code>type:</code> from one file and confirm you get a non-zero exit and the offending path.","source":"labs/M06-okf-authoring/expected_output/sample_output.txt","terminal":[{"kind":"prompt","text":"python validate.py knowledge"},{"kind":"out-pass","text":"2 concepts valid, 0 errors"},{"kind":"prompt","text":"okf lint"},{"kind":"out-pass","text":"13 rules run, 0 errors"}],"state":{"label":"labs/M06-okf-authoring/solution/knowledge/","before":{"title":"BEFORE — one file, one dangling link","view":{"type":"rows","columns":["concept","type","links out","resolves?"],"rows":[{"cells":["analytics/metrics/weekly_active_users","metric","../tables/orders_fact.md","no"],"tone":"bad"}]}},"after":{"title":"AFTER — a two-node graph that lints clean","view":{"type":"rows","columns":["concept","type","links out","resolves?"],"rows":[{"cells":["analytics/metrics/weekly_active_users","metric","→ orders_fact (\"the fact table this metric reads\")","yes"],"tone":"win"},{"cells":["analytics/tables/orders_fact","table","→ weekly_active_users (\"Consumed By\")","yes"],"tone":"win","new":true},{"cells":["<em>the edge</em>","untyped","meaning carried by the prose beside the link","curated, not verified"]}]}}}}]},{"id":"kg-okf-codebase","badge":"WALKTHROUGH","color":"#8B5CF6","time":"~5 min","title":"Five concepts, not fifty","spec":"M07 · what deserves a file, and what is already free","intro":"Turn orderflow into an OKF bundle. The hard part is not the Markdown — it is saying no. A concept that restates a function signature costs real maintenance and buys nothing the AST did not already give you.","provenance":{"kind":"illustrative","source":"a replayed authoring session over labs/sample-project, targeting the bundle described in labs/M07-orderflow-bundle/README.md. The citations, contracts and decisions quoted are read from the real files in labs/sample-project/docs/; steps 4 and 5 carry their own citations."},"foot":"Build the whole bundle in <code>labs/M07-orderflow-bundle/</code> — five concepts, an index, and bidirectional links.","steps":[{"title":"Inventory the repo, then say no a lot","narrative":["orderflow has fifteen files, three services, thirty-six symbols and three documents. The naive move is one concept per file, and it is wrong. The right question for every candidate is a single test: <b>could a parser have told me this?</b>","If the answer is yes, the structural graph from Track 2 already knows it, for free, deterministically, and — crucially — it will still be right after the next refactor. A concept file that duplicates it is a second copy of one fact, maintained by hand, guaranteed to drift.","Curated narrative knowledge is the residue: the things that are true about this system and written nowhere in it. Contracts between services. Decisions and their consequences. Policy baked into a constant. Run the test down the list."],"youDo":"<code>ls -R labs/sample-project</code>, then for each candidate ask: is this derivable from the AST? If yes, it is not a concept.","terminal":[{"kind":"prompt","text":"ls -R labs/sample-project"},{"kind":"out","text":"services/billing/    app.py invoice.py webhooks.py\nservices/orders/     orders.py metrics.py\nservices/notifications/  worker.py\nshared/              auth.py db.py events.py\ndocs/                architecture.md adr-001-event-bus.md runbook-key-rotation.md"}],"state":{"label":"the derivability test","before":{"title":"COULD A PARSER HAVE TOLD ME THIS?","view":{"type":"rows","columns":["candidate","concept?","the reason"],"rows":[{"cells":["billing-service","yes","owns the <code>payment.settled</code> contract two other services depend on — a contract is an agreement, not a symbol"],"tone":"win"},{"cells":["orders-service","yes","owns the attested WAU computation; the tester exclusion list is a governance decision that happens to live in a constant"],"tone":"win"},{"cells":["notifications-service","yes","the consumer side of the contract — without it the edge only exists in one direction"],"tone":"win"},{"cells":["weekly_active_users (metric)","yes","the definition M02's churn disaster was missing. \"Excludes internal testers\" is policy, not code"],"tone":"win"},{"cells":["orders_fact (table)","yes","schema, join keys and who consumes it — the metric needs this to generate a correct query"],"tone":"win"},{"cells":["<code>decode_jwt</code>","no","the graph answers callers, callees and blast radius for free, and stays correct through refactors"],"tone":"bad"},{"cells":["<code>mark_paid</code>","no","a signature restated in prose. See the next two steps"],"tone":"bad"},{"cells":["the <code>Invoice</code> dataclass","no","the field list <em>is</em> the code. Copying it creates a second source of truth"],"tone":"bad"},{"cells":["<code>docs/adr-001-event-bus.md</code>","not a new concept","it is already a human-maintained source. <b>Cite</b> it from billing-service, do not paraphrase it"]},{"cells":["shared-libraries","not yet","the god node every service imports. M08's hook creates this one mechanically from the diff"]}]}},"after":{"title":"THE BUNDLE THAT SURVIVES THE TEST","view":{"type":"rows","columns":["path","type","what it holds that the code does not"],"rows":[{"cells":["<code>index.md</code>","reserved","one line per concept — the agent's pre-flight read"],"new":true},{"cells":["<code>services/billing-service.md</code>","Service","the contract, the ADR consequence, the rotation constraint"],"new":true},{"cells":["<code>services/orders-service.md</code>","Service","the attested computation and who reads it"],"new":true},{"cells":["<code>services/notifications-service.md</code>","Service","the back-link that closes the <code>payment.settled</code> edge"],"new":true},{"cells":["<code>analytics/metrics/weekly_active_users.md</code>","metric","the exclusion policy, from M06"],"new":true},{"cells":["<code>analytics/tables/orders_fact.md</code>","table","schema and joins, from M06"],"new":true},{"cells":["<code>log.md</code>","reserved","what the bundle learned, dated — not what the files changed"],"new":true}]}}}},{"title":"A concept that earns its file","narrative":["Here is <code>billing-service.md</code>. Read it once as a human, then read it again asking which sentences a parser could have produced. The answer is: almost none of them.","That the event bus is synchronous and in-process is in the code. That it was <b>chosen</b> over a broker, that events are lost on crash, and that going multi-process means replacing it and updating the <code>payment.settled</code> contract — that is ADR-001, and no AST will ever recover it. That <code>shared/auth.py</code> reads the signing key at import time, so a key rotation requires a rolling restart of billing — that is the runbook, and it is the difference between a safe deploy and an outage.","Notice the shape as much as the content: Responsibilities, then Dependencies, then Citations, in that order, in every Service concept. Consistency of body structure matters more to an agent than any individual field, because fifty identically-shaped files can be parsed mechanically and fifty differently-shaped ones become fifty interpretation problems."],"youDo":"Write the three Service concepts with byte-identical heading structure, then diff their headings to prove it: <code>grep '^#' knowledge/services/*.md</code>.","state":{"label":"knowledge/services/billing-service.md","before":{"title":"THE CONCEPT","view":{"type":"diff","file":"knowledge/services/billing-service.md","lines":[["a","---"],["a","type: Service"],["a","title: billing-service"],["a","description: Handles invoicing and payment webhooks."],["a","resource: services/billing"],["a","tags: [billing, payments, python]"],["a","timestamp: 2026-08-24T00:00:00Z"],["a","---"],["a",""],["a","# Responsibilities"],["a","Owns the Invoice domain model. Verifies every request via shared auth."],["a","Publishes `payment.settled` — a contract, not an implementation detail:"],["a","changing its payload breaks notifications-service silently, because a"],["a","failing handler is logged and skipped by design (ADR-001)."],["a",""],["a","# Dependencies"],["a","- Calls [shared auth](shared-libraries.md) to verify tokens."],["a","- Publishes `payment.settled`, consumed by [notifications-service](notifications-service.md)."],["a",""],["a","# Citations"],["a","[1] [ADR-001: in-process event bus](../../docs/adr-001-event-bus.md) — no durability;"],["a","    events are lost on crash. Multi-process means a broker and a new contract."],["a","[2] [Runbook: rotate the payments signing key](../../docs/runbook-key-rotation.md) —"],["a","    auth reads the key at import time, so rotation needs a rolling restart of billing."]]}},"after":{"title":"WHICH SENTENCE CAME FROM WHERE","view":{"type":"rows","columns":["claim in the concept","derivable from code?","source"],"rows":[{"cells":["billing calls shared auth","yes — an EXTRACTED edge","the graph. Kept because the concept is the agent's orientation map"],"tone":"bad"},{"cells":["<code>payment.settled</code> is a <b>contract</b>","no","a human decision about what other teams may rely on"],"tone":"win"},{"cells":["a failing consumer is skipped <em>by design</em>","the behaviour is; the intent is not","ADR-001, accepted 2026-05-14"],"tone":"win"},{"cells":["events are lost on crash","no","ADR-001 Consequences — the thing that bites at 3am"],"tone":"win"},{"cells":["rotation needs a rolling restart","no","the key-rotation runbook, written by whoever did it last"],"tone":"win"}]}}}},{"title":"A concept that wastes its file","narrative":["Now the one that looks productive and is not. Someone works down <code>invoice.py</code> writing a concept per function, and produces this.","Every sentence in it is already in the repository twice — once in the source and once in the graph — and the graph's copy is better: it is complete, it carries provenance, and it updates when the code does. This copy is prose, it is unversioned against the function it describes, and it is <b>silently wrong the moment somebody renames the parameter</b>.","Toggle the panes. Same fact, two costs. The bundle version costs an author, a reviewer, and an ongoing maintenance obligation nobody scheduled. The graph version costs one query."],"youDo":"Try the test on your own draft bundle: for each concept, delete it and ask whether an agent with the structural graph would notice. If the answer is no, it was never knowledge.","state":{"label":"the same fact, bought twice","before":{"title":"THE WASTEFUL CONCEPT — hand-written, will rot","view":{"type":"stack","views":[{"type":"diff","file":"knowledge/functions/mark_paid.md","lines":[["a","---"],["a","type: Function"],["a","title: mark_paid"],["a","resource: services/billing/invoice.py"],["a","---"],["a",""],["a","# Responsibilities"],["a","Marks an invoice as paid. Takes an `invoice_id` string and returns the"],["a","invoice as a dict. Raises `KeyError` if the invoice is unknown."],["a",""],["a","# Dependencies"],["a","- Queries the shared database pool."]]},{"type":"note","text":"Author cost: ten minutes. Review cost: someone must check it against the source. Maintenance cost: <b>forever</b>, and nothing will tell you when it stops being true. Rename <code>invoice_id</code> and this file lies with a straight face, having passed every lint rule in the bundle."}]}},"after":{"title":"THE SAME FACT, ALREADY FREE","view":{"type":"stack","views":[{"type":"json","data":{"symbol":"mark_paid","kind":"function","location":"services/billing/invoice.py:31","signature":"mark_paid(invoice_id: str) -> dict","callers":"services.billing.webhooks.handle_payment_webhook","callees":"shared.db.POOL.query","provenance":"EXTRACTED"},"highlight":["signature","callers","provenance"]},{"type":"note","text":"Author cost: zero. Maintenance cost: zero — it is regenerated from the syntax tree. And it answers a question the concept file never could: <b>who calls this</b>, completely, with the provenance label saying the edge was read off the AST rather than guessed."}]}}}},{"title":"index.md — the file the agent reads before touching the repo","narrative":["The index is not a table of contents for humans. It is the pre-flight read: title and one-line description per concept, pulled straight from frontmatter, and nothing else. An agent reads it, decides which one concept the task needs, and loads that.","Here is the arithmetic on orderflow, measured rather than asserted. The whole of <code>services/</code> and <code>shared/</code> is 9,798 characters across fourteen Python files — call it <b>2,450 tokens</b> to read the codebase cold. The M06 concept files measure 876 and 920 characters, so a real concept costs about <b>220 tokens</b>. Index plus one concept lands near 400.","Be honest about what that ratio proves: about six-to-one on a fifteen-file toy, which is not a business case. What matters is the <em>slope</em>. The source side grows with every file you add; the index grows by one line per concept and the agent still loads exactly one. On a thousand-file repo that is the difference between working and overflowing."],"youDo":"Count it yourself: <code>wc -c labs/sample-project/services/*/*.py labs/sample-project/shared/*.py</code> against <code>wc -c knowledge/index.md knowledge/services/billing-service.md</code>. Record both — the capstone reuses them.","source":"labs/sample-project, labs/M06-okf-authoring/solution/knowledge, labs/M07-orderflow-bundle/README.md","terminal":[{"kind":"prompt","text":"cat knowledge/index.md"},{"kind":"out","text":"# orderflow\n\n* [billing-service](services/billing-service.md) - invoicing and payment webhooks\n* [orders-service](services/orders-service.md) - order lifecycle and canonical metrics\n* [notifications-service](services/notifications-service.md) - consumes payment.settled\n* [weekly_active_users](analytics/metrics/weekly_active_users.md) - the attested WAU computation\n* [orders_fact](analytics/tables/orders_fact.md) - one row per completed order"},{"kind":"prompt","text":"add a retry to the payment webhook"},{"kind":"tool","text":"Read  knowledge/index.md"},{"kind":"tool","text":"Read  knowledge/services/billing-service.md"},{"kind":"claude","text":"Before I open any source: billing owns Invoice, verifies via shared\nauth, and publishes payment.settled which notifications consumes. A\nretry must not re-publish the event twice — ADR-001 says the bus has\nno durability and consumers are fire-and-forget. Opening webhooks.py\nnow, knowing what I must not break."}],"state":{"label":"measured · orderflow","before":{"title":"TWO WAYS TO LEARN THE SAME TERRITORY","view":{"type":"bars","unit":"tokens","max":2450,"items":[{"label":"read the source","value":2450,"tone":"bad","note":"9,798 characters across 14 .py files in services/ and shared/ — measured"},{"label":"index + 1 concept","value":400,"tone":"win","note":"~180 for the index, ~220 for one concept — concept sizes measured from the M06 solution files"}]}},"after":{"title":"THE HONEST READ","view":{"type":"note","text":"Six-to-one on fifteen files is a teaching number, not a saving — the same ~500-file floor that undercuts every tool in M05 applies to bundles too. The claim worth defending is different and stronger: <b>the pre-flight cost is bounded by the task, not by the repo.</b> Add nine hundred more files and the agent still reads one index line and one concept. That is why an index bloated with detail is a real bug: it re-couples the read to the size of the bundle."}}}},{"title":"Lint it — then check the direction nobody checks","narrative":["Five concepts, zero errors. That is the gate from M06 doing exactly its job, and it is worth being clear about what it proved: the bundle is <em>well-formed</em>. It did not prove the bundle is complete.","Here is the gap. <code>billing-service.md</code> says it publishes <code>payment.settled</code> and links to notifications. Does <code>notifications-service.md</code> link back? Nothing in the spec requires it, no lint rule you have written checks it, and an agent that loads only the notifications concept will never learn that billing depends on it. <b>One-directional links are how bundles silently rot.</b>","Fix it, then run the harder check: rename a linked file without updating its inbound links and confirm your dangling-link rule fails. If it passes, you have built a linter that agrees with you."],"youDo":"<code>python ../M06-okf-authoring/solution/validate.py knowledge</code>, then <code>grep -c \"billing-service.md\" knowledge/services/notifications-service.md</code> and make that number 1.","source":"labs/M07-orderflow-bundle/README.md","terminal":[{"kind":"prompt","text":"python ../M06-okf-authoring/solution/validate.py knowledge"},{"kind":"out-pass","text":"5 concepts valid, 0 errors"},{"kind":"gate","text":"well-formed. Now: does every edge exist from both ends?"},{"kind":"prompt","text":"grep -c \"billing-service.md\" knowledge/services/notifications-service.md"},{"kind":"out-fail","text":"0"},{"kind":"out","text":"# add: \"- Consumes `payment.settled` from [billing-service](billing-service.md).\""},{"kind":"prompt","text":"grep -c \"billing-service.md\" knowledge/services/notifications-service.md"},{"kind":"out-pass","text":"1"}],"state":{"label":"curated is not verified","before":{"title":"WHAT THE BUNDLE CLAIMS vs WHAT THE AST KNOWS","view":{"type":"rows","columns":["edge","in the bundle","in the graph","reading"],"rows":[{"cells":["billing → shared auth","yes","EXTRACTED","agree — orientation and proof"],"tone":"win"},{"cells":["billing → notifications (<code>payment.settled</code>)","yes","no direct call edge — it goes through the bus","<b>the bundle is right</b>; the AST cannot see a runtime contract"],"tone":"win"},{"cells":["notifications → billing","missing until you add it","n/a","the rot: one end of a real edge documented, the other silent"],"tone":"bad"},{"cells":["everything → <code>shared/db.py</code>","not mentioned anywhere","the god node, bridging all three communities","<b>the AST is right</b>; nobody thought to write it down"],"tone":"bad"}]}},"after":{"title":"WHEN THEY DISAGREE","view":{"type":"note","text":"The AST is right about <b>structure</b>; the bundle is right about <b>why</b> — and the disagreement itself is a maintenance signal, not an error in either. Use the links for orientation and intent; use the verified edges for impact analysis you are going to bet a refactor on. A bundle that is asked to do the second job will confidently tell an agent that billing has two dependencies on the sprint somebody added a third."}}}}]},{"id":"kg-enrichment-hook","badge":"WALKTHROUGH","color":"#10B981","time":"~6 min","title":"The hook that fires, and the one that doesn't","spec":"M08 · commit → diff scope → refresh → lint → publish","intro":"Install the post-commit hook, watch one file change refresh exactly one concept, then meet the version that exits 0 and does nothing at all. The second one is the reason this module exists.","provenance":{"kind":"illustrative","source":"a replayed session over labs/sample-project with labs/M08-enrichment-hook/solution/ installed. The dependency lines and edge counts in step 2 are reproduced from a real run of labs/shared_tools/kg_extract.py; the gate output in step 5 is the exact output format of labs/M11-freshness-gate/solution/freshness_gate.py. Steps 2, 3 and 5 carry their own citations."},"foot":"Install it, then break it twice, in <code>labs/M08-enrichment-hook/</code> — and keep the freshness gate from <code>labs/M11-freshness-gate/</code> next to it.","steps":[{"title":"Install the loop","narrative":["Three commands: make orderflow a git repo, drop the hook in, make it executable. There is nothing clever in the hook — twelve lines of <code>sh</code> — and the interesting part is everything it deliberately refuses to do.","No <code>nohup</code>. No backgrounding. No <code>|| true</code>. No \"skip if the machine is busy\". Every one of those is a reasonable-looking line that converts a failed refresh into silent drift, and every one of them appears in real setups. Loud and synchronous beats quiet and detached.","One line does deserve attention: <code>PYTHON=\"${ORDERFLOW_PYTHON:-python}\"</code>. Hooks run with a minimal environment, <b>outside any activated virtualenv</b>, where <code>python</code> and <code>python3</code> can be different installs with different packages. Pinning the interpreter is not fussiness; it is the difference between a hook that works on your machine and a hook that works."],"youDo":"<code>cd labs/sample-project</code> · <code>git init -q &amp;&amp; git add -A &amp;&amp; git commit -qm \"baseline\"</code> · <code>cp ../M08-enrichment-hook/solution/post-commit .git/hooks/post-commit</code> (then <code>chmod +x</code> on macOS or Linux).","terminal":[{"kind":"prompt","text":"cd labs/sample-project && git init -q && git add -A && git commit -qm \"baseline\""},{"kind":"prompt","text":"cp ../M08-enrichment-hook/solution/post-commit .git

  }
})(window);

WT.register([{"id":"kg-147-files","badge":"WALKTHROUGH","color":"#D4A843","time":"~4 min","title":"The 147-file bug fix","spec":"M00 · exploration vs reasoning","intro":"A three-line fix that cost a hundred and seventy thousand tokens to find. Step through the session and watch where the money actually goes.","provenance":{"kind":"illustrative","source":"the session is a narrated composite; steps 5-6 carry measured numbers, cited per step"},"foot":"The measured version of this comparison is Capstone 2 · <code>live_bench/SCENARIOS.md</code>","steps":[{"title":"The ask — three lines, if you knew where they were","narrative":["A developer asks their coding agent to fix a session-timeout bug in the authentication middleware. The fix will turn out to be <b>three lines</b>: one wrong comparison operator, plus a small test that pins it.","Nobody knows that yet — least of all the agent. Watch the context window on the right: right now it holds a system prompt, the tool definitions, and the question. That is the whole budget being spent on <em>thinking</em>."],"youDo":"Ask for the fix the way you actually would — in one sentence, with no map attached.","terminal":[{"kind":"prompt","text":"sessions are timing out early — find and fix it in the auth middleware"},{"kind":"claude","text":"I'll locate the session-timeout logic first. Starting with the auth\nmiddleware, then following whatever it depends on."}],"state":{"label":"context window · turn 1","before":{"title":"BEFORE — nothing but the question","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":1200},{"label":"tool defs","tokens":1180},{"label":"history","tokens":0},{"label":"file reads","tokens":0},{"label":"your turn","tokens":60}],"note":"1% full. Every token in here is doing useful work."}}}},{"title":"It starts reading","narrative":["The agent greps, opens a file, finds an import, opens that one too. It reads the logging system. It reads the database migration history. It reads half the API endpoints. For reasons known only to itself, it reads the Terraform configs.","Every one of those was a <em>reasonable guess</em>. With no map of the codebase, following imports outward is the only search strategy available. Toggle <b>Before / After</b> to see what forty more file reads does to the window."],"claudeSays":"Each read is cheap on its own — a few hundred to a few thousand tokens. It is the fan-out that costs, and the fan-out has no stopping rule.","terminal":[{"kind":"tool","text":"Grep  \"timeout\"  (68 matches across 41 files)"},{"kind":"tool","text":"Read  src/auth/middleware.py"},{"kind":"tool","text":"Read  src/auth/session.py"},{"kind":"tool","text":"Read  src/config/settings.py"},{"kind":"out","text":"… 34 more Read calls"},{"kind":"tool","text":"Read  infra/terraform/redis.tf"},{"kind":"claude","text":"Still narrowing. The timeout constant is referenced in several\nplaces and I can't yet tell which one the middleware honours."}],"state":{"label":"context window · turn 12","before":{"title":"BEFORE — four files in","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":1200},{"label":"tool defs","tokens":1180},{"label":"history","tokens":900},{"label":"file reads","tokens":9400},{"label":"your turn","tokens":60}],"note":"6% full, and still nothing that answers the question."}},"after":{"title":"AFTER — forty more files","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":1200},{"label":"tool defs","tokens":1180},{"label":"history","tokens":8600},{"label":"file reads","tokens":74000},{"label":"your turn","tokens":60}],"highlight":["file reads"],"note":"43% full. The file-reads layer now dwarfs everything the agent is actually reasoning with."}}}},{"title":"Escape at 147","narrative":["The developer watches the file counter climb — 50, 90, 120 — and hits Escape at file <b>147</b>. No fix, no diagnosis, and a bill.","The natural reaction is to blame the model: <em>it's not smart enough to know where to look.</em> Hold that thought for one more step, because the diagnosis is wrong and the wrongness is the whole point of this course."],"terminal":[{"kind":"tool","text":"Read  src/api/reports/export.py"},{"kind":"out","text":"files read: 147"},{"kind":"gate","text":"⎋  interrupted by user"},{"kind":"out-fail","text":"no fix proposed · 176,400 tokens spent · $0.53"}],"state":{"label":"where the tokens went","before":{"title":"THE SPLIT — exploration vs reasoning","view":{"type":"bars","unit":"tokens","items":[{"label":"exploration","value":173300,"tone":"bad","note":"finding things: greps, reads, and the transcript of both"},{"label":"reasoning","value":3100,"tone":"win","note":"actually thinking about the bug"}]}}}},{"title":"The diagnosis: no map, not low IQ","narrative":["Look at what the agent read against what it needed. It was not being stupid; it was doing exactly what any competent newcomer does on their first day in an unfamiliar codebase — opening things to find out what they are.","A newcomer only does that <b>once</b>. They build a mental map and never pay the cost again. An agent starts every session at zero. <b>That</b> is the problem this course exists to solve: not a smarter model, a durable map."],"state":{"label":"read vs needed","before":{"title":"147 files opened","view":{"type":"rows","columns":["what it read","files","was it needed?"],"rows":[{"cells":["auth middleware + session","6","yes — the fix is here"],"tone":"win"},{"cells":["config &amp; settings","11","partly — one constant"]},{"cells":["API endpoints","48","no"],"tone":"bad"},{"cells":["logging &amp; telemetry","22","no"],"tone":"bad"},{"cells":["database migrations","31","no"],"tone":"bad"},{"cells":["Terraform / infra","29","no"],"tone":"bad"}]}}}},{"title":"The same question, with a map","narrative":["Now the measured version. On <b>spring-framework</b> — 9,195 Java files — we asked a mechanical benchmark the structural question an agent asks constantly: <em>who calls this method?</em>","Without a graph, answering for <code>registerBeanDefinition</code> means 174 file operations and 764,534 tokens of source. With a structural graph already built, it is <b>one lookup</b> returning all 1,037 callers.","Toggle Before / After. The reduction here is 93.9% — a 16.4× multiple — and it is the honest middle of the range, not the headline."],"youDo":"Reproduce this yourself in Capstone 2: extract the graph, then run <code>measure_tokens.py</code> against your own repo.","terminal":[{"kind":"prompt","text":"who calls registerBeanDefinition?"},{"kind":"tool","text":"graph_callers(symbol=\"registerBeanDefinition\")"},{"kind":"out-pass","text":"1037 callers · 1 operation · 46,540 tokens"},{"kind":"claude","text":"Callers are concentrated in three clusters: XML definition readers,\nannotation scanners, and the test fixtures. Here they are by module…"}],"source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/bench-spring.json#registerBeanDefinition","state":{"label":"spring-framework · 9,195 files","before":{"title":"BEFORE — read your way to the answer","view":{"type":"bars","unit":"tokens","max":764534,"items":[{"label":"no graph","value":764534,"tone":"bad","note":"174 file operations"}]}},"after":{"title":"AFTER — ask the graph","view":{"type":"bars","unit":"tokens","max":764534,"items":[{"label":"no graph","value":764534,"tone":"bad","note":"174 file operations"},{"label":"graph","value":46540,"tone":"win","note":"1 operation · 1,037 callers found · 93.9% less"}]}}}},{"title":"And the caveat that keeps you honest","narrative":["That 16.4× is a <b>mechanical</b> measurement: whole-file reading versus one graph call. Real agents are cleverer than that — their grep returns matching <em>lines</em>, not whole files — so the live numbers are far less flattering.","Here is the same structural question run through actual agent sessions. The graph arm used <b>more</b> tokens than the baseline, because the agent still explored around the graph's answer. Below roughly 500 files, the tooling tax exceeds the savings entirely.","You will meet the full four-arm comparison in Capstone 2. For now, take the shape of the problem — most of your bill is exploration — and treat every published multiple with suspicion, including ours."],"source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-summary.json#S1","state":{"label":"live agent sessions · S1 \"who calls registerBeanDefinition\"","before":{"title":"MEASURED — median of independent fresh sessions","view":{"type":"rows","columns":["arm","turns","tokens read","cost","verdict"],"rows":[{"cells":["baseline (grep + read)","4","100,791","$0.093","both answered correctly"],"tone":"win"},{"cells":["graph tools offered","5","187,112","$0.138","+86% tokens, same answer"],"tone":"bad"}]}},"after":{"title":"WHAT TO TAKE FROM IT","view":{"type":"note","text":"A map is not automatically cheaper — it is cheaper when the question is structural, the repo is large, and the agent is told to prefer the graph over grep. Getting those three conditions right is what the next thirteen modules are for."}}}}]},{"id":"kg-graphify-run","badge":"WALKTHROUGH","color":"#10B981","time":"~5 min","title":"One command over orderflow","spec":"M04 · extract → serve → ask","intro":"Install Graphify, point it at a fifteen-file monorepo, and watch a queryable map fall out of it. Then the part nobody puts in the demo: check whether it was worth doing.","provenance":{"kind":"illustrative","source":"a replayed session over labs/sample-project. The run log follows the shape documented in labs/M04-graphify-end-to-end/README.md; the node, edge, caller and community figures are reproducible with labs/shared_tools/kg_extract.py and checkable by hand against labs/sample-project/README.md. Steps 3, 4, 5 and 6 carry their own citations."},"foot":"Reproduce every step in <code>labs/M04-graphify-end-to-end/README.md</code> · the four-arm measured version is Capstone 2","steps":[{"title":"Install once, register the skill","narrative":["Two commands. The first puts the <code>graphify</code> binary on your PATH; the second is the one people skip and then wonder why <code>/graphify</code> does nothing in their assistant.","<code>graphify install</code> writes the skill registration for every AI assistant it finds on the machine — Claude Code, Cursor, Codex, Gemini CLI. Nothing is deployed and no key is asked for, because the code pass never calls a model."],"youDo":"Run <code>uv tool install graphifyy &amp;&amp; graphify install</code>. If <code>graphify: command not found</code> follows, your uv or pipx bin directory is not on PATH — that is the entire failure mode.","terminal":[{"kind":"prompt","text":"uv tool install graphifyy && graphify install"},{"kind":"out","text":"Installed 1 executable: graphify"},{"kind":"out-pass","text":"Registered /graphify skill with: claude-code, cursor"},{"kind":"out","text":"Tip: set MOONSHOT_API_KEY to use Kimi K2.6 for semantic extraction — 3x cheaper, richer graphs."}],"state":{"label":"what you just installed","before":{"title":"TWO SURFACES, ONE TOOL","view":{"type":"rows","columns":["surface","how you invoke it","costs tokens?"],"rows":[{"cells":["CLI","<code>graphify update .</code>","no — code pass is deterministic"],"tone":"win"},{"cells":["assistant skill","<code>/graphify .</code>","no, for the code pass"]},{"cells":["semantic pass","<code>/graphify --update</code>","yes — docs, PDFs, images only"],"tone":"bad"}]}}}},{"title":"Point it at orderflow","narrative":["<code>orderflow</code> is the course's running example: a B2B order-tracking monorepo with a billing service, an orders service, a notifications worker and three shared modules. Fifteen files, deliberately small enough that you can verify every edge by hand.","One command from the project root. No configuration file, no schema to declare, no index to warm up. Read the log closely — three of its lines encode design decisions rather than status."],"youDo":"<code>cd labs/sample-project</code> then <code>graphify update .</code> — or type <code>/graphify .</code> inside your assistant, which runs the same pass.","claudeSays":"With the skill registered, the assistant shells out to the same binary and then reads <code>graphify-out/GRAPH_REPORT.md</code> instead of opening your source files.","source":"labs/M04-graphify-end-to-end/README.md#step-1","terminal":[{"kind":"prompt","text":"cd labs/sample-project && graphify update ."},{"kind":"out","text":"Re-extracting code files in . (no LLM needed)..."},{"kind":"out","text":"[graphify watch] Rebuilt: 36 nodes, 22 edges, 3 communities"},{"kind":"out","text":"[graphify watch] graph.json, graph.html and GRAPH_REPORT.md updated in graphify-out"},{"kind":"out-pass","text":"Code graph updated. For doc/paper/image changes run /graphify --update in your AI assistant."}],"state":{"label":"labs/sample-project/","before":{"title":"BEFORE — source only","view":{"type":"rows","columns":["path","what it is"],"rows":[{"cells":["services/billing/","app.py · invoice.py · webhooks.py"]},{"cells":["services/orders/","orders.py · metrics.py"]},{"cells":["services/notifications/","worker.py"]},{"cells":["shared/","auth.py · db.py · events.py"]},{"cells":["docs/","architecture · ADR-001 · key-rotation runbook"]}]}},"after":{"title":"AFTER — plus graphify-out/","view":{"type":"rows","columns":["path","what it is"],"rows":[{"cells":["services/ · shared/ · docs/","unchanged — nothing was rewritten"]},{"cells":["graphify-out/graph.json","the machine layer · M09's MCP server loads this"],"new":true},{"cells":["graphify-out/graph.html","self-contained clickable graph for humans"],"new":true},{"cells":["graphify-out/GRAPH_REPORT.md","plain-language audit — subsystems, god nodes"],"new":true},{"cells":["graphify-out/cache/","so re-runs only touch changed files"],"new":true}]}}}},{"title":"36 nodes, 22 edges — and which ones are guesses","narrative":["Open <code>graph.json</code> and count. Thirty-six nodes: fourteen modules, eighteen functions, four classes. Twenty-two edges between them.","The number that matters is the split on the right. Nine edges are <b>EXTRACTED</b> — read straight off the syntax tree, 100% confidence. Thirteen are <b>INFERRED</b> — a heuristic matched a bare name to a definition and attached a confidence score. Graphify is the tool in this space that tells you which of its answers are facts and which are guesses, and on a repo this small you can audit every one."],"youDo":"Offline route, same numbers: <code>python labs/shared_tools/kg_extract.py labs/sample-project --out graph.json</code>. It prints the node-kind and provenance breakdowns you see here.","source":"labs/shared_tools/kg_extract.py, labs/sample-project/README.md","terminal":[{"kind":"prompt","text":"python labs/shared_tools/kg_extract.py labs/sample-project --out graph.json"},{"kind":"out","text":"Rebuilt: 36 nodes, 22 edges -> graph.json"},{"kind":"out","text":"  nodes: {'class': 4, 'function': 18, 'module': 14}"},{"kind":"out","text":"  edges: {'EXTRACTED': 9, 'INFERRED': 13}"}],"state":{"label":"graph.json · 36 nodes, 22 edges","before":{"title":"NODES BY KIND","view":{"type":"bars","unit":"nodes","max":18,"items":[{"label":"function","value":18,"note":"def statements across the 15 files"},{"label":"module","value":14,"note":"one per importable file, __init__ included"},{"label":"class","value":4,"note":"DatabasePool, AuthError, WebhookError, Invoice"}]}},"after":{"title":"EDGES BY PROVENANCE","view":{"type":"bars","unit":"edges","max":18,"items":[{"label":"EXTRACTED","value":9,"tone":"win","note":"off the AST · 100% confidence · zero hallucination risk"},{"label":"INFERRED","value":13,"tone":"bad","note":"bare-name resolution · carries a confidence score · audit these"}]}}}},{"title":"It rediscovers the architecture doc","narrative":["Leiden clustering runs on every build. On orderflow the 36 nodes fall into three communities that line up with <code>billing</code>, <code>orders</code> and <code>notifications</code> — the exact subsystem split <code>docs/architecture.md</code> claims, recovered from call edges alone with no doc in sight.","It also flags one <b>god node</b>: <code>shared/db.py</code>. Every service imports it, so it bridges all three clusters. That is not a bug report. It is a blast-radius warning — a change there touches more of the repo than a change anywhere else."],"youDo":"Open <code>graphify-out/graph.html</code>, find the three colored clusters, then read <code>GRAPH_REPORT.md</code> and check it names the same three. If the two disagree, you have found M11's desync problem four modules early.","source":"labs/sample-project/README.md#ground-truth","state":{"label":"clusters vs the architecture doc","before":{"title":"WHAT THE GRAPH FOUND, WITHOUT READING DOCS","view":{"type":"rows","columns":["community","members","matches docs/architecture.md?"],"rows":[{"cells":["billing","app.py · invoice.py · webhooks.py","yes"],"tone":"win"},{"cells":["orders","orders.py · metrics.py","yes"],"tone":"win"},{"cells":["notifications","worker.py","yes"],"tone":"win"},{"cells":["god node","<code>shared/db.py</code> — bridges all three","the doc never says this"],"new":true}]}},"after":{"title":"WHAT THAT DOES AND DOESN'T MEAN","view":{"type":"note","text":"Communities are a <b>hypothesis about your architecture</b>, not a verdict on it. On orderflow they match the doc because orderflow is clean. On a legacy monolith the clusters will cut across your stated module boundaries — and that disagreement is the finding, not an error in the tool."}}}},{"title":"Ask it a caller question","narrative":["Artifacts on disk are potential energy. The kinetic form is a query. Ask the thing an agent asks constantly: <em>who calls this?</em>","The answer comes back as a small structured object — the symbol, its kind, where it lives, its callers, its callees, its transitive blast radius, and whether the name was ambiguous. Compare that to the alternative: grep <code>decode_jwt</code>, open every hit, read enough of each file to tell a real call site from a mention in a docstring."],"youDo":"<code>graphify query \"What components depend on DatabasePool?\"</code> and <code>graphify path \"post_invoice\" \"decode_jwt\"</code>. Check both answers against the ground-truth list at the bottom of <code>labs/sample-project/README.md</code> — at fifteen files you genuinely can.","claudeSays":"The assistant fetches the matching nodes and edges and reasons over <em>those</em>. <code>shared/auth.py</code> never enters the context window.","source":"labs/M09-mcp-graph-server/solution/server.py#selftest","terminal":[{"kind":"prompt","text":"who calls decode_jwt?"},{"kind":"tool","text":"explore(symbol=\"decode_jwt\")"},{"kind":"out-pass","text":"{\n  \"symbol\": \"decode_jwt\",\n  \"kind\": \"function\",\n  \"location\": \"shared/auth.py:16\",\n  \"callers\": [\"shared.auth.verify_token\"],\n  \"callees\": [\"shared.auth.AuthError\"],\n  \"blast_radius\": 2,\n  \"ambiguous\": false\n}"},{"kind":"claude","text":"One direct caller: verify_token, same file. That is the route every\nservice takes — billing's post_invoice calls verify_token, which calls\ndecode_jwt. Blast radius 2, and the name is unambiguous, so this is\nthe complete list rather than a sample."}],"state":{"label":"one structural question, two routes","before":{"title":"BEFORE — no graph","view":{"type":"rows","columns":["step","what it costs"],"rows":[{"cells":["<code>grep -rn decode_jwt</code>","a hit list with no call/mention distinction"]},{"cells":["open each candidate file","the whole file enters context, every time"],"tone":"bad"},{"cells":["read enough to confirm","and you still cannot prove the list is complete"],"tone":"bad"}]}},"after":{"title":"AFTER — ask the graph","view":{"type":"json","data":{"symbol":"decode_jwt","kind":"function","location":"shared/auth.py:16","callers":"shared.auth.verify_token","blast_radius":2},"highlight":["callers","blast_radius"]}}}},{"title":"The part the demo leaves out","narrative":["orderflow is fifteen files. It is far below the roughly 500-file line where graph tooling starts paying for itself, and the honest read of this whole walkthrough is that on <em>this</em> repo the graph is a teaching aid, not a saving.","Here is that claim measured rather than asserted. Capstone 2 ran the same four-arm campaign on a 36-file Spring Boot service: 48 fresh sessions, medians of three per cell. Every graph configuration lost. The best arm was one 55-line root <code>CLAUDE.md</code>.","So take the mechanics from this module and hold the multiple loosely. The vendor's 71.5x came from a 52-file corpus with a favourable query; independent replications land between 6.8x and 49x; below the floor you go backwards. Measure your own repo before you commit to a pipeline."],"youDo":"Ask your assistant one structural question about orderflow with and without <code>/graphify .</code>, and write down both token counts. That number is yours, and you reuse it in the capstone.","source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-priorauth.json, labs/CAPSTONE-2-java-token-benchmark/live_bench/SCENARIOS.md#worked-example-2","state":{"label":"measured · priorauth-api-boot3 · 36 files · 4 questions, medians of 3","before":{"title":"BELOW THE FLOOR, THE GRAPH LOSES","view":{"type":"rows","columns":["arm","all four questions","vs baseline"],"rows":[{"cells":["init — one 55-line root CLAUDE.md","565K","−10% · best arm"],"tone":"win"},{"cells":["baseline — Read/Glob/Grep only","629K","the control"]},{"cells":["graph available alongside files","855K","+36%"],"tone":"bad"},{"cells":["graph forced, no file access","1,156K","+84%"],"tone":"bad"}]}},"after":{"title":"WHY IT GOES THAT WAY AT 36 FILES","view":{"type":"note","text":"At this size grep answers a caller question in <b>two turns</b>, so there is barely anything for the graph to beat — while the graph is small, half its edges are AMBIGUOUS, and forced edge-walking burned 17 to 18 turns on the comprehension questions. Which lever wins is a property of <b>the repo and the question mix</b>, not of the tool. Same campaign on spring-framework's 9,195 files flips the answer."}}}}]},{"id":"kg-mcp-handshake","badge":"WALKTHROUGH","color":"#8B5CF6","time":"~5 min","title":"Three round trips to an answer","spec":"M09 · registering, announcing, calling","intro":"Wire a graph server into an agent and follow the JSON. Two of the three round trips happen once per session; only the third is paid per question — and one of them is the smoke test that stops you shipping a benchmark built on a dead server.","provenance":{"kind":"measured","source":"labs/M09-mcp-graph-server/solution/server.py#selftest, labs/sample-project, labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-multi.json#S1"},"foot":"Every tool response below is this server's real output over orderflow — reproduce with <code>python labs/M09-mcp-graph-server/solution/server.py --selftest</code>","steps":[{"title":"One line to register","narrative":["There is no deployment step here. You are telling the assistant: when a session starts in this project, spawn this subprocess and speak JSON to it over its stdin and stdout. No port, no daemon, no auth.","Everything after the <code>--</code> is the command line the client will run. Point it at the server file and, for anything other than orderflow, at a prebuilt graph with <code>--graph</code>. Absolute paths — the client does not inherit your shell's working directory."],"youDo":"<code>claude mcp add orderflow-graph -- python /absolute/path/to/labs/M09-mcp-graph-server/solution/server.py</code>. For a scripted run, write the same thing as a config file instead and pass <code>--mcp-config mcp.json</code>.","source":"labs/CAPSTONE-2-java-token-benchmark/live_bench/mcp-config.template.json","terminal":[{"kind":"prompt","text":"claude mcp add orderflow-graph -- python D:/work/.../labs/M09-mcp-graph-server/solution/server.py"},{"kind":"out-pass","text":"Added stdio MCP server orderflow-graph to local config"},{"kind":"prompt","text":"claude mcp list"},{"kind":"out","text":"orderflow-graph   stdio   python .../solution/server.py   ✓ connected"}],"state":{"label":"mcp.json · the file form of that command","before":{"title":"WHAT THE CLIENT STORES","view":{"type":"json","data":{"server":"orderflow-graph","transport":"stdio","command":"python","args":".../solution/server.py --graph .../graph.json"},"highlight":["transport"]}},"after":{"title":"WHAT IT DOESN'T STORE","view":{"type":"note","text":"No URL, no port, no credential. The whole server is a subprocess reading JSON from stdin — the lab's is about 120 lines of Python. And because it speaks plain MCP, the same binary serves Claude Code, opencode, or any other MCP client without a per-agent integration."}}}},{"title":"Smoke-test it before you trust it","narrative":["Do this before the first real session, every time. Run the server standalone and confirm it loads the graph and answers.","The reason is the ugliest bug in this course. Capstone 2's first two benchmark campaigns measured a \"graph arm\" whose MCP server was crashing at startup on an SDK import rename. Nothing errored in the transcripts. The agent simply saw no tools, fell back to Read and Grep, and produced entirely plausible numbers for a configuration that never existed.","A component that fails silently under a client that degrades gracefully produces confident, wrong measurements. Six seconds of smoke test buys you the right to believe your own results."],"youDo":"<code>python labs/M09-mcp-graph-server/solution/server.py --selftest</code> — it must print <code>SELFTEST PASSED</code>. Serving a foreign graph, run it plain and look for the <code>serving over stdio</code> line with a non-zero node count.","source":"labs/M09-mcp-graph-server/solution/server.py#selftest, labs/CAPSTONE-2-java-token-benchmark/live_bench/SCENARIOS.md#scenario-4, labs/CAPSTONE-2-java-token-benchmark/README.md#spring-graph-shape","terminal":[{"kind":"prompt","text":"python labs/M09-mcp-graph-server/solution/server.py --selftest"},{"kind":"out","text":"{\n  \"symbol\": \"decode_jwt\",\n  \"callers\": [\"shared.auth.verify_token\"]\n}"},{"kind":"out","text":"{\n  \"error\": \"symbol 'not_a_symbol' not in graph — it may be external; try grep\"\n}"},{"kind":"out-pass","text":"SELFTEST PASSED"},{"kind":"prompt","text":"python .../server.py --graph D:/tmp/spring-graph.json"},{"kind":"out-pass","text":"graph:spring-graph: serving over stdio (110885 nodes, 432741 edges)"}],"state":{"label":"selftest · 4 assertions","before":{"title":"GREEN","view":{"type":"tests","run":4,"failures":0,"big":"SELFTEST PASSED","note":"graph_callers resolves · graph_callees resolves · explore composes · an unknown symbol returns the graceful-miss dict instead of raising"}},"after":{"title":"WHAT A SILENT FAILURE LOOKS LIKE","view":{"type":"rows","columns":["symptom","with file tools available","with the graph forced"],"rows":[{"cells":["server crashes at startup","invisible — agent falls back to grep","session reports \"tools unavailable\""]},{"cells":["your benchmark says","plausible numbers for a fiction","an obvious, loud failure"],"tone":"bad"},{"cells":["what you should run first","a forced smoke session — no fallback to hide behind","—"],"tone":"win"}]}}}},{"title":"initialize, then tools/list","narrative":["The session starts and the client opens the handshake. <code>initialize</code> exchanges capabilities; <code>tools/list</code> asks what this server can do; the server replies with names and JSON input schemas.","Both of those happen <b>once per session</b>, not once per question. What they buy is a permanent addition to the agent's tool menu, sitting next to Read and Bash — three named functions the model can call the same way it calls anything else."],"claudeSays":"The model now has three more callable functions with typed parameters. It has not read a single line of your source code, and the graph itself has not entered the context window — only the tool names and their schemas.","source":"labs/M09-mcp-graph-server/solution/server.py#serve","terminal":[{"kind":"out","text":"→ initialize  {\"protocolVersion\":\"2025-06-18\",\"clientInfo\":{\"name\":\"claude-code\"}}"},{"kind":"out","text":"← capabilities {\"tools\":{}}  serverInfo {\"name\":\"orderflow-graph\"}"},{"kind":"out","text":"→ tools/list  {}"},{"kind":"out-pass","text":"← graph_callers, graph_callees, explore   (each: {symbol: string})"},{"kind":"out","text":"orderflow-graph: serving over stdio (36 nodes, 22 edges)"}],"state":{"label":"the announced tool surface","before":{"title":"THREE TOOLS, SHAPED AROUND THE QUESTION","view":{"type":"rows","columns":["tool","the question it answers","payload"],"rows":[{"cells":["<code>graph_callers(symbol)</code>","\"Who calls <code>verify_token</code>?\"","one line of caller names"]},{"cells":["<code>graph_callees(symbol)</code>","\"What does <code>handle_payment_webhook</code> call?\"","one line of callee names"]},{"cells":["<code>explore(symbol)</code>","\"What is this and how dangerous is it to touch?\"","composite: location, both directions, blast radius"],"tone":"win"}]}},"after":{"title":"WHY THE THIRD ONE EXISTS","view":{"type":"note","text":"Give an agent only single-purpose lookups and it makes four round trips to investigate one symbol — four tool-call overheads, four chances to lose the thread. <code>explore</code> collapses that chain into one call. The principle generalises: <b>shape tools around the agent's investigation pattern, not around your data model.</b> Your indexes are separate; the agent's question is not."}}}},{"title":"tools/call graph_callers(\"decode_jwt\")","narrative":["Now the round trip that repeats. The model decides on its own that this is a caller question, picks the tool, and fills in the parameter.","The response is the whole point of the architecture. <code>graph.json</code> stays on the server; the client never sees it. What crosses the wire is an <em>answer</em> — a symbol and its callers — and that is all that enters the context window."],"youDo":"Ask a caller question in a session where the server is registered, then check the result against <code>labs/sample-project/README.md</code>'s ground-truth list. <code>graph_callers(\"decode_jwt\")</code> must return exactly <code>[\"shared.auth.verify_token\"]</code>; an empty list means your reverse index is keyed by source instead of target.","claudeSays":"It reasons over the returned names, not over <code>shared/auth.py</code>. The file is never opened, so its imports, its docstrings and its HMAC plumbing cost nothing.","source":"labs/M09-mcp-graph-server/solution/server.py#graph_callers","terminal":[{"kind":"prompt","text":"who calls decode_jwt, and is anything else reaching it?"},{"kind":"tool","text":"graph_callers(symbol=\"decode_jwt\")"},{"kind":"out-pass","text":"{\n  \"symbol\": \"decode_jwt\",\n  \"callers\": [\"shared.auth.verify_token\"]\n}"},{"kind":"claude","text":"Exactly one caller: shared.auth.verify_token, in the same file.\nNothing reaches decode_jwt directly — every service goes through\nverify_token, so that is the only place to change the contract."}],"state":{"label":"what crossed the wire","before":{"title":"BEFORE — the pre-MCP route","view":{"type":"rows","columns":["action","enters context as"],"rows":[{"cells":["<code>grep -rn decode_jwt</code>","a hit list that mixes calls with mentions"]},{"cells":["Read <code>shared/auth.py</code>","the entire file — signing key, HMAC, base64 padding"],"tone":"bad"},{"cells":["Read each other candidate","each one whole, whether or not it was a real call site"],"tone":"bad"}]}},"after":{"title":"AFTER — the tool result","view":{"type":"json","data":{"symbol":"decode_jwt","callers":"shared.auth.verify_token"},"highlight":["callers"]}}}},{"title":"explore: the whole structural picture in one call","narrative":["When the agent's real question is \"how dangerous is it to touch this?\", the composite tool answers it in a single round trip. Callers, callees, the file and line, and a transitive blast radius computed by breadth-first search over the reverse index.","Two fields deserve your attention. <code>blast_radius</code> counts every symbol that transitively depends on this one — the honest scope of a change. <code>ambiguous</code> is the tool admitting its own uncertainty: it is true when the bare name resolved to more than one node, which is exactly when you should not trust the caller list as complete."],"claudeSays":"One call instead of four. The model gets location, both edge directions, and the risk number together, so it can answer without a follow-up query it would otherwise have to plan.","source":"labs/M09-mcp-graph-server/solution/server.py#explore","terminal":[{"kind":"prompt","text":"if I change verify_token's signature, what breaks?"},{"kind":"tool","text":"explore(symbol=\"verify_token\")"},{"kind":"out-pass","text":"{\n  \"symbol\": \"verify_token\",\n  \"kind\": \"function\",\n  \"location\": \"shared/auth.py:41\",\n  \"callers\": [\"services.billing.app.post_invoice\"],\n  \"callees\": [\"shared.auth.AuthError\", \"shared.auth.decode_jwt\"],\n  \"blast_radius\": 1,\n  \"ambiguous\": false\n}"},{"kind":"claude","text":"Blast radius 1: only billing's post_invoice calls it, and the name is\nunambiguous so that list is complete rather than a sample. Downstream\nyou'd keep decode_jwt and AuthError intact. This is a safe change."}],"state":{"label":"explore(\"verify_token\") · real server output","before":{"title":"FOUR CALLS, THE OLD WAY","view":{"type":"rows","columns":["round trip","what it returns"],"rows":[{"cells":["<code>graph_callers</code>","the caller list"]},{"cells":["<code>graph_callees</code>","the callee list"]},{"cells":["a Read to find the definition","the file, whole"],"tone":"bad"},{"cells":["a BFS the agent has to plan itself","the blast radius, maybe"],"tone":"bad"}]}},"after":{"title":"ONE CALL","view":{"type":"json","data":{"symbol":"verify_token","kind":"function","location":"shared/auth.py:41","callers":"services.billing.app.post_invoice","callees":"shared.auth.AuthError, shared.auth.decode_jwt","blast_radius":1},"highlight":["blast_radius"]}}}},{"title":"What it costs — and the two traps","narrative":["The arithmetic is genuinely good on one question. A caller answer is a line of names; the file read it replaces is thousands of tokens. In okf-rs's own codebase, answering \"who calls <code>cmd_generate</code>?\" by reading the 672-line file costs roughly 6,000 tokens against about 15 for the tool call. That is arithmetic, not a session measurement.","The session measurement is less flattering, and it splits on <em>how</em> you integrate. Capstone 2 asked \"who calls <code>registerBeanDefinition</code>?\" through real agent sessions on spring-framework. With the graph merely <b>available</b> next to file tools, the model queried it, distrusted the thousand-name fan-out, re-verified against files, and paid for both paths. With the graph <b>forced</b> as the only tool, it answered in one turn.","The second trap is in the server you just read. <code>load_graph</code> runs once, at startup. Regenerate <code>graph.json</code> mid-session and this process keeps serving the old one until it restarts — a stale answer that looks exactly like a fresh one. M11 is about that."],"source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-multi.json#S1","state":{"label":"measured · spring-framework · \"who calls registerBeanDefinition\" · medians of 3 fresh sessions","before":{"title":"SAME SERVER, SAME QUESTION, THREE INTEGRATIONS","view":{"type":"rows","columns":["arm","turns","tokens","vs baseline"],"rows":[{"cells":["baseline — Read/Glob/Grep, no graph","3","116,033","the control"]},{"cells":["graph available alongside files","4","154,266","+33% — paid for both paths"],"tone":"bad"},{"cells":["graph forced, no file access","1","41,822","−64%"],"tone":"win"}]}},"after":{"title":"THE RULE THAT FALLS OUT","view":{"type":"note","text":"Serving a graph is not the same as saving tokens. It saves tokens when the question is structural, the repo is large, and the agent has no cheaper path to double-check on. Offering the graph as an option was the <b>worst</b> configuration in the campaign. And whatever you measure, smoke-test the server first — otherwise you may be measuring a subprocess that died at startup."}}}}]},{"id":"kg-four-arms","badge":"WALKTHROUGH","color":"#D4A843","time":"~7 min","title":"Four arms, one flip","spec":"Capstone 2 · the measured comparison","intro":"Same model, same questions, same repo snapshot. Change only how the context reaches the agent and run 48 fresh sessions. One arm cuts structural lookups by a quarter and then doubles the bill on comprehension — and on a small repo every graph arm loses outright.","provenance":{"kind":"measured","source":"labs/CAPSTONE-2-java-token-benchmark/live_bench/SCENARIOS.md, labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-multi.json"},"foot":"Every figure is a median of 3 independent fresh <code>claude -p</code> sessions, Sonnet on all arms · raw datasets in <code>expected_output/live-run-multi.json</code> and <code>live-run-priorauth.json</code>","steps":[{"title":"One question set, four ways to answer it","narrative":["The repo is <b>spring-framework</b>: 9,195 Java files. The question set is four questions, split on purpose into two classes. <b>Structural</b> — \"who calls X?\" — is answerable from a call graph. <b>Logic</b> — \"why does X happen, and by what mechanism?\" — needs comprehension.","Four arms differ in exactly one variable each. Baseline is the control: a normal agent, file tools, clean repo. Init adds curated <code>CLAUDE.md</code> files and changes nothing else. Available registers the graph MCP server next to the file tools. Forced takes the file tools away entirely.","Three repetitions per cell, because identical sessions varied by up to 2x. One run is a coin flip; the medians below come from 48 sessions."],"youDo":"Build the graph and smoke-test the server first: <code>python ../../shared_tools/kg_extract_java.py D:/tmp/spring-framework --out D:/tmp/spring-graph.json --quiet</code>, then run the server standalone and confirm it prints <code>serving over stdio</code>.","source":"labs/CAPSTONE-2-java-token-benchmark/live_bench/questions.json, labs/CAPSTONE-2-java-token-benchmark/live_bench/SCENARIOS.md#common-setup","terminal":[{"kind":"prompt","text":"cat live_bench/questions.json"},{"kind":"out","text":"S1 structural  Who calls registerBeanDefinition in this codebase?"},{"kind":"out","text":"S2 structural  Which methods call ResolvableType.forClass?"},{"kind":"out","text":"L1 logic       Why can registerBeanDefinition throw BeanDefinitionOverrideException?"},{"kind":"out","text":"L2 logic       During refresh(), are bean definitions added by a BeanFactoryPostProcessor\n               picked up by subsequently-run post-processors?"}],"state":{"label":"the four arms · one variable each","before":{"title":"WHAT EACH ARM SIMULATES","view":{"type":"rows","columns":["arm","tools allowed","the one variable"],"rows":[{"cells":["<code>baseline</code>","Read, Glob, Grep","nothing added — the control"]},{"cells":["<code>init</code>","Read, Glob, Grep","a CLAUDE.md in every <code>spring-*</code> module (22 files)"]},{"cells":["<code>available</code>","files <b>+</b> graph_callers, graph_callees, explore","\"prefer the graph; fall back only if it cannot answer\""]},{"cells":["<code>forced</code>","graph tools only — nothing else","no file access at all"]}]}},"after":{"title":"THE RULES THAT MAKE IT A MEASUREMENT","view":{"type":"note","text":"Baseline runs <b>first</b>, before init ever writes a file into the repo, or the control is contaminated — the runner records <code>repo_claude_md_count</code> per run and warns. Same model, same questions, same snapshot on every arm. And run a forced smoke session before trusting any graph-arm number: it is the only arm with no fallback to hide a dead server behind."}}}},{"title":"Arm 1 — baseline, and it is not the strawman","narrative":["The control answered \"who calls <code>registerBeanDefinition</code>?\" in <b>3 turns</b> for <b>116,039 tokens</b>, without opening files wholesale. That is the number every other arm has to beat.","This matters more than it looks. The mechanical benchmark earlier in this capstone predicted a 33.7x advantage for the graph, because it modelled exploration as reading whole files. A real agent's Grep returns matching <em>lines</em>. Any tool that wants to win has to beat line-granular grep, not the whole-file strawman."],"youDo":"<code>python run_live_bench.py D:/tmp/spring-framework --arms baseline --reps 3</code> — first, on a clean repo, before anything else touches it.","source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-multi.json#baseline","terminal":[{"kind":"prompt","text":"python run_live_bench.py D:/tmp/spring-framework --arms baseline --reps 3"},{"kind":"out","text":"repo_claude_md_count: 0  ✓ clean control"},{"kind":"tool","text":"Grep  \"registerBeanDefinition\"  → matching lines, not files"},{"kind":"out-pass","text":"S1 baseline  rep0 5t 167,742  rep1 3t 116,039  rep2 3t 112,982   median 3t 116,039"},{"kind":"out","text":"structural 240K · logic 345K · all four 585K"}],"state":{"label":"measured · baseline · medians of 3","before":{"title":"THE NUMBER TO BEAT","view":{"type":"rows","columns":["question","class","turns","tokens"],"rows":[{"cells":["S1 · calls registerBeanDefinition","structural","3","116,039"]},{"cells":["S2 · calls ResolvableType.forClass","structural","3","124,583"]},{"cells":["L1 · why BeanDefinitionOverrideException","logic","6","231,012"]},{"cells":["L2 · post-processor re-scan","logic","3","113,808"]},{"cells":["<b>all four</b>","—","—","<b>585K</b>"],"tone":"win"}]}}}},{"title":"Arm 2 — init: a map, not an index","narrative":["Generate a <code>CLAUDE.md</code> for each of the 22 <code>spring-*</code> modules, change nothing else, and re-run. The average is a wash: <b>600K, +2%</b>, plus a one-time generation cost of about $3.40.","The average hides the story. On S1 the curated map sent the agent straight to the right module — <b>81,352 tokens in 2 turns, a 30% win</b>. On S2 the same auto-loaded context never paid for itself: <b>+58%</b>. It helps most on the logic side, where orientation is the bottleneck, at <b>321K, −7%</b>.","The read: a <code>CLAUDE.md</code> is orientation and conventions, not a lookup index. It pays when the session's first problem is \"where do I even start?\" and taxes you when it isn't."],"youDo":"<code>python init_claude_mds.py D:/tmp/spring-framework --prefix spring-</code>, run the arm, then <code>--remove</code> to restore the clean repo. Note the gotcha: <code>/init</code> does not fire in <code>claude -p</code> mode, so the script issues an explicit \"analyze this module and Write CLAUDE.md\" instruction instead.","source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-multi.json#init, labs/CAPSTONE-2-java-token-benchmark/live_bench/SCENARIOS.md#scenario-2","terminal":[{"kind":"prompt","text":"python init_claude_mds.py D:/tmp/spring-framework --prefix spring-"},{"kind":"out","text":"22 modules · ~35s each · resumable · ~$0.15/module"},{"kind":"prompt","text":"python run_live_bench.py D:/tmp/spring-framework --arms init --reps 3"},{"kind":"out","text":"repo_claude_md_count: 22"},{"kind":"out-pass","text":"S1 init  median 2t 81,352   (baseline 3t 116,039 → −30%)"},{"kind":"out-fail","text":"S2 init  median 4t 196,892  (baseline 3t 124,583 → +58%)"}],"state":{"label":"measured · init vs baseline","before":{"title":"BEFORE — baseline","view":{"type":"bars","unit":"tokens","max":420000,"items":[{"label":"S1 structural","value":116039,"note":"3 turns"},{"label":"S2 structural","value":124583,"note":"3 turns"}]}},"after":{"title":"AFTER — with 22 CLAUDE.mds","view":{"type":"bars","unit":"tokens","max":420000,"items":[{"label":"S1 structural","value":81352,"tone":"win","note":"2 turns · −30% · the map pointed at the right module"},{"label":"S2 structural","value":196892,"tone":"bad","note":"4 turns · +58% · the context rode along and never paid off"}]}}}},{"title":"Arm 3 — available: paying for both paths","narrative":["This is the integration almost everyone actually ships: register the graph MCP server alongside the normal tools and tell the model to prefer it. The model chooses.","It was the <b>worst arm in the campaign</b> on structural questions: <b>570K, +137%</b>. On S2 it burned <b>10 turns and 415,455 tokens</b> — worse than having no graph at all.","The mechanism is not stupidity. The model queried the graph, got back a bare-name answer with over a thousand candidates, correctly did not trust it, and re-verified against files. It paid for both retrieval paths. That distrust is <em>rational</em> given a teaching-grade graph's AMBIGUOUS fan-out; a type-resolved production graph earns trust by answering compactly."],"youDo":"<code>python run_live_bench.py D:/tmp/spring-framework --arms available --reps 3 --mcp-config mcp.json</code>","source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-multi.json#available","terminal":[{"kind":"prompt","text":"python run_live_bench.py D:/tmp/spring-framework --arms available --reps 3 --mcp-config mcp.json"},{"kind":"tool","text":"graph_callers(symbol=\"forClass\")"},{"kind":"out","text":"bare-name resolution: every overload merged into one candidate list · AMBIGUOUS"},{"kind":"tool","text":"Grep + Read  … re-verifying the graph's candidates against source"},{"kind":"out-fail","text":"S2 available  median 10t 415,455   (baseline 3t 124,583 → +233%)"},{"kind":"out-fail","text":"structural 570K (+137%) · logic 389K (+13%) · all four 959K"}],"state":{"label":"measured · S1 and S2, three arms so far","before":{"title":"S1 — WHO CALLS registerBeanDefinition","view":{"type":"rows","columns":["arm","turns","tokens","vs baseline"],"rows":[{"cells":["baseline","3","116,039","control"]},{"cells":["init","2","81,352","−30%"],"tone":"win"},{"cells":["available","4","154,274","+33%"],"tone":"bad"}]}},"after":{"title":"S2 — WHO CALLS ResolvableType.forClass","view":{"type":"rows","columns":["arm","turns","tokens","vs baseline"],"rows":[{"cells":["baseline","3","124,583","control"]},{"cells":["init","4","196,892","+58%"],"tone":"bad"},{"cells":["available","10","415,455","+233% — the worst cell in the grid"],"tone":"bad"}]}}}},{"title":"Arm 4 — forced: one turn, 41,824 tokens","narrative":["Take the file tools away. The graph is the only search surface, and the prompt tells the model to note honestly where AMBIGUOUS provenance leaves it uncertain.","S1 came back in <b>one turn for 41,824 tokens</b> — <b>64% under baseline</b>. Across both structural questions the arm landed at <b>178K, −26%</b>: the only arm in the campaign that beat the control on structural lookups.","The finding is not \"graphs are cheaper\". It is that <b>forcing is what unlocks the win</b>. Remove the option to double-check and the graph's one-call answers finally beat grep — which is precisely why the available arm, same graph and same model, lost by 137%."],"youDo":"<code>python run_live_bench.py D:/tmp/spring-framework --arms forced --reps 3 --mcp-config mcp.json</code>. Run this arm before you trust any other graph-arm number — with no file tools to fall back on, a broken server says so out loud.","source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-multi.json#forced","terminal":[{"kind":"prompt","text":"python run_live_bench.py D:/tmp/spring-framework --arms forced --reps 3 --mcp-config mcp.json"},{"kind":"tool","text":"graph_callers(symbol=\"registerBeanDefinition\")"},{"kind":"out-pass","text":"S1 forced  median 1t 41,824   (baseline 3t 116,039 → −64%)"},{"kind":"out-pass","text":"S2 forced  median 3t 136,492   (baseline 3t 124,583 → +10%)"},{"kind":"out-pass","text":"structural 178K (−26%)  ← the only arm to beat baseline"}],"state":{"label":"measured · structural totals · S1 + S2","before":{"title":"BEFORE — everything that lost","view":{"type":"bars","unit":"tokens","max":580000,"items":[{"label":"baseline","value":240622,"note":"the control"},{"label":"init","value":278244,"tone":"bad","note":"+16%"},{"label":"available","value":569729,"tone":"bad","note":"+137% — worst arm"}]}},"after":{"title":"AFTER — forced joins the chart","view":{"type":"bars","unit":"tokens","max":580000,"items":[{"label":"baseline","value":240622,"note":"the control"},{"label":"init","value":278244,"tone":"bad","note":"+16%"},{"label":"available","value":569729,"tone":"bad","note":"+137% — worst arm"},{"label":"forced","value":178316,"tone":"win","note":"−26% · S1 answered in a single turn"}]}}}},{"title":"The flip: same arm, logic questions, +120%","narrative":["Now ask the winner a question a call graph was never built to answer. \"Why can <code>registerBeanDefinition</code> throw <code>BeanDefinitionOverrideException</code>?\" The forced agent got it <b>right</b> — it walked callee edges and reconstructed the override-guard chain — in <b>12 turns for 523,791 tokens</b>, against baseline's <b>6 turns and 231,012</b>, which included simply reading the file.","Across both logic questions: <b>758K, +120%</b>. The graph can substitute for reading code, expensively. It cannot beat reading code at comprehension.","One confound reported rather than buried: Spring is in the model's training data, so edge-walking partly <em>confirmed</em> logic it already knew. On a private codebase that same graph-shaped confidence over unread code is a hallucination risk, not a capability."],"youDo":"Add <code>--forced-logic</code> to include the \"why\" questions in the forced arm — it is the expensive run, and it is the one that produces this finding.","source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-multi.json, labs/CAPSTONE-2-java-token-benchmark/live_bench/SCENARIOS.md#the-combined-result","terminal":[{"kind":"prompt","text":"python run_live_bench.py D:/tmp/spring-framework --arms forced --reps 3 --mcp-config mcp.json --forced-logic"},{"kind":"tool","text":"graph_callees(symbol=\"registerBeanDefinition\")  … rebuilding the guard chain from edges alone"},{"kind":"out-fail","text":"L1 forced  median 12t 523,791  (baseline 6t 231,012 → +127%)"},{"kind":"out-fail","text":"L2 forced  median 8t 234,139   (baseline 3t 113,808 → +106%)"},{"kind":"out","text":"answers correct in both — cost, not accuracy, is what moved"}],"state":{"label":"measured · the whole grid · medians of 3 fresh sessions","before":{"title":"NO ARM WINS EVERYWHERE — THAT IS THE FINDING","view":{"type":"rows","columns":["arm","structural","logic","all four"],"rows":[{"cells":["<code>baseline</code>","240K","345K","<b>585K</b>"]},{"cells":["<code>init</code>","278K (+16%)","<b>321K (−7%)</b>","600K (+2%)"]},{"cells":["<code>available</code>","570K (+137%)","389K (+13%)","959K"],"tone":"bad"},{"cells":["<code>forced</code>","<b>178K (−26%)</b>","758K (+120%)","936K"],"tone":"win"}]}},"after":{"title":"THE SYNTHESIS — M10's ROUTER, DERIVED FROM DATA","view":{"type":"note","text":"Route structural questions to the forced graph and everything else to files: <b>178K + 345K ≈ 523K</b> for this question set, against 585K all-baseline. Each layer serves only the question class it is good at. Two honesty notes to carry with the table: the forced arm's dollar-cost field did not reconcile with its usage fields, so <b>tokens and turns are the trustworthy columns there</b>; and S2 under forcing had wild spread (45K–698K) because bare-name resolution merges overloads into thousand-caller answers."}}}},{"title":"The counterpoint: 36 files, and every graph arm loses","narrative":["Same four scenarios, same methodology, another 48 se

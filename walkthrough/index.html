<style>/* Walkthrough widget styles. EVERY rule is scoped under .wt so this file can be
   inlined into a course page without colliding with the host's own CSS (the
   course players already define .stamp, .step-card, table, pre, p, h3 …).
   Ported from priorauth-sdd-course/walkthrough/src/app.css, plus the receipt,
   bars, window and tab views these courses need.

   Two palettes: the default light "paper" one (kit-format players, SDD guide)
   and .wt-dark for the knowledge-graph modules, whose pages are dark navy.
   Set it per mount with data-wt-theme="dark". */

.wt{
  --paper:#FAFBFC; --sheet:#FFFFFF; --ink:#1C2127; --ink-soft:#4A5361;
  --rule:#D9DEE5; --rule-soft:#EAEDF1;
  --grid-blue:#33506B; --spec-green:#1F7A4D; --spec-green-soft:#E8F3ED;
  --signal-amber:#B45309; --signal-amber-soft:#FCF1E4;
  --defect-red:#A63A3A; --defect-red-soft:#F9ECEC;
  --term-bg:#161B22; --code-bg:#F4F6F9;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  font-family:var(--sans);color:var(--ink);line-height:1.6;font-size:16px;text-align:left;
}
.wt.wt-dark{
  --paper:#0F1A2B; --sheet:#162033; --ink:#E8ECF1; --ink-soft:#94A3B8;
  --rule:#2A3648; --rule-soft:#212C3D;
  --grid-blue:#7FB2E8; --spec-green:#5FCB93; --spec-green-soft:#12301F;
  --signal-amber:#E0A458; --signal-amber-soft:#2E2214;
  --defect-red:#E58989; --defect-red-soft:#331B1B;
  --term-bg:#0B1220; --code-bg:#101A2A;
}
.wt *{margin:0;padding:0;box-sizing:border-box}
.wt button{font-family:inherit;cursor:pointer}
.wt a{color:var(--grid-blue)}
.wt code{font-family:var(--mono);font-size:.88em;background:var(--rule-soft);padding:.1em .35em;border-radius:3px;color:inherit}
/* neutralise the host page's element styles before our own rules land */
.wt pre{background:transparent;color:inherit;border-radius:0;font-size:inherit;line-height:inherit;overflow:visible;border:none;margin:0;padding:0}
.wt table{border-collapse:collapse;background:transparent;font-size:inherit;margin:0;width:auto}
.wt h2,.wt h3{font-family:var(--sans);letter-spacing:-.01em;line-height:1.25;color:var(--ink);border:none;padding:0}
.wt p{color:var(--ink)}
.wt :focus-visible{outline:2px solid var(--grid-blue);outline-offset:2px}

/* ---------- scenario head (standalone) ---------- */
.wt .scen-head{border-left:4px solid var(--scen-color);padding-left:18px;margin-bottom:22px}
.wt .scen-meta{display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:.72rem;flex-wrap:wrap}
.wt .scen-badge{background:var(--scen-color);color:#fff;padding:2px 10px;border-radius:3px;letter-spacing:.1em;font-weight:600}
.wt .scen-spec{color:var(--ink-soft);letter-spacing:.06em}
.wt .scen-head h2{font-size:1.45rem;margin:6px 0}
.wt .scen-intro{color:var(--ink-soft);max-width:80ch;font-family:var(--serif)}

/* ---------- provenance ---------- */
.wt .wt-prov{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.6rem;
  letter-spacing:.1em;border:1px solid var(--rule);border-radius:99px;padding:2px 9px;color:var(--ink-soft)}
.wt .wt-prov-measured .wt-prov-k{color:var(--spec-green);font-weight:600}
.wt .wt-prov-illustrative .wt-prov-k{color:var(--signal-amber);font-weight:600}
.wt .wt-prov-v{opacity:.8;text-transform:none;letter-spacing:0}

/* ---------- progress ---------- */
.wt .progress{display:flex;align-items:center;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.wt .prog-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--rule);background:var(--sheet);
  font-family:var(--mono);font-size:.74rem;font-weight:600;color:var(--ink-soft);transition:all .25s;
  display:flex;align-items:center;justify-content:center;padding:0}
.wt .prog-dot.done{border-color:var(--spec-green);color:var(--spec-green);background:var(--spec-green-soft)}
.wt .prog-dot.on{border-color:var(--scen-color);background:var(--scen-color);color:#fff;transform:scale(1.12)}
.wt .prog-label{font-family:var(--mono);font-size:.74rem;color:var(--ink-soft);margin-left:6px}

/* ---------- step ---------- */
.wt .step{display:grid;grid-template-columns:minmax(320px,5fr) minmax(380px,7fr);gap:26px;
  animation:wtStepIn .35s ease both}
.wt.wt-embed .step{grid-template-columns:1fr;gap:18px}
@keyframes wtStepIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:900px){.wt .step{grid-template-columns:1fr}}

.wt .step-copy h3{font-size:1.15rem;margin-bottom:12px;font-weight:700}
.wt .step-n{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;color:var(--grid-blue);margin-bottom:2px}
.wt .step-copy p{margin-bottom:12px;max-width:66ch;font-size:.95rem}
.wt .step-copy p b{font-weight:600}

.wt .youdo,.wt .claudesays{border:1px solid var(--rule);border-left:3px solid var(--signal-amber);
  background:var(--signal-amber-soft);padding:12px 16px;margin:14px 0;border-radius:0 6px 6px 0}
.wt .claudesays{border-left-color:var(--grid-blue);background:var(--rule-soft)}
.wt .youdo-k{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;font-weight:600;
  color:var(--signal-amber);margin-bottom:4px}
.wt .cs-k{color:var(--grid-blue)}
.wt .youdo-v{font-size:.92rem}

/* ---------- terminal ---------- */
.wt .term{background:var(--term-bg);border-radius:10px;overflow:hidden;
  box-shadow:0 10px 30px rgba(16,22,30,.25);margin-bottom:20px}
.wt .term-bar{display:flex;align-items:center;gap:12px;background:#0D1117;padding:9px 14px}
.wt .term-dots{display:flex;gap:6px}
.wt .term-dots i{width:11px;height:11px;border-radius:50%;background:#30363D;display:block}
.wt .term-dots i:first-child{background:#E5534B}
.wt .term-dots i:nth-child(2){background:#D4A72C}
.wt .term-dots i:last-child{background:#3FB950}
.wt .term-title{font-family:var(--mono);font-size:.72rem;color:#8A97A6;flex:1}
.wt .term-actions button{background:none;border:1px solid #30363D;color:#8A97A6;font-family:var(--mono);
  font-size:.66rem;padding:2px 10px;border-radius:99px}
.wt .term-actions button:hover{color:#E8ECF0;border-color:#8A97A6}
.wt .term-body{padding:16px 18px;max-height:460px;overflow-y:auto;font-family:var(--mono);
  font-size:.8rem;line-height:1.55}
.wt .tl{display:flex;gap:10px;margin-bottom:10px}
.wt .tl pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;flex:1;font-size:inherit;line-height:inherit}
.wt .tl-appear{animation:wtTlIn .3s ease both}
@keyframes wtTlIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.wt .tl-prompt pre{color:#F0F3F6;font-weight:500}
.wt .tl-caret{color:#7FD6A8;font-weight:600}
.wt .tl-who{color:#D4A843}
.wt .tl-who-tool{color:#9BC0E8}
.wt .tl-claude pre{color:#C6CEDA}
.wt .tl-tool pre{color:#9BC0E8}
.wt .tl-out pre{color:#8A97A6}
.wt .tl-out-pass pre{color:#7FD6A8;font-weight:500}
.wt .tl-out-fail pre{color:#F1A0A0;font-weight:500}
.wt .tl-gate pre{color:#F1C58B;font-weight:600}
.wt .cursor{display:inline-block;width:7px;height:14px;background:#7FD6A8;vertical-align:-2px;
  animation:wtBlink .8s steps(1) infinite;margin-left:1px}
@keyframes wtBlink{50%{opacity:0}}

/* ---------- state panel ---------- */
.wt .state{background:var(--sheet);border:1px solid var(--ink);box-shadow:4px 4px 0 var(--rule);border-radius:2px}
.wt.wt-dark .state{border-color:var(--rule);box-shadow:4px 4px 0 rgba(0,0,0,.35)}
.wt .state-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--ink);color:var(--sheet);padding:8px 14px}
.wt.wt-dark .state-head{background:#0B1220;color:var(--ink)}
.wt .state-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em}
.wt .ba-toggle{display:flex;border:1px solid #4A5361;border-radius:99px;overflow:hidden;flex:0 0 auto}
.wt .ba-toggle button{background:none;border:none;color:#8A97A6;font-family:var(--mono);font-size:.68rem;
  letter-spacing:.08em;padding:3px 14px}
.wt .ba-toggle button.on{background:var(--defect-red);color:#fff}
.wt .ba-toggle button.on-after{background:var(--spec-green);color:#fff}
.wt .state-body{padding:16px 18px;animation:wtStateIn .3s ease both}
@keyframes wtStateIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
.wt .state-title{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;margin-bottom:10px;font-weight:600}
.wt .st-before{color:var(--defect-red)}
.wt .st-after{color:var(--spec-green)}
.wt .apply{display:block;width:100%;border:none;border-top:1px dashed var(--rule);
  background:var(--spec-green-soft);color:var(--spec-green);font-family:var(--mono);font-size:.74rem;
  font-weight:600;padding:10px;letter-spacing:.04em}
.wt .apply:hover{filter:brightness(.97)}
.wt .state-note{font-size:.88rem;color:var(--ink-soft);font-family:var(--serif)}
.wt .state-stack>div{margin-bottom:14px}
.wt .state-stack>div:last-child{margin-bottom:0}

/* json */
.wt .json{font-family:var(--mono);font-size:.78rem;line-height:1.6;background:var(--code-bg);
  border:1px solid var(--rule-soft);border-radius:6px;padding:12px 14px;overflow-x:auto;color:var(--ink)}
.wt .json-row.hl{background:var(--signal-amber-soft);outline:1px solid var(--signal-amber);
  border-radius:3px;animation:wtHl 1.2s ease 1}
@keyframes wtHl{0%{opacity:.45}100%{opacity:1}}
.wt .jk{color:var(--grid-blue)}
.wt .js{color:var(--defect-red)}
.wt .jn{color:var(--spec-green)}

/* spec mini */
.wt .spec-mini{border:1px solid var(--ink);font-size:.85rem}
.wt.wt-dark .spec-mini{border-color:var(--rule)}
.wt .spec-mini-bar{display:flex;justify-content:space-between;align-items:center;background:var(--ink);
  color:var(--sheet);padding:7px 12px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;gap:10px}
.wt.wt-dark .spec-mini-bar{background:#0B1220;color:var(--ink)}
.wt .stamp{font-family:var(--mono);font-weight:600;font-size:.62rem;letter-spacing:.12em;
  border:1.5px solid currentColor;padding:2px 8px;border-radius:2px;white-space:nowrap;
  animation:wtStamp .45s cubic-bezier(.2,1.6,.4,1) both;display:inline-block}
@keyframes wtStamp{from{transform:scale(1.7) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.wt .stamp-approved,.wt .stamp-verified{color:#7FD6A8}
.wt .stamp-draft{color:#F1C58B}
.wt .stamp-defect,.wt .stamp-refused{color:#F1A0A0}
.wt .spec-mini-body{padding:6px 12px}
.wt .spec-mini-row{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--rule-soft);font-size:.8rem}
.wt .spec-mini-row:last-child{border-bottom:none}
.wt .smk{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);padding-top:2px}

/* rows table */
.wt .rows{width:100%;font-size:.78rem}
.wt .rows th{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
  text-align:left;color:var(--ink-soft);border-bottom:2px solid var(--ink);padding:6px 8px;background:transparent}
.wt.wt-dark .rows th{border-bottom-color:var(--rule)}
.wt .rows td{padding:6px 8px;border-bottom:1px solid var(--rule-soft);font-family:var(--mono);
  font-size:.74rem;color:var(--ink)}
.wt .row-new td{background:var(--spec-green-soft);animation:wtRowIn .6s ease both}
.wt .row-new td:first-child{border-left:3px solid var(--spec-green)}
.wt .row-win td{background:var(--spec-green-soft)}
.wt .row-bad td{background:var(--defect-red-soft)}
@keyframes wtRowIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* diff */
.wt .diff{border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.wt .diff-file{font-family:var(--mono);font-size:.68rem;background:var(--rule-soft);padding:6px 12px;color:var(--ink-soft)}
.wt .diff pre{font-family:var(--mono);font-size:.76rem;line-height:1.6;padding:10px 0;overflow-x:auto;color:var(--ink)}
.wt .dl{padding:0 14px;white-space:pre}
.wt .dl-p{color:var(--ink-soft)}
.wt .dl-m{background:var(--defect-red-soft);color:var(--defect-red)}
.wt .dl-a{background:var(--spec-green-soft);color:var(--spec-green)}

/* tests */
.wt .tests{border-radius:8px;padding:16px 18px;text-align:center}
.wt .tests-fail{background:var(--defect-red-soft);border:1px solid var(--defect-red)}
.wt .tests-pass{background:var(--spec-green-soft);border:1px solid var(--spec-green);
  animation:wtPass .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes wtPass{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.wt .tests-big{font-family:var(--mono);font-weight:600;font-size:1rem;letter-spacing:.08em}
.wt .tests-fail .tests-big{color:var(--defect-red)}
.wt .tests-pass .tests-big{color:var(--spec-green)}
.wt .tests-nums{font-family:var(--mono);font-size:.74rem;color:var(--ink-soft);margin-top:4px}
.wt .tests-note{font-size:.8rem;color:var(--ink-soft);margin-top:8px;font-family:var(--serif)}

/* ---------- receipt (Token Lens) ---------- */
.wt .receipt{font-family:var(--mono);font-size:.78rem}
.wt .rc-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  flex-wrap:wrap;margin-bottom:10px}
.wt .rc-mode{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.wt .rc-q{font-size:.68rem;color:var(--ink-soft);font-style:italic;max-width:32ch;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt .lbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--rule-soft);margin-bottom:12px}
.wt .lseg{height:100%;transition:width .5s ease}
.wt .lseg-hl{outline:2px solid var(--ink);outline-offset:-2px}
.wt .rc-lines{margin-bottom:6px}
.wt .rc-line{display:flex;align-items:baseline;gap:8px;padding:3px 0}
.wt .rc-line.hl{background:var(--signal-amber-soft);border-radius:3px;margin:0 -6px;padding:3px 6px}
.wt .rc-sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto;display:inline-block}
.wt .rc-k{color:var(--ink-soft)}
.wt .rc-dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-3px)}
.wt .rc-v{font-variant-numeric:tabular-nums;color:var(--ink)}
.wt .rc-total{display:flex;align-items:baseline;gap:8px;padding:7px 0 3px;margin-top:4px;
  border-top:1px solid var(--rule);font-weight:600}
.wt .rc-total .rc-k,.wt .rc-total .rc-v{color:var(--ink)}
.wt .rc-sub .rc-k,.wt .rc-sub .rc-v{opacity:.75}
.wt .rc-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.wt .rc-chip{font-size:.64rem;letter-spacing:.04em;border:1px solid var(--rule);border-radius:99px;
  padding:2px 9px;color:var(--ink-soft)}
.wt .rc-verdict{margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wt .rcv-note{font-size:.68rem;color:var(--ink-soft)}
.wt .rcv-failed{background:var(--defect-red-soft);margin:12px -18px -16px;padding:10px 18px;border-top:1px solid var(--defect-red)}

/* ---------- bars (comparative totals) ---------- */
.wt .bars{font-family:var(--mono);font-size:.76rem}
.wt .bars-row{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--rule-soft)}
.wt .bars-row:last-child{border-bottom:none}
.wt .bars-k{color:var(--ink-soft);letter-spacing:.04em}
.wt .bars-track{background:var(--rule-soft);border-radius:3px;height:14px;overflow:hidden}
.wt .bars-fill{height:100%;background:var(--grid-blue);border-radius:3px;transition:width .6s ease}
.wt .bt-win .bars-fill{background:var(--spec-green)}
.wt .bt-bad .bars-fill{background:var(--defect-red)}
.wt .bt-win .bars-k{color:var(--spec-green);font-weight:600}
.wt .bt-bad .bars-k{color:var(--defect-red)}
.wt .bars-v{font-variant-numeric:tabular-nums;color:var(--ink)}
.wt .bars-note{grid-column:2/4;font-size:.68rem;color:var(--ink-soft);margin-top:-2px}

/* ---------- window (context window capacity) ---------- */
.wt .cwin{font-family:var(--mono);font-size:.76rem}
.wt .cwin-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.wt .cwin-k{color:var(--ink-soft);letter-spacing:.1em;text-transform:uppercase;font-size:.66rem}
.wt .cwin-v{color:var(--ink);font-variant-numeric:tabular-nums}
.wt .cwin-track{background:var(--rule-soft);border:1px solid var(--rule);border-radius:5px;
  height:22px;overflow:hidden;padding:2px}
.wt .cwin-used{height:100%;transition:width .6s ease;min-width:2px}
.wt .cwin-used .lbar{height:100%;margin:0;border-radius:3px}
.wt .cwin-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.68rem;color:var(--ink-soft)}
.wt .cwin-item{display:inline-flex;align-items:center;gap:5px}
.wt .cwin-item.hl{color:var(--ink);font-weight:600}
.wt .cwin-note{margin-top:10px;font-family:var(--serif);font-size:.82rem;color:var(--ink-soft)}

/* per-step source citation */
.wt .wt-cite{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:var(--mono);
  font-size:.64rem;color:var(--ink-soft);letter-spacing:.02em;flex-wrap:wrap}
.wt .wt-cite-k{color:var(--spec-green);font-weight:600;letter-spacing:.12em;
  border:1px solid var(--spec-green);border-radius:99px;padding:1px 7px}

/* ---------- step nav ---------- */
.wt .stepnav{display:flex;justify-content:space-between;gap:12px;margin:24px 0 0}
.wt .stepnav button{border:1px solid var(--rule);background:var(--sheet);padding:10px 22px;border-radius:8px;
  font-size:.9rem;color:var(--ink-soft)}
.wt .stepnav button:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.wt .stepnav button.primary{background:var(--scen-color);color:#fff;border-color:var(--scen-color);font-weight:600}
.wt .stepnav button.primary:hover:not(:disabled){filter:brightness(1.1)}
.wt .stepnav button:disabled{opacity:.4;cursor:default}

/* ---------- embedded chrome ---------- */
.wt.wt-embed{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--scen-color);
  border-radius:0 0 8px 8px;padding:20px 22px 22px;margin:24px 0 34px}
.wt .wt-embed-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px dashed var(--rule)}
.wt .weh-badge{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.12em;

</style>
<script>/* Walkthrough runtime — dependency-free port of the priorauth-sdd-course
   walkthrough widget (walkthrough/src/components/*.jsx).

   Scenarios are data. A scenario is stepped through one step at a time; each
   step pairs intent (narrative + YOU DO + CLAUDE'S MOVE) with evidence (a
   replayed terminal and a before/after state panel).

   Usage in a page:
     <div data-wt="kg-147-files"></div>
     <script>WT.register([ ...scenarios... ]); WT.mountAll();<\/script>

   Mounting re-runs under a MutationObserver, because the kit-format course
   players replace their content wrapper's innerHTML on every module change.

   Schema (see README.md for the full reference):
     scenario { id, badge, color, time, title, spec, intro, provenance, steps[] }
     step     { title, narrative[], youDo, claudeSays, terminal[], state }
     terminal line { kind: prompt|claude|tool|out|out-pass|out-fail|gate, text }
     state    { label, before:{title,view}, after:{title,view} }
     view     json | spec | rows | diff | tests | note | stack
              | receipt | bars | window        (added for these courses)
*/
(function (global) {
  'use strict';

  var REDUCED = !!(global.matchMedia &&
    global.matchMedia('(prefers-reduced-motion: reduce)').matches);

  var LINE_DELAY = 420;   // ms between revealed lines
  var TYPE_SPEED = 16;    // ms per character on prompt lines
  var PROMPT_HOLD = 260;  // ms pause after a prompt line finishes typing

  var REGISTRY = {};

  /* ---------------------------------------------------------------- utils */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function html(tag, cls, markup) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (markup != null) n.innerHTML = markup;
    return n;
  }

  function add(parent) {
    for (var i = 1; i < arguments.length; i++) {
      if (arguments[i]) parent.appendChild(arguments[i]);
    }
    return parent;
  }

  function num(n) {
    return typeof n === 'number' ? n.toLocaleString('en-US') : String(n);
  }

  /* Layer palette for receipt/window views, in canonical layer order. */
  var LAYER_COLORS = ['#33506B', '#1F7A4D', '#B45309', '#7A3E9D', '#A63A3A',
                      '#2D7D8A', '#8A6D2F'];

  /* ---------------------------------------------------------------- views */

  function jsonView(v) {
    var pre = el('pre', 'json');
    var keys = Object.keys(v.data);
    var hl = v.highlight || [];
    pre.appendChild(document.createTextNode('{'));
    keys.forEach(function (k, i) {
      var row = el('div', 'json-row' + (hl.indexOf(k) >= 0 ? ' hl' : ''));
      var val = v.data[k];
      var isNum = typeof val === 'number';
      row.appendChild(document.createTextNode('  '));
      add(row, el('span', 'jk', '"' + k + '"'));
      row.appendChild(document.createTextNode(': '));
      add(row, el('span', isNum ? 'jn' : 'js', isNum ? num(val) : '"' + val + '"'));
      if (i < keys.length - 1) row.appendChild(document.createTextNode(','));
      pre.appendChild(row);
    });
    pre.appendChild(document.createTextNode('}'));
    return pre;
  }

  function specView(v) {
    var box = el('div', 'spec-mini');
    var bar = el('div', 'spec-mini-bar');
    add(bar, el('span', null, v.id),
             el('span', 'stamp stamp-' + String(v.status).toLowerCase().replace(/[^a-z]/g, ''), v.status));
    var body = el('div', 'spec-mini-body');
    (v.rows || []).forEach(function (r) {
      var row = el('div', 'spec-mini-row');
      add(row, el('span', 'smk', r[0]), html('span', 'smv', r[1]));
      body.appendChild(row);
    });
    return add(box, bar, body);
  }

  function rowsView(v) {
    var t = el('table', 'rows');
    var thead = el('thead'), htr = el('tr');
    (v.columns || []).forEach(function (c) { add(htr, el('th', null, c)); });
    add(thead, htr);
    var tb = el('tbody');
    (v.rows || []).forEach(function (r) {
      var tr = el('tr', r.new ? 'row-new' : (r.tone ? 'row-' + r.tone : null));
      (r.cells || []).forEach(function (c) { add(tr, html('td', null, String(c))); });
      add(tb, tr);
    });
    return add(t, thead, tb);
  }

  function diffView(v) {
    var box = el('div', 'diff');
    add(box, el('div', 'diff-file', v.file));
    var pre = el('pre');
    (v.lines || []).forEach(function (l) {
      add(pre, el('div', 'dl dl-' + l[0], l[1]));
    });
    return add(box, pre);
  }

  function testsView(v) {
    var pass = !v.failures;
    var box = el('div', 'tests ' + (pass ? 'tests-pass' : 'tests-fail'));
    add(box, el('div', 'tests-big', v.big || (pass ? 'BUILD SUCCESS' : 'BUILD FAILURE')));
    if (v.run != null) {
      add(box, el('div', 'tests-nums',
        'Tests run: ' + v.run + ' · Failures: ' + (v.failures || 0) + ' · Errors: 0'));
    }
    if (v.note) add(box, html('div', 'tests-note', v.note));
    return box;
  }

  /* A horizontal stacked bar shared by the receipt and window views. */
  function stackedBar(layers, total, highlight) {
    var bar = el('div', 'lbar');
    layers.forEach(function (l, i) {
      var seg = el('div', 'lseg' + (highlight && highlight.indexOf(l.label) >= 0 ? ' lseg-hl' : ''));
      seg.style.width = (total ? (l.tokens / total) * 100 : 0) + '%';
      seg.style.background = l.color || LAYER_COLORS[i % LAYER_COLORS.length];
      seg.title = l.label + ' · ' + num(l.tokens);
      add(bar, seg);
    });
    return bar;
  }

  /* receipt — the Token Lens: layered bar, itemised lines, verdict stamp. */
  function receiptView(v) {
    var box = el('div', 'receipt');
    var head = el('div', 'rc-head');
    add(head, el('span', 'rc-mode', (v.mode || '') + ' · token receipt'));
    if (v.question) add(head, el('span', 'rc-q', v.question));
    add(box, head);

    var layers = v.layers || [];
    var sum = layers.reduce(function (a, l) { return a + l.tokens; }, 0);
    add(box, stackedBar(layers, sum, v.highlight));

    var list = el('div', 'rc-lines');
    layers.forEach(function (l, i) {
      var row = el('div', 'rc-line' + (v.highlight && v.highlight.indexOf(l.label) >= 0 ? ' hl' : ''));
      var sw = el('span', 'rc-sw');
      sw.style.background = l.color || LAYER_COLORS[i % LAYER_COLORS.length];
      add(row, sw, el('span', 'rc-k', l.label), el('span', 'rc-dots'),
               el('span', 'rc-v', num(l.tokens)));
      add(list, row);
    });
    add(box, list);

    var tot = el('div', 'rc-total');
    add(tot, el('span', 'rc-k', 'Input total'), el('span', 'rc-dots'),
             el('span', 'rc-v', num(v.inputTotal != null ? v.inputTotal : sum)));
    add(box, tot);

    if (v.output != null) {
      var o = el('div', 'rc-line rc-sub');
      add(o, el('span', 'rc-k', 'Output'), el('span', 'rc-dots'), el('span', 'rc-v', num(v.output)));
      add(box, o);
    }

    var meta = el('div', 'rc-meta');
    if (v.cost) add(meta, el('span', 'rc-chip', v.cost));
    if (v.cacheRead) add(meta, el('span', 'rc-chip', 'cache read ' + v.cacheRead));
    if (v.latency) add(meta, el('span', 'rc-chip', v.latency));
    if (meta.childNodes.length) add(box, meta);

    if (v.verdict) {
      var vk = String(v.verdict).toLowerCase();
      var label = vk === 'verified' ? '✓ Correct'
                : vk === 'failed' ? '✕ FAILED — savings void'
                : '– Ungraded';
      var stamp = el('div', 'rc-verdict rcv-' + vk);
      add(stamp, el('span', 'stamp stamp-' + (vk === 'verified' ? 'verified' : vk === 'failed' ? 'refused' : 'draft'), label));
      if (v.verdictNote) add(stamp, el('span', 'rcv-note', v.verdictNote));
      add(box, stamp);
    }
    return box;
  }

  /* bars — comparative totals across arms/strategies. */
  function barsView(v) {
    var box = el('div', 'bars');
    var items = v.items || [];
    var max = v.max || items.reduce(function (a, i) { return Math.max(a, i.value); }, 0);
    items.forEach(function (it) {
      var row = el('div', 'bars-row' + (it.tone ? ' bt-' + it.tone : ''));
      add(row, el('span', 'bars-k', it.label));
      var track = el('div', 'bars-track');
      var fill = el('div', 'bars-fill');
      fill.style.width = (max ? (it.value / max) * 100 : 0) + '%';
      add(track, fill);
      add(row, track, el('span', 'bars-v', num(it.value) + (v.unit ? ' ' + v.unit : '')));
      if (it.note) add(row, el('span', 'bars-note', it.note));
      add(box, row);
    });
    return box;
  }

  /* window — a context window's layer composition against its capacity. */
  function windowView(v) {
    var box = el('div', 'cwin');
    var layers = v.layers || [];
    var used = v.used != null ? v.used : layers.reduce(function (a, l) { return a + l.tokens; }, 0);
    var cap = v.capacity || used;

    var head = el('div', 'cwin-head');
    add(head, el('span', 'cwin-k', v.label || 'context window'),
              el('span', 'cwin-v', num(used) + ' / ' + num(cap) +
                 ' (' + Math.round((used / cap) * 100) + '% full)'));
    add(box, head);

    var track = el('div', 'cwin-track');
    var used_pct = Math.min(100, (used / cap) * 100);
    var inner = el('div', 'cwin-used');
    inner.style.width = used_pct + '%';
    add(inner, stackedBar(layers, used, v.highlight));
    add(track, inner);
    add(box, track);

    var legend = el('div', 'cwin-legend');
    layers.forEach(function (l, i) {
      var it = el('span', 'cwin-item' + (v.highlight && v.highlight.indexOf(l.label) >= 0 ? ' hl' : ''));
      var sw = el('span', 'rc-sw');
      sw.style.background = l.color || LAYER_COLORS[i % LAYER_COLORS.length];
      add(it, sw, el('span', null, l.label + ' ' + num(l.tokens)));
      add(legend, it);
    });
    add(box, legend);
    if (v.note) add(box, html('div', 'cwin-note', v.note));
    return box;
  }

  function renderView(v) {
    if (!v) return null;
    switch (v.type) {
      case 'json':    return jsonView(v);
      case 'spec':    return specView(v);
      case 'rows':    return rowsView(v);
      case 'diff':    return diffView(v);
      case 'tests':   return testsView(v);
      case 'receipt': return receiptView(v);
      case 'bars':    return barsView(v);
      case 'window':  return windowView(v);
      case 'note':    return html('div', 'state-note', v.text);
      case 'stack':
        var box = el('div', 'state-stack');
        (v.views || []).forEach(function (sub) {
          var r = renderView(sub);
          if (r) add(box, add(el('div'), r));
        });
        return box;
      default: return null;
    }
  }

  /* ------------------------------------------------------------- terminal */

  /* Replays a session: lines appear in order, prompt lines type out. */
  function Terminal(lines) {
    var shown = 0, typed = 0, skipped = REDUCED, timer = null;

    var root = el('div', 'term');
    var bar = el('div', 'term-bar');
    var dots = el('span', 'term-dots');
    add(dots, el('i'), el('i'), el('i'));
    var title = el('span', 'term-title', 'claude — session replay');
    var actions = el('span', 'term-actions');
    var btn = el('button');
    btn.type = 'button';
    add(actions, btn);
    add(bar, dots, title, actions);
    var body = el('div', 'term-body');
    add(root, bar, body);

    function clear() { if (timer) { clearTimeout(timer); timer = null; } }

    function paint() {
      body.textContent = '';
      var visible = skipped ? lines.length : Math.min(lines.length, shown + 1);
      for (var i = 0; i < visible; i++) {
        var line = lines[i];
        var isCurrent = !skipped && i === shown;
        var text = (line.kind === 'prompt' && isCurrent) ? line.text.slice(0, typed) : line.text;
        var row = el('div', 'tl tl-' + line.kind +
          (isCurrent && line.kind !== 'prompt' ? ' tl-appear' : ''));
        if (line.kind === 'prompt') add(row, el('span', 'tl-caret', '›'));
        if (line.kind === 'claude') add(row, el('span', 'tl-who', '⏺'));
        if (line.kind === 'tool')   add(row, el('span', 'tl-who tl-who-tool', '⚒'));
        var pre = el('pre', null, text);
        if (line.kind === 'prompt' && isCurrent && typed < line.text.length) {
          add(pre, el('span', 'cursor'));
        }
        add(row, pre);
        add(body, row);
      }
      body.scrollTop = body.scrollHeight;
      var done = skipped || shown >= lines.length;
      btn.textContent = done ? 'replay ↺' : 'show all';
    }

    function tick() {
      clear();
      if (skipped || shown >= lines.length) { paint(); return; }
      var line = lines[shown];
      if (line.kind === 'prompt' && typed < line.text.length) {
        timer = setTimeout(function () { typed++; paint(); tick(); }, TYPE_SPEED);
      } else {
        timer = setTimeout(function () {
          shown++; typed = 0; paint(); tick();
        }, line.kind === 'prompt' ? PROMPT_HOLD : LINE_DELAY);
      }
      paint();
    }

    btn.addEventListener('click', function () {
      var done = skipped || shown >= lines.length;
      if (done) { shown = 0; typed = 0; skipped = false; }
      else { skipped = true; }
      tick();
    });

    tick();
    return { el: root, destroy: clear };
  }

  /* ---------------------------------------------------------- state panel */

  function StatePanel(state) {
    var side = 'before';
    var single = !state.after;

    var root = el('div', 'state');
    var head = el('div', 'state-head');
    add(head, el('span', 'state-label', state.label || ''));

    var beforeBtn, afterBtn;
    if (!single) {
      var toggle = el('span', 'ba-toggle');
      toggle.setAttribute('role', 'tablist');
      beforeBtn = el('button', 'on', 'Before');
      afterBtn = el('button', null, 'After');
      beforeBtn.type = afterBtn.type = 'button';
      beforeBtn.addEventListener('click', function () { show('before'); });
      afterBtn.addEventListener('click', function () { show('after'); });
      add(toggle, beforeBtn, afterBtn);
      add(head, toggle);
    }

    var body = el('div', 'state-body sb-before');
    var apply = el('button', 'apply', 'Apply this step — see the after state →');
    apply.type = 'button';
    apply.addEventListener('click', function () { show('after'); });

    add(root, head, body);
    if (!single) add(root, apply);

    function show(next) {
      side = next;
      body.className = 'state-body sb-' + side;
      body.textContent = '';
      var cur = side === 'before' ? state.before : state.after;
      if (cur.title) add(body, el('div', 'state-title st-' + side, cur.title));
      var v = renderView(cur.view);
      if (v) add(body, v);
      if (!single) {
        beforeBtn.className = side === 'before' ? 'on' : '';
        afterBtn.className = side === 'after' ? 'on on-after' : '';
        apply.style.display = side === 'before' ? '' : 'none';
      }
    }

    show('before');
    return { el: root };
  }

  /* ----------------------------------------------------------- walkthrough */

  function provenanceEl(p) {
    if (!p) return null;
    var measured = p.kind === 'measured';
    var box = el('span', 'wt-prov wt-prov-' + (measured ? 'measured' : 'illustrative'));
    add(box, el('span', 'wt-prov-k', measured ? 'MEASURED' : 'ILLUSTRATIVE'));
    if (p.source) add(box, el('span', 'wt-prov-v', p.source));
    return box;
  }

  function renderScenario(host, scenario, opts) {
    opts = opts || {};
    var embedded = opts.embedded !== false;
    var stepIdx = 0;
    var live = [];   // teardown handles for the current step

    host.textContent = '';
    var theme = host.getAttribute('data-wt-theme') || opts.theme || '';
    host.className = 'wt' + (embedded ? ' wt-embed' : '') + (theme === 'dark' ? ' wt-dark' : '');
    host.style.setProperty('--scen-color', scenario.color || '#33506B');

    if (embedded) {
      var eh = el('div', 'wt-embed-head');
      add(eh, el('span', 'weh-badge', scenario.badge || 'WALKTHROUGH'),
              el('span', 'weh-title', scenario.title + ' — walk it step by step'));
      var prov = provenanceEl(scenario.provenance);
      if (prov) add(eh, prov);
      if (scenario.time) add(eh, el('span', 'weh-time', scenario.time));
      add(host, eh);
    } else {
      var sh = el('div', 'scen-head');
      var meta = el('div', 'scen-meta');
      add(meta, el('span', 'scen-badge', scenario.badge || 'WALKTHROUGH'));
      if (scenario.spec) add(meta, el('span', 'scen-spec', scenario.spec));
      var p2 = provenanceEl(scenario.provenance);
      if (p2) add(meta, p2);
      add(sh, meta, el('h2', null, scenario.title));
      if (scenario.intro) add(sh, html('p', 'scen-intro', scenario.intro));
      add(host, sh);
    }

    var progress = el('div', 'progress');
    var stepWrap = el('div');
    var nav = el('div', 'stepnav');
    var prevBtn = el('button', null, '← Previous');
    var nextBtn = el('button', 'primary', 'Next step →');
    prevBtn.type = nextBtn.type = 'button';
    add(nav, prevBtn, nextBtn);
    add(host, progress, stepWrap, nav);

    if (embedded && scenario.foot) {
      add(host, html('div', 'wt-embed-foot', scenario.foot));
    }

    prevBtn.addEventListener('click', function () { go(stepIdx - 1); });
    nextBtn.addEventListener('click', function () { go(stepIdx + 1); });

    host.setAttribute('tabindex', '-1');
    host.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { go(stepIdx + 1); }
      else if (e.key === 'ArrowLeft') { go(stepIdx - 1); }
    });

    function teardown() {
      live.forEach(function (h) { if (h && h.destroy) h.destroy(); });
      live = [];
    }

    function go(i) {
      if (i < 0 || i >= scenario.steps.length) return;
      stepIdx = i;
      render();
    }

    function render() {
      teardown();
      var step = scenario.steps[stepIdx];
      var last = stepIdx === scenario.steps.length - 1;

      progress.textContent = '';
      scenario.steps.forEach(function (st, i) {
        var d = el('button', 'prog-dot' + (i === stepIdx ? ' on' : '') + (i < stepIdx ? ' done' : ''));
        d.type = 'button';
        d.title = st.title;
        d.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + st.title);
        add(d, el('span', null, String(i + 1)));
        d.addEventListener('click', function () { go(i); });
        add(progress, d);
      });
      add(progress, el('span', 'prog-label',
        'Step ' + (stepIdx + 1) + ' of ' + scenario.steps.length + ' — ' + step.title));

      stepWrap.textContent = '';
      var sec = el('section', 'step');

      var copy = el('div', 'step-copy');
      var h3 = el('h3');
      add(h3, el('span', 'step-n', 'STEP ' + (stepIdx + 1)));
      h3.appendChild(document.createTextNode(step.title));
      add(copy, h3);
      (step.narrative || []).forEach(function (p) { add(copy, html('p', null, p)); });
      if (step.youDo) {
        var yd = el('div', 'youdo');
        add(yd, el('div', 'youdo-k', 'YOU DO'), html('div', 'youdo-v', step.youDo));
        add(copy, yd);
      }
      if (step.claudeSays) {
        var cs = el('div', 'claudesays');
        add(cs, el('div', 'youdo-k cs-k', "CLAUDE'S MOVE"), html('div', 'youdo-v', step.claudeSays));
        add(copy, cs);
      }
      add(sec, copy);

      var screens = el('div', 'step-screens');
      if (step.terminal && step.terminal.length) {
        var t = Terminal(step.terminal);
        live.push(t);
        add(screens, t.el);
      }
      if (step.state) {
        add(screens, StatePanel(step.state).el);
      }
      if (step.source) {
        var cite = el('div', 'wt-cite');
        add(cite, el('span', 'wt-cite-k', 'MEASURED'), el('span', null, step.source));
        add(screens, cite);
      }
      add(sec, screens);
      add(stepWrap, sec);

      prevBtn.disabled = stepIdx === 0;
      nextBtn.disabled = last;
      nextBtn.textContent = last ? 'Walkthrough complete' : 'Next step →';
    }

    render();
    return { destroy: teardown };
  }

  /* --------------------------------------------------------------- mounts */

  function mountAll(root) {
    var scope = root || document;
    var nodes = scope.querySelectorAll('[data-wt]:not([data-wt-mounted])');
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      var sc = REGISTRY[node.getAttribute('data-wt')];
      if (!sc) continue;
      node.setAttribute('data-wt-mounted', '1');
      renderScenario(node, sc, { embedded: true });
    }
  }

  /* The course players swap innerHTML on module change, so watch for new
     mount points rather than relying on a single pass at load. */
  var pending = null;
  function observe() {
    if (!global.MutationObserver || !document.body) return;
    new MutationObserver(function () {
      if (pending) return;
      pending = setTimeout(function () { pending = null; mountAll(); }, 60);
    }).observe(document.body, { childList: true, subtree: true });
  }

  /* Standalone quick-reference page: every scenario behind a tab. */
  function standalone(host, ids) {
    var list = (ids && ids.length ? ids : Object.keys(REGISTRY))
      .map(function (id) { return REGISTRY[id]; })
      .filter(Boolean);
    if (!list.length) return;

    host.textContent = '';
    var tabs = el('div', 'wt-tabs');
    var stage = el('div', 'wt-stage');

    function open(sc, btn) {

      btn.style.setProperty('--scen-color', sc.color || '#33506B');
      stage.textContent = '';
      var holder = el('div');
      add(stage, holder);

structural question an agent asks constantly: <em>who calls this method?</em>","Without a graph, answering for <code>registerBeanDefinition</code> means 174 file operations and 764,534 tokens of source. With a structural graph already built, it is <b>one lookup</b> returning all 1,037 callers.","Toggle Before / After. The reduction here is 93.9% — a 16.4× multiple — and it is the honest middle of the range, not the headline."],"youDo":"Reproduce this yourself in Capstone 2: extract the graph, then run <code>measure_tokens.py</code> against your own repo.","terminal":[{"kind":"prompt","text":"who calls registerBeanDefinition?"},{"kind":"tool","text":"graph_callers(symbol=\"registerBeanDefinition\")"},{"kind":"out-pass","text":"1037 callers · 1 operation · 46,540 tokens"},{"kind":"claude","text":"Callers are concentrated in three clusters: XML definition readers,\nannotation scanners, and the test fixtures. Here they are by module…"}],"source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/bench-spring.json#registerBeanDefinition","state":{"label":"spring-framework · 9,195 files","before":{"title":"BEFORE — read your way to the answer","view":{"type":"bars","unit":"tokens","max":764534,"items":[{"label":"no graph","value":764534,"tone":"bad","note":"174 file operations"}]}},"after":{"title":"AFTER — ask the graph","view":{"type":"bars","unit":"tokens","max":764534,"items":[{"label":"no graph","value":764534,"tone":"bad","note":"174 file operations"},{"label":"graph","value":46540,"tone":"win","note":"1 operation · 1,037 callers found · 93.9% less"}]}}}},{"title":"And the caveat that keeps you honest","narrative":["That 16.4× is a <b>mechanical</b> measurement: whole-file reading versus one graph call. Real agents are cleverer than that — their grep returns matching <em>lines</em>, not whole files — so the live numbers are far less flattering.","Here is the same structural question run through actual agent sessions. The graph arm used <b>more</b> tokens than the een importable Python modules across three services and a <code>shared/</code> folder, and the listing tells you exactly one thing — where each file sits on disk.","It does not tell you that <code>billing</code> and <code>notifications</code>, siblings in the tree, are intimate at runtime: billing publishes the very events notifications consumes. Directories encode <em>location</em>. Only an edge can encode <em>who talks to whom</em>.","Grep is the usual next move, and it has its own blind spot. Search for one symbol and count what comes back."],"youDo":"<code>grep -rn decode_jwt labs/sample-project</code> — then look at each hit and ask which of them is a call.","source":"labs/sample-project/shared/auth.py, labs/sample-project/docs/runbook-key-rotation.md","terminal":[{"kind":"prompt","text":"grep -rn decode_jwt labs/sample-project"},{"kind":"out","text":"README.md:18:  auth.py             # verify_token -> decode_jwt\nREADME.md:29:- `verify_token` calls `decode_jwt` (same file)\ndocs/runbook-key-rotation.md:13:- During the dual-key window, `decode_jwt` tries the new key first…\nshared/auth.py:16:def decode_jwt(token: str) -> dict:\nshared/auth.py:45:    return decode_jwt(token.removeprefix(\"Bearer \").strip())"},{"kind":"out-fail","text":"5 matching lines across 3 files · 1 definition · 1 call · 3 mentions in prose"}],"state":{"label":"grep -rn decode_jwt · 5 hits","before":{"title":"FIVE HITS, FIVE DIFFERENT MEANINGS","view":{"type":"rows","columns":["hit","what it actually is","useful for \"who calls it?\""],"rows":[{"cells":["<code>shared/auth.py:16</code>","the <b>definition</b>","no — that is the callee"]},{"cells":["<code>shared/auth.py:45</code>","the one real <b>call site</b>","yes — the only true hit"],"tone":"win"},{"cells":["<code>docs/runbook-key-rotation.md:13</code>","a sentence about key rotation","no"],"tone":"bad"},{"cells":["<code>README.md:18</code>","an ASCII diagram","no"],"tone":"bad"},{"cells":["<code>README.md:29</code>","prose that happens to be correct","no — and you can't tell"],"tone":"bad"}]}}}},{"title":"Nodes — name every thing worth pointing at","narrative":["The first primitive is the easy one. Walk every <code>.py</code> file, and every construct with a name and a location becomes a node: one per importable module, one per <code>def</code>, one per <code>class</code>.","Thirty-six nodes fall out of fourteen modules. The count is boring; the <em>shape</em> of a node is not. Each one carries an <code>id</code> you can address it by, a <code>kind</code>, and the file and line it came from — so every later answer is traceable back to source."],"youDo":"<code>python labs/shared_tools/kg_extract.py labs/sample-project --out graph.json</code>, then open <code>graph.json</code> and find <code>function:shared.auth.decode_jwt</code>.","source":"labs/shared_tools/kg_extract.py, labs/sample-project","terminal":[{"kind":"prompt","text":"python labs/shared_tools/kg_extract.py labs/sample-project --out graph.json"},{"kind":"out-pass","text":"Rebuilt: 36 nodes, 22 edges -> graph.json"},{"kind":"out","text":"  nodes: {'class': 4, 'function': 18, 'module': 14}"},{"kind":"out","text":"  edges: {'EXTRACTED': 9, 'INFERRED': 13}"}],"state":{"label":"36 nodes from 14 modules","before":{"title":"BEFORE — nodes by kind","view":{"type":"rows","columns":["kind","count","where it comes from"],"rows":[{"cells":["<code>module</code>","14","one per importable file — <code>__init__.py</code> counts"]},{"cells":["<code>function</code>","18","every <code>def</code>, methods included"]},{"cells":["<code>class</code>","4","<code>Invoice</code> · <code>WebhookError</code> · <code>AuthError</code> · <code>DatabasePool</code>"]}]}},"after":{"title":"AFTER — one node, in full","view":{"type":"json","data":{"id":"function:shared.auth.decode_jwt","kind":"function","name":"decode_jwt","file":"shared/auth.py","line":16},"highlight":["id","file","line"]}}}},{"title":"Edges — and the direction is the whole point","narrative":["Nodes alone are still a listing with better labels. The edges are what make it a graph, and two properties do all the work.","<b>Directed</b>: <code>verify_token → decode_jwt</code> means verify_token calls decode_jwt, emphatically not the reverse. Flip the arrow and you have flipped the question — \"what do I depend on?\" becomes \"who depends on me?\", and only one of those two prevents an outage.","<b>Typed</b>: the edge says <code>calls</code>. An untyped line between two boxes is decoration; a typed, directed edge is a machine-readable sentence you can read aloud. Twenty-two of them come out of orderflow."],"youDo":"In <code>graph.json</code>, find the edge whose <code>source</code> is <code>function:shared.auth.verify_token</code>. Read it aloud as a sentence.","source":"labs/shared_tools/kg_extract.py, labs/sample-project","state":{"label":"22 edges · a representative five","before":{"title":"BEFORE — edges as sentences","view":{"type":"rows","columns":["source","type","target"],"rows":[{"cells":["<code>shared.auth.verify_token</code>","calls","<code>shared.auth.decode_jwt</code>"]},{"cells":["<code>billing.app.post_invoice</code>","calls","<code>shared.auth.verify_token</code>"]},{"cells":["<code>billing.webhooks.handle_payment_webhook</code>","calls","<code>billing.invoice.mark_paid</code>"]},{"cells":["<code>orders.orders.advance_order</code>","calls","<code>shared.events.publish</code>"]},{"cells":["<code>notifications.worker.start</code>","calls","<code>shared.events.subscribe</code>"]}]}},"after":{"title":"AFTER — one edge, in full","view":{"type":"json","data":{"source":"function:shared.auth.verify_token","target":"function:shared.auth.decode_jwt","type":"calls","provenance":"EXTRACTED"},"highlight":["provenance"]}}}},{"title":"Provenance — which of these twenty-two are facts","narrative":["That fourth field is the one the whole course turns on. Not every edge is equally certain, and an extractor that hides the difference is a confident guesser.","This extractor grades itself with one rule you can read in forty lines of source: a call whose target resolves to a definition <b>in the same module</b> is a parse-tree fact — <code>EXTRACTED</code>. A call resolved by matching a bare name against the one definition that happens to exist elsewhere in the repo is a heuristic — <code>INFERRED</code>. Two or more candidates and it must emit them all as <code>AMBIGUOUS</code> rather than pick a favourite.","On orderflow the split is nine to thirteen. Every one of the thirteen guesses happens to be right — but \"happens to be\" is doing load-bearing work in that sentence, and the tag is what lets you say it out loud."],"youDo":"Count the <code>EXTRACTED</code> edges yourself: <code>grep -c EXTRACTED graph.json</code>. At this size you can audit all nine by hand — do it.","claudeSays":"An agent reads the tag as a confidence floor: act on <code>EXTRACTED</code>, verify <code>INFERRED</code> before anything destructive, treat <code>AMBIGUOUS</code> as a question rather than an answer.","source":"labs/shared_tools/kg_extract.py, labs/sample-project","state":{"label":"22 edges · 9 EXTRACTED · 13 INFERRED · 0 AMBIGUOUS","before":{"title":"BEFORE — the rule, with a real example of each","view":{"type":"rows","columns":["tag","the rule that produced it","an orderflow edge"],"rows":[{"cells":["<code>EXTRACTED</code> · 9","target defined in the same module — a parse-tree fact","<code>verify_token → decode_jwt</code> (both in <code>shared/auth.py</code>)"],"tone":"win"},{"cells":["<code>INFERRED</code> · 13","exactly one definition of that bare name repo-wide — a guess","<code>post_invoice → verify_token</code> (across a file boundary)"],"tone":"bad"},{"cells":["<code>AMBIGUOUS</code> · 0","two or more candidates — emit all, confirm none","none here: no name in orderflow is defined twice"]}]}},"after":{"title":"AFTER — the audit finding nobody advertises","view":{"type":"rows","columns":["what the audit turns up","why","verdict"],"rows":[{"cells":["<code>decode_jwt → AuthError</code> appears <b>three</b> times","three <code>raise AuthError(…)</code> sites, lines 25, 32 and 37","correct, but the count is call sites, not relationships"]},{"cells":["<code>start → subscribe</code> appears <b>twice</b>","two <code>subscribe(…)</code> registrations in <code>worker.py</code>","same story"]},{"cells":["so 22 edges describe fewer than 22 distinct pairs","the extractor emits one edge per call site","know this before you quote an edge count at anyone"],"tone":"bad"}]}}}},{"title":"The question a listing cannot answer","narrative":["Now cash it in. Ask the question that prevents outages: <em>if I change <code>decode_jwt</code>'s claims format, what could break?</em>","Invert the edge index once, then walk incoming <code>calls</code> edges breadth-first. Two hops later the answer includes <code>post_invoice</code> — a billing route that never mentions JWTs, in a different service, in a different folder. No file listing produces that, and no grep does either: the connecting facts live in two files that never share a line.","The last line is the one to sit with. Demand proof — walk <code>EXTRACTED</code> edges only — and the radius shrinks to one. The gap between the two numbers <em>is</em> your uncertainty, and it is only visible because every edge carried a tag."],"youDo":"<code>cd labs/M01-graph-fundamentals/solution &amp;&amp; python graph_basics.py --check</code>. Then change the confidence floor and watch the radius move.","source":"labs/M01-graph-fundamentals/expected_output/sample_output.txt","terminal":[{"kind":"prompt","text":"python graph_basics.py --check"},{"kind":"out","text":"36 nodes, 22 edges loaded"},{"kind":"out-pass","text":"  [PASS] callers(decode_jwt)"},{"kind":"out-pass","text":"  [PASS] blast_radius(decode_jwt) contains post_invoice"},{"kind":"out-pass","text":"  [PASS] EXTRACTED-only radius is smaller or equal"},{"kind":"out-pass","text":"ALL CHECKS PASSED"}],"state":{"label":"\"what breaks if  + typed directed edges","36 nodes, 22 <code>calls</code> edges","M03 — where they come from (tree-sitter)"]},{"cells":["traversal","one dict inversion, then hash lookups","M09 — served to agents over MCP"]},{"cells":["multi-hop paths","BFS to <code>post_invoice</code>, two hops","M02 — why chunk retrieval cannot do this"]},{"cells":["provenance","9 EXTRACTED / 13 INFERRED / 0 AMBIGUOUS","M03 — the resolution ladder that assigns them"],"tone":"win"},{"cells":["communities &amp; centrality","left to the tools","M04 — Leiden clusters and the <code>shared/db.py</code> god node"]}]}}}}]},{"id":"kg-rag-shreds","badge":"WALKTHROUGH","color":"#06B6D4","time":"~5 min","title":"Three leads, no answer","spec":"M02 · a chunker cuts a call chain, and nothing warns you","intro":"Index orderflow, ask a structural question, and read what comes back. The retrieval succeeds by its own definition and the answer is still wrong — that is the whole lesson, and no better embedding model touches it.","provenance":{"kind":"illustrative","source":"a replayed retrieval session over labs/sample-project. The chunk boundaries in steps 1–2 are reproducible from the module's own chunker; the similarity scores and token counts in steps 3–5 are the module's LEADS_VS_ANSWERS figures. Steps 1, 2 and 6 carry their own citations."},"foot":"Make it fail on your machine: <code>labs/M02-rag-shreds-context/README.md</code> · the canonical-lookup half is <code>labs/M06-okf-authoring/</code>","steps":[{"title":"Index the repo the standard way","narrative":["Nothing exotic here — this is the pipeline everyone builds. Walk every <code>.py</code> and <code>.md</code> file, split on paragraph boundaries into pieces of at most 400 characters, keep <code>{text, source, chunk_index}</code>, embed each piece, store the vectors.","Forty-six chunks out of fourteen Python modules and four Markdown files. Phase 1 is done. Notice what the pipeline never asked and never recorded: how any chunk relates to any other chunk. It stores distances, and distance is all it will ever know."],"youDo":"<code>cd labs/M02-rag-shreds-context</code> and write the chunker — paragraph-aligned, 400 characters. Run it over <code>../sample-project/</code> and print the count.","source":"labs/M02-rag-shreds-context/README.md, labs/sample-project","terminal":[{"kind":"prompt","text":"python chunker.py ../sample-project"},{"kind":"out","text":"46 chunks indexed (14 .py + 4 .md, max 400 chars, paragraph-aligned)"},{"kind":"out","text":"  #11  services/billing/app.py     380 chars"},{"kind":"out","text":"  #12  services/billing/app.py     290 chars"},{"kind":"out","text":"  #39  shared/auth.py              262 chars"},{"kind":"out-pass","text":"index built · 0 errors"}],"state":{"label":"labs/sample-project → 46 chunks","before":{"title":"WHAT THE INDEX STORES","view":{"type":"rows","columns":["per chunk","stored?"],"rows":[{"cells":["the text","yes"],"tone":"win"},{"cells":["which file and which chunk index","yes"],"tone":"win"},{"cells":["a vector standing in for its meaning","yes"],"tone":"win"},{"cells":["which chunk this chunk <b>calls</b>","no — the pipeline has no concept of it"],"tone":"bad"},{"cells":["whether this chunk is current or superseded","no"],"tone":"bad"}]}}}},{"title":"Where the chunker cut the call chain","narrative":["orderflow's auth chain is three links long: <code>post_invoice</code> calls <code>verify_token</code>, which calls <code>decode_jwt</code>. Now look at where the 400-character boundaries landed.","The import <code>from shared.auth import AuthError, verify_token</code> is the last line of chunk #11. The call site <code>claims = verify_token(authorization)</code> is in chunk #12. The chunker cut between a symbol's import and its use — the two halves of the same fact, in two different vectors.","And <code>verify_token</code>'s definition isn't in either of them; it is chunk #39, in a different file. As the module puts it: if cause and effect aren't co-located in the same chunk, your system has no idea they're connected. Here they are three chunks apart, and one of the cuts fell between adjacent lines of the same function."],"youDo":"Open <code>services/billing/app.py</code> at lines 11 and 19, then <code>shared/auth.py</code> at line 41. Three links, two files, and your chunker put all three in separate pieces.","source":"labs/sample-project/services/billing/app.py, labs/sample-project/shared/auth.py","state":{"label":"one call chain, three chunks","before":{"title":"BEFORE — the chain as it exists in source","view":{"type":"diff","file":"the auth chain across two files","lines":[["p","services/billing/app.py:11   from shared.auth import AuthError, verify_token"],["p","services/billing/app.py:19       claims = verify_token(authorization)"],["p","shared/auth.py:41            def verify_token(token: str | None) -> dict:"],["p","shared/auth.py:45                return decode_jwt(token.removeprefix(\"Bearer \").strip())"]]}},"after":{"title":"AFTER — the chain as the index stores it","view":{"type":"rows","columns":["chunk","holds","knows about the others?"],"rows":[{"cells":["#11 <code>app.py</code>","the module docstring and the imports — ending on <code>verify_token</code>","no"],"tone":"bad"},{"cells":["#12 <code>app.py</code>","<code>post_invoice</code> and the actual call — but not the import","no"],"tone":"bad"},{"cells":["#39 <code>auth.py</code>","<code>def verify_token</code> and the call to <code>decode_jwt</code>","no"],"tone":"bad"},{"cells":["the relationship itself","nowhere — it was never a chunk","there is nothing to retrieve"],"tone":"bad"}]}}}},{"title":"Ask it a structural question","narrative":["Phase 2. The question is the one an agent asks constantly before it dares change anything: <b>who calls <code>verify_token</code>?</b>","The query gets embedded, the index returns its three nearest neighbours, and every one of them scores high. Read the scores and then read what they mean: 0.89 says <em>this chunk's language resembles your question's language</em>. Not one of the three claims to contain a call."],"youDo":"Run the same query against your own index and write down the top three sources before you look at them.","terminal":[{"kind":"prompt","text":"who calls verify_token?"},{"kind":"tool","text":"vector_search(query=\"who calls verify_token\", k=3)"},{"kind":"out","text":"  0.89  shared/auth.py     \"contains verify, token…\""},{"kind":"out","text":"  0.84  billing/webhooks.py \"token-adjacent language\""},{"kind":"out","text":"  0.81  billing/app.py      \"auth-flavored words\""},{"kind":"out-pass","text":"retrieval complete · 3 chunks · 0 errors · 0 warnings"}],"state":{"label":"top-3 by cosine similarity","before":{"title":"THREE HIGH-CONFIDENCE LEADS","view":{"type":"rows","columns":["score","source","what the score is actually claiming"],"rows":[{"cells":["0.89","<code>shared/auth.py</code>","similar wording"]},{"cells":["0.84","<code>billing/webhooks.py</code>","similar wording"]},{"cells":["0.81","<code>billing/app.py</code>","similar wording"]},{"cells":["—","—","none of the three claims \"this file <b>calls</b> it\""],"tone":"bad"}]}}}},{"title":"Read the shreds","narrative":["Open them. Lead 1 is the top hit and it is the <b>definition</b> — <code>def verify_token</code>, the callee, structurally the opposite of what was asked. It scored highest precisely because it repeats the query's words most densely.","Lead 2 is <code>webhooks.py</code>, which handles tokens of a different kind entirely and never touches auth. Lead 3 is <code>app.py</code> — the right file — but the retrieved chunk is #11, the imports. It proves <code>verify_token</code> was <em>imported</em>; it does not contain the call.","The chunk that actually holds <code>claims = verify_token(authorization)</code> is #12, and it lost. Most of its 290 characters are a decorator, a signature and an exception handler; it says the query's words once. The one chunk with the answer ranked below three chunks without it — <b>because ranking by similarity is not ranking by truth</b>."],"claudeSays":"Three chunks arrive with identical confidence tone and no structural claim attached. Nothing in the payload distinguishes the definition from a call site from an import.","state":{"label":"what each lead really contains","before":{"title":"LEAD BY LEAD","view":{"type":"rows","columns":["lead","what it contains","answers \"who calls it?\""],"rows":[{"cells":["0.89 <code>auth.py</code>","the <b>definition</b> of <code>verify_token</code>","no — that is the callee"],"tone":"bad"},{"cells":["0.84 <code>webhooks.py</code>","payment-webhook handling; no auth at all","no"],"tone":"bad"},{"cells":["0.81 <code>app.py</code> #11","the <b>import</b> line, and the module docstring","no — importing is not calling"],"tone":"bad"},{"cells":["<i>not retrieved</i> <code>app.py</code> #12","<code>claims = verify_token(authorization)</code> — the answer","yes, and it ranked fourth or worse"],"tone":"bad"}]}},"after":{"title":"WHY A BETTER EMBEDDER MAKES THIS WORSE","view":{"type":"note","text":"A perfect embedding model would represent each shred's meaning perfectly — and chunk #11 genuinely <em>is</em> about <code>verify_token</code>, so a better model ranks it <b>higher</b>, not lower. The information you need is the relationship between chunks, and it was destroyed at chunking time, before any vector was computed. There is no model upgrade that restores it, which is why the fix in this course is architectural rather than a shopping decision."}}}},{"title":"The answer is confidently incomplete","narrative":["The model receives three high-similarity chunks about authentication and does the reasonable thing: it answers. \"<code>verify_token</code> is used by the billing service's request path and by webhook handling.\" Half true, unsourced, and unfalsifiable from what it was given.","Nothing crashed. No score dipped below a threshold. No log line said \"the relevant chunk did not make the cut.\" This is the module's signature failure mode — <b>silent wrongness</b> — and it is the reason this walkthrough stops at the failure instead of rushing to the fix.","The agent's only recourse is the M00 tax: open each lead and read enough code to judge it. Three files, roughly 7,900 tokens, and at the end of it you have verified three leads and still cannot prove there is no fourth caller somewhere you never retrieved."],"terminal":[{"kind":"claude","text":"verify_token is used by the billing service's request path and\nby webhook handling. Both call it before processing the payload."},{"kind":"tool","text":"Read  shared/auth.py        → the definition. not a caller."},{"kind":"tool","text":"Read  billing/webhooks.py   → no call. false lead."},{"kind":"tool","text":"Read  billing/app.py        → one real call, line 19."},{"kind":"out-fail","text":"3 files opened · ~7,900 tokens · 1 of 3 leads real · completeness: unprovable"}],"state":{"label":"the bill for one structural question","before":{"title":"WHAT THE PIPELINE REPORTED","view":{"type":"rows","columns":["signal","value"],"rows":[{"cells":["errors","0"]},{"cells":["warnings","0"]},{"cells":["lowest similarity returned","0.81 — comfortably above any sane threshold"]},{"cells":["chunks containing the answer","0 of 3"],"tone":"bad"},{"cells":["anything that told you so","nothing"],"tone":"bad"}]}},"after":{"title":"WHAT IT ACTUALLY COST","view":{"type":"bars","unit":"tokens","max":8000,"items":[{"label":"retrieved chunks","value":1200,"note":"three shreds, none of them the answer"},{"label":"verification reads","value":7900,"tone":"bad","note":"opening each lead to tell a call from a mention — M00's exploration tax, returning"}]}}}},{"title":"The contrast — and the part where RAG still wins","narrative":["Same question, different machine. A structural graph was asked to store this relationship at extraction time, so answering is a lookup: one call, one caller, a provenance tag attached. Fifteen tokens against 7,900, and only one of the two answers can tell you whether it is a fact or a guess.","Now the honest half, because deleting your vector database would be trading one over-correction for another. RAG was built to find relevant passages in a huge pile of unstructured text nobody will ever curate — years of Slack, a lake of one-off design docs, millions of tickets. On that corpus, with exploratory questions, similarity is exactly the right criterion and a graph has nothing to offer.","The professional default is <b>RAG first, graph when depth becomes a bottleneck</b>. Roughly 72% of enterprise RAG deployments underdelivered in year one — and the dominant causes were bad chunking, stale indexes and mismatched embedding models, not the absence of a graph. Adding a graph to a broken pipeline gives you a broken pipeline with higher operational overhead."],"youDo":"Write down the two failure signatures that justify adding a layer: multi-hop structural questions failing, and canonical facts coming back stale or conflicting. Add nothing until you have observed one.","source":"labs/shared_tools/kg_extract.py, labs/sample-project/services/billing/app.py","terminal":[{"kind":"prompt","text":"who calls verify_token?"},{"kind":"tool","text":"graph_callers(symbol=\"verify_token\")"},{"kind":"out-pass","text":"[\"post_invoice\"]   · 1 tool call · ~15 tokens · provenance tag attached to the edge"},{"kind":"claude","text":"One caller: post_invoice, billing/app.py:19. This is the complete\nlist rather than a sample — the edge index was built by walking\nevery call site in the repo, not by ranking three of them."}],"state":{"label":"leads vs answers, and where each belongs","before":{"title":"SAME QUESTION, TWO MACHINES","view":{"type":"rows","columns":["","vector retrieval","structural graph"],"rows":[{"cells":["what comes back","leads — text that resembles the question","answers — stored structural facts"]},{"cells":["cost here","~7,900 tokens after verification","~15 tokens, one call"],"tone":"win"},{"cells":["completeness","unprovable","the full caller set, by construction"]},{"cells":["fact or guess?","a similarity score is not a truth label","every edge carries a provenance tag"]}]}},"after":{"title":"AND WHERE THAT REVERSES","view":{"type":"rows","columns":["corpus and question","right tool","why"],"rows":[{"cells":["\"what themes come up in churn interviews?\" over years of Slack","vector RAG","exploratory, uncuratable, similarity is the correct criterion"],"tone":"win"},{"cells":["\"who calls X?\" over a codebase","structural graph","the relationship is extractable and exact"],"tone":"win"},{"cells":["\"what IS our WAU definition?\"","neither — a curated concept file","a canonical fact deserves a lookup, not a search (Track 3)"]},{"cells":["a pipeline with bad chunking and a stale index","fix the pipeline","72% of RAG failures are RAG done badly, not RAG missing a graph"],"tone":"bad"}]}}}}]},{"id":"kg-four-levers","badge":"WALKTHROUGH","color":"#10B981","time":"~4 min","title":"Four levers, one window","spec":"M02B · add / compress / retrieve / offload on the same 9,685-token turn","intro":"Take the six-layer inventory this module builds — 9,685 tokens, of which the user's question is 85 — and pull each lever on it in turn. Watch which layer each one moves, and which one loses.","provenance":{"kind":"illustrative","source":"the starting window is the module's own SIX_LAYERS inventory (system 420 · tools 1,180 · history 3,250 · retrieved 2,800 · tool results 1,950 · current turn 85). The per-lever figures are projections onto that window, not a measured run; step 5 carries the lab's measured table and cites it."},"foot":"The measured version — four arms over a real poisoned transcript — is <code>labs/M02B-context-levers/</code>","steps":[{"title":"The turn, itemised","narrative":["One question, asked mid-session: <em>who calls <code>decode_jwt</code>, and is the WAU definition in the docs the current one?</em> Before the model reads a word of it, here is what else is in the window with it.","Six line items, 9,685 tokens. The message the user actually typed is <b>85 of them — 0.9%</b>. When the answer comes back wrong, the reflex is to rewrite those 85 tokens. The other 99.1% is where the answer lives or dies.","So stop rewriting and start budgeting. Everything you can do about this window is one of four levers, and each one moves a different line."],"youDo":"Before optimising anything, itemise. Print the token count of each of the six layers in your own agent's next turn — you cannot attack the biggest line until you know which one it is.","state":{"label":"turn 8 · before any lever","before":{"title":"BASELINE — six layers, 9,685 tokens","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":420},{"label":"tools","tokens":1180},{"label":"history","tokens":3250},{"label":"retrieved","tokens":2800},{"label":"tool results","tokens":1950},{"label":"current turn","tokens":85}],"highlight":["current turn"],"note":"The highlighted layer is the question. History and retrieved together are 6,050 tokens — 62% of the budget — and neither of them was asked for on this turn."}}}},{"title":"add — the reflex, and its bill","narrative":["The first instinct when an agent answers badly is to tell it more. Drop a 340-line root <code>CLAUDE.md</code> into the system layer — the architecture, the conventions, the metric definitions, the deploy runbook — and the agent will surely stop guessing.","It does stop guessing about a few things. It also now pays ~4,200 tokens on <b>every session</b>, including the ones that never touch billing or metrics, and the window grows from 9,685 to <b>13,885</b>. The question you asked is now 0.6% of the context.","<code>add</code> is the only lever anyone can pull without infrastructure, which is exactly why it is the default failure mode. It is not wrong — M12's layered, directory-scoped <code>CLAUDE.md</code> is <code>add</code> done properly, carrying repo-wide facts and nothing else. Done improperly it is the everything-file, and inclusion is a cost, not a kindness."],"youDo":"Count the lines in your repo's root <code>CLAUDE.md</code>. Then ask which of them the last five sessions actually needed.","state":{"label":"lever 1 · add","before":{"title":"BEFORE — 9,685","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":420},{"label":"tools","tokens":1180},{"label":"history","tokens":3250},{"label":"retrieved","tokens":2800},{"label":"tool results","tokens":1950},{"label":"current turn","tokens":85}],"note":"The system layer is 420 tokens: identity, a few standing rules."}},"after":{"title":"AFTER — 13,885, every session","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":4620},{"label":"tools","tokens":1180},{"label":"history","tokens":3250},{"label":"retrieved","tokens":2800},{"label":"tool results","tokens":1950},{"label":"current turn","tokens":85}],"highlight":["system"],"note":"+43% on the window, paid on every turn of every session — including the ones that never touch a single fact in the file. This is the one lever that can make the budget worse, and it is the one everybody reaches for first."}}}},{"title":"compress — same information, fewer tokens","narrative":["Now aim at the layer that grew from exploration: <b>tool results</b>, 1,950 tokens of grep output and file dumps the agent accumulated working out where <code>decode_jwt</code> lives.","<code>compress</code> replaces that with a summary built once and reused by everyone — the ~700-token orientation read out of <code>GRAPH_REPORT.md</code>. Same territory covered, a third of the tokens, and the summary was generated at extraction time rather than re-derived by this session.","The window falls to <b>8,435</b>. Note what compress does <em>not</em> do: it still describes exploration that happened. The next lever asks why the exploration happened at all."],"claudeSays":"The agent reads one generated report section instead of the transcript of its own search. The compression cost was paid once, offline, by the build.","state":{"label":"lever 2 · compress","before":{"title":"BEFORE — 1,950 tokens of dumps","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":420},{"label":"tools","tokens":1180},{"label":"history","tokens":3250},{"label":"retrieved","tokens":2800},{"label":"tool results","tokens":1950},{"label":"current turn","tokens":85}],"highlight":["tool results"],"note":"Grep output, two whole-file reads, and the transcript of both."}},"after":{"title":"AFTER — 8,435 · one generated summary","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":420},{"label":"tools","tokens":1180},{"label":"history","tokens":3250},{"label":"retrieved","tokens":2800},{"label":"tool results","tokens":700},{"label":"current turn","tokens":85}],"highlight":["tool results"],"note":"−1,250 tokens, −13% on the window. Built once by <code>graphify update .</code>, read by every session that follows — that reuse is what makes compress an infrastructure lever rather than a per-conversation trick."}}}},{"title":"retrieve — don't summarise the search, replace it","narrative":["Same layer, sharper attack. Instead of compressing the record of an exploration, ask a structural question and carry only its answer: <code>explore(\"decode_jwt\")</code> returns kind, location, callers, callees and blast radius as one compact composite — about 180 tokens.","The window falls to <b>7,915</b>, below the compressed arm, and something less obvious improves too. Five facts spread across five tool results sit in the middle of a long context, where recall is worst; one short composite adjacent to the question has no middle to get lost in.","This is the lever Track 2 exists to industrialise. The query is nearly free because the expensive part — parsing and indexing — already happened at extract time, and the answer is a stored structural fact rather than three leads you would have to verify by reading files."],"youDo":"In your own stack, find the biggest tool-results turn of the week and ask: was that a question a pre-built index could have answered in one call?","state":{"label":"lever 3 · retrieve","before":{"title":"BEFORE — compressed to 700","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":420},{"label":"tools","tokens":1180},{"label":"history","tokens":3250},{"label":"retrieved","tokens":2800},{"label":"tool results","tokens":700},{"label":"current turn","tokens":85}],"note":"A shorter account of an exploration that still had to happen."}},"after":{"title":"AFTER — 7,915 · one graph answer","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":420},{"label":"tools","tokens":1180},{"label":"history","tokens":3250},{"label":"retrieved","tokens":2800},{"label":"tool results","tokens":180},{"label":"current turn","tokens":85}],"highlight":["tool results"],"note":"1,950 → 180 against the baseline. Note the trade the <code>tools</code> layer makes: 1,180 tokens of schemas are the price of admission for this lever, which is why M09 ships composite tools instead of a dozen narrow ones."}}}},{"title":"offload — and which lever wins is a property of your window","narrative":["Two layers are still untouched and together they are 6,050 tokens: <b>retrieved</b> holds similarity-ranked chunks about the WAU metric, including a stale one; <b>history</b> still contains the whole argument about which definition is right, long since settled.","<code>offload</code> puts settled knowledge where it belongs — one canonical OKF concept file, ~340 tokens, kept honest by M08's enrichment hook — and lets the resolved debate leave the transcript. Alone it takes the window to <b>6,985</b>. Combined with <code>retrieve</code>: <b>5,215</b>, or 54% of the baseline, with every fact still present.","Now the caveat that keeps this honest. On this module's lab fixture the profile was different — tool results were 2,341 of 3,131 tokens, 75% of the budget — so there <code>retrieve</code> was the big winner at 34% of raw and <code>offload</code> only reached 89%. On <em>this</em> window, history and retrieved dominate, so offload wins bigger. <b>Which lever pays is a property of your layer profile, not a ranking you can memorise.</b> Itemise first."],"youDo":"<code>cd labs/M02B-context-levers/starter &amp;&amp; python context_levers.py --check</code> — then compare the arm ordering it prints against the ordering here, and explain the difference from the layer profile alone.","source":"labs/M02B-context-levers/expected_output/sample_output.txt","terminal":[{"kind":"prompt","text":"python context_levers.py --check"},{"kind":"out","text":"arm                  tokens   vs raw  facts preserved"},{"kind":"out","text":"raw                   3,131    100%  ALL"},{"kind":"out","text":"compress              1,551     50%  ALL"},{"kind":"out-pass","text":"retrieve              1,049     34%  ALL"},{"kind":"out","text":"offload               2,802     89%  ALL"},{"kind":"out-pass","text":"retrieve+offload        721     23%  ALL"},{"kind":"gate","text":"the raw arm also preserves ALL facts — rot is signal-to-noise, not budget"}],"state":{"label":"lever 4 · offload, then all of them","before":{"title":"OFFLOAD ALONE — 6,985","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":420},{"label":"tools","tokens":1180},{"label":"history","tokens":3010},{"label":"retrieved","tokens":340},{"label":"tool results","tokens":1950},{"label":"current turn","tokens":85}],"highlight":["retrieved","history"],"note":"Stale chunks out, one canonical concept file in; the settled WAU argument leaves history. −28% on its own, without touching exploration at all."}},"after":{"title":"RETRIEVE + OFFLOAD — 5,215 (54%)","view":{"type":"window","label":"200K window","capacity":200000,"layers":[{"label":"system","tokens":420},{"label":"tools","tokens":1180},{"label":"history","tokens":3010},{"label":"retrieved","tokens":340},{"label":"tool results","tokens":180},{"label":"current turn","tokens":85}],"highlight":["retrieved","tool results"],"note":"Nothing was summarised away and no fact was dropped — the levers deleted what was never the answer. Compare the lab's ordering in the terminal: <b>retrieve</b> won there and <b>offload</b> wins here, on the same four levers, because the two windows had different biggest lines."}}}}]},{"id":"kg-tree-sitter","badge":"WALKTHROUGH","color":"#F97316","time":"~6 min","title":"Twenty-one calls, five edges","spec":"M03 · source → tree → query → graded edges, and the ones the parser refuses to guess","intro":"Parse one real orderflow file, run an extraction query over the tree, grade every capture, and finish on the honest part: the call edges a static parser can never resolve, and why refusing to emit them is the feature.","provenance":{"kind":"illustrative","source":"a replayed extraction session over labs/sample-project/shared/auth.py. The S-expression in step 2 is trimmed for reading; the grep hits, definition lines, call-site counts and edge grades in steps 1, 3, 4 and 6 are reproducible with labs/shared_tools/kg_extract.py and are cited per step."},"foot":"Do it for real in <code>labs/M03-tree-sitter-extraction/README.md</code> — including the fault-tolerance step, which is the one that changes how you think about \"the code doesn't compile\"","steps":[{"title":"One symbol, three different things","narrative":["Start with what the alternatives see. Search orderflow for <code>decode_jwt</code> and five lines come back across three files.","One is a definition. One is a call. Three are prose — a runbook sentence, an ASCII diagram, a README bullet. Grep found the <em>string</em> <code>decode_jwt</code> and has no vocabulary for the

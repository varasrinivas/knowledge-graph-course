/hooks/post-commit && chmod +x .git/hooks/post-commit"},{"kind":"prompt","text":"export ORDERFLOW_PYTHON=$(which python)"},{"kind":"out-pass","text":"hook installed · post-commit · synchronous, set -e, exits non-zero on failure"}],"state":{"label":"what this hook refuses to do","before":{"title":"THE LINES THAT ARE NOT IN IT","view":{"type":"rows","columns":["the tempting line","why it looks sensible","what it actually does"],"rows":[{"cells":["<code>nohup ... &amp;</code>","keeps the commit fast","Git for Windows has no <code>nohup</code>. The rebuild never happens and nothing says so"],"tone":"bad"},{"cells":["<code>|| true</code>","a broken hook shouldn't block my commit","converts every failure into a success. The bundle rots with a green light"],"tone":"bad"},{"cells":["<code>&gt; /dev/null 2&gt;&amp;1</code>","keeps the terminal clean","the one place the error would have been visible"],"tone":"bad"},{"cells":["\"skip if load is high\"","don't fight CI for CPU","a silent skip whose retry is \"the next commit\" — which on a quiet branch is days away"],"tone":"bad"},{"cells":["<code>set -e</code> + explicit <code>exit 1</code>","—","what the lab ships. A failed refresh is a failed hook, visibly"],"tone":"win"}]}}}},{"title":"One file changes, one concept refreshes","narrative":["Touch <code>services/billing/webhooks.py</code> and commit. Read the four log lines as the four decisions they encode.","Line 1 is the whole cost model: the diff said <code>services/billing/</code>, the <code>SERVICE_MAP</code> table turned that into exactly one concept, and nothing else in the bundle was looked at. Line 2 is pass 1 done <b>deterministically</b> — the dependency facts come from the structural graph, not from a model, so that section cannot hallucinate. Line 3 records what the bundle learned. Line 4 is the gate.","Look closely at the refreshed block. All four edges are tagged <code>INFERRED</code> — bare-name resolution matched <code>publish</code> and <code>verify_token</code> to definitions by heuristic. The hook writes the provenance tag into the concept alongside the fact, so a reader can see which of these four the pipeline is confident about. It is confident about none of them, and it says so."],"youDo":"Add a comment to <code>services/billing/webhooks.py</code>, <code>git commit -am \"billing: note retry intent\"</code>, and watch. If nothing appears: the file must be named exactly <code>post-commit</code>, live in <code>.git/hooks/</code>, and be executable.","source":"labs/M08-enrichment-hook/solution/refresh_concepts.py, labs/shared_tools/kg_extract.py","terminal":[{"kind":"prompt","text":"git commit -am \"billing: note retry intent in webhooks\""},{"kind":"out","text":"[enrich] changed: services/billing/webhooks.py -> concept billing-service"},{"kind":"out","text":"[enrich] refreshed Dependencies (4 edges) in billing-service.md"},{"kind":"out","text":"[enrich] log.md updated"},{"kind":"out-pass","text":"[enrich] lint: 5 concepts valid, 0 errors"}],"state":{"label":"knowledge/services/billing-service.md","before":{"title":"BEFORE — hand-written, last touched by a human","view":{"type":"diff","file":"knowledge/services/billing-service.md","lines":[["p","# Responsibilities"],["p","Owns the Invoice domain model. Verifies every request via shared auth."],["p",""],["p","## Dependencies"],["p","- calls `shared.auth.verify_token`"],["p","- calls `shared.events.publish`"]]}},"after":{"title":"AFTER — regenerated from the graph, provenance attached","view":{"type":"diff","file":"knowledge/services/billing-service.md","lines":[["p","# Responsibilities"],["p","Owns the Invoice domain model. Verifies every request via shared auth."],["p",""],["p","## Dependencies"],["m","- calls `shared.auth.verify_token`"],["m","- calls `shared.events.publish`"],["a","- calls `shared.auth.verify_token` (INFERRED)"],["a","- calls `shared.db.execute` (INFERRED)"],["a","- calls `shared.db.query` (INFERRED)"],["a","- calls `shared.events.publish` (INFERRED)"]]}}}},{"title":"Break the lint gate on purpose","narrative":["A gate you have never seen fire is a decoration. Delete <code>type:</code> from <code>billing-service.md</code>, commit any code change, and watch the pipeline stop before publish.","Read the last line word by word, because it is more careful than it looks. It says the bundle was <b>NOT published</b> — not \"not updated\". By the time lint ran, the draft pass had already rewritten concept files on disk. The bundle is dirty <em>and</em> unpublished, which means the files sitting in your working tree right now must not be trusted or committed as they are.","That distinction is what separates a real gate from a report. A lint that warns lets a malformed bundle reach an agent. This one exits non-zero, and the hook refuses to pretend otherwise."],"youDo":"Delete the <code>type:</code> line from one concept, commit any code change, then run <code>echo $?</code>. If it prints 0, your gate is decorative and you have just reproduced the failure M11 is about.","source":"labs/M08-enrichment-hook/README.md, labs/M06-okf-authoring/solution/validate.py","terminal":[{"kind":"prompt","text":"sed -i '/^type: Service$/d' knowledge/services/billing-service.md"},{"kind":"prompt","text":"git commit -am \"billing: tidy webhook docstring\""},{"kind":"out","text":"[enrich] changed: services/billing/webhooks.py -> concept billing-service"},{"kind":"out","text":"[enrich] refreshed Dependencies (4 edges) in billing-service.md"},{"kind":"out","text":"[enrich] log.md updated"},{"kind":"out-fail","text":"[enrich] lint: ERROR knowledge/services/billing-service.md: missing required field 'type'\n4 concepts valid, 1 errors"},{"kind":"out-fail","text":"[enrich] lint failed — refusing to publish the bundle"},{"kind":"gate","text":"[enrich] FAILED — bundle NOT published (lint rejected it; local concept files may hold unpublished drafts). Fix before trusting or committing the bundle."}],"state":{"label":"where the pipeline stopped","before":{"title":"SIX STAGES, ONE HARD GATE","view":{"type":"rows","columns":["stage","ran?","state it left behind"],"rows":[{"cells":["diff-scoped scan","yes","one concept selected out of five"],"tone":"win"},{"cells":["draft / update","yes","<b>billing-service.md rewritten on disk</b>"],"tone":"bad"},{"cells":["re-link","yes","Dependencies replaced, prose preserved"]},{"cells":["log.md","yes","a dated entry already appended"],"tone":"bad"},{"cells":["lint","yes — and failed","exit 1, naming the file"],"tone":"win"},{"cells":["publish","<b>never reached</b>","nothing shipped; the working tree holds an unpublished draft"],"tone":"win"}]}},"after":{"title":"WHAT \"NOT PUBLISHED\" OBLIGES YOU TO DO","view":{"type":"note","text":"Restore the <code>type:</code> line and re-run before you commit the bundle. Do <b>not</b> reach for <code>--no-verify</code> or comment out the gate to get past it — the whole trust model of the bundle is the single sentence <em>what is published passed the gate</em>. The moment that stops being true, every agent downstream is reading text with no warranty on it, and nothing in the OKF spec will ever warn them."}}}},{"title":"Now the hook that does nothing","narrative":["Here is the same hook with three small improvements: it backgrounds the work so commits stay fast, it silences the output so the terminal stays clean, and it always exits 0 so a broken pipeline never blocks anyone. Every one of those was requested by a real teammate for a real reason.","Install it on Windows and commit. The commit succeeds. The hook exits 0. Git prints its usual summary. And nothing happens — Git for Windows' shell has no <code>nohup</code>, the error went to <code>/dev/null</code>, and <code>exit 0</code> swallowed the rest.","Compare the two terminals. The failure signature of a hook that is working perfectly and a hook that is doing nothing at all is <b>identical</b>: a clean commit. That is the entire problem. Your team commits daily for three weeks, believes the graph updates, and is wrong."],"youDo":"Grep your own hooks for the four words that hide failures: <code>grep -nE 'nohup|\\|\\| true|/dev/null|&amp; *$' .git/hooks/*</code>. Every hit is a place a failure can go to die.","terminal":[{"kind":"prompt","text":"cat .git/hooks/post-commit"},{"kind":"out","text":"#!/bin/sh\nREPO_ROOT=\"$(git rev-parse --show-toplevel)\"\nnohup python \"$REPO_ROOT/tools/refresh_concepts.py\" \"$REPO_ROOT\" > /dev/null 2>&1 &\nexit 0"},{"kind":"prompt","text":"git commit -am \"billing: add fraud-check call\""},{"kind":"out","text":"[main 7c41ab9] billing: add fraud-check call\n 1 file changed, 3 insertions(+)"},{"kind":"gate","text":"commit succeeded · hook exit code 0 · zero enrichment output · bundle unchanged"}],"state":{"label":"four documented ways a hook lies","before":{"title":"GREEN LIGHTS OVER RED STATES","view":{"type":"rows","columns":["mechanism","what breaks","what you see"],"rows":[{"cells":["missing <code>nohup</code> on Windows","the rebuild process is never started","a normal commit"],"tone":"bad"},{"cells":["extension allowlist drift","the hook's <code>CODE_EXTS</code> list falls out of sync with the extractor's, so real code files stop triggering rebuilds","a normal commit"],"tone":"bad"},{"cells":["silent resource gating","the rebuild is skipped under load; the retry is \"next commit\", which on a quiet branch is days","a normal commit"],"tone":"bad"},{"cells":["MCP server startup cache","the graph rebuilt fine, but the server that serves it is still holding the version it loaded at boot","a normal commit, and a correct file on disk"],"tone":"bad"},{"cells":["all four","different causes, one symptom","<b>the artifact predates HEAD</b> — which is measurable"],"tone":"win"}]}},"after":{"title":"THE ONLY DEFENCE","view":{"type":"note","text":"Your defence cannot be \"fix these four bugs\" — new ones will ship, and the next one will also exit 0. <b>Never trust a hook's exit code.</b> All four of these mechanisms exit clean, which is why the check in the next step ignores the hook entirely and asks the artifact a question instead."}}}},{"title":"The check that catches all four","narrative":["Stop asking \"did the hook run?\" and start asking \"is the artifact newer than the code?\" That question has one mechanical answer: compare the graph's modification time against <code>git log -1</code>'s commit time.","It is one comparison, and it catches every silent failure above, because however the rebuild died the symptom is the same — the artifact predates HEAD. Note the detail that makes it correct: it compares against <b>commit time</b>, not wall-clock age. A repo nobody has touched for a month with a month-old graph is perfectly fresh.","Notice also what the gate does not do. It does not repair anything. It refuses to proceed and prints the exact command that fixes it — including the reminder to restart any MCP server still holding the old graph, which is failure mechanism four. Detection and repair stay separate, so a broken repair path can never silence detection."],"youDo":"Run it right after an empty commit — <code>git commit --allow-empty -qm \"no rebuild\"</code> then <code>python ../M11-freshness-gate/solution/freshness_gate.py . --max-age-commits 0</code>. If your setup cannot fail this, it is a demo that has not failed yet.","source":"labs/M11-freshness-gate/solution/freshness_gate.py, labs/M11-freshness-gate/README.md","terminal":[{"kind":"prompt","text":"python ../M11-freshness-gate/solution/freshness_gate.py . --max-age-commits 0"},{"kind":"out-fail","text":"STALE: graph.json predates HEAD by 1 commit(s)"},{"kind":"out","text":"  fix: python labs/shared_tools/kg_extract.py labs/sample-project --out labs/sample-project/graphify-out/graph.json  (then restart any MCP server holding the old graph)"},{"kind":"prompt","text":"# fix the hook, re-commit, re-run"},{"kind":"out-pass","text":"FRESH: graph.json generated at/after HEAD commit"},{"kind":"out-pass","text":"CROSS-CHECK OK: stored counts match a fresh extraction"}],"state":{"label":"belief vs measurement","before":{"title":"BEFORE — freshness as a belief","view":{"type":"rows","columns":["\"how do you know the graph is current?\"","verdict"],"rows":[{"cells":["\"the hooks handle it\"","all four failure modes exit 0"],"tone":"bad"},{"cells":["\"we'd notice\"","the symptom is a normal commit"],"tone":"bad"},{"cells":["\"it hasn't happened yet\"","nothing here reports when it does"],"tone":"bad"}]}},"after":{"title":"AFTER — freshness as a query","view":{"type":"rows","columns":["check","what it catches","where it runs"],"rows":[{"cells":["graph mtime vs HEAD commit time","every silent hook death, whatever killed it","CI, before any agent-consuming step"],"tone":"win"},{"cells":["<code>--cross-check</code> counts vs a fresh extraction","artifacts that disagree with each other","same job, one flag"],"tone":"win"},{"cells":["the enrichment lint gate (step 3)","structurally invalid concepts","the hook itself, on every commit"],"tone":"win"},{"cells":["restart MCP servers after regeneration","the server still serving the graph it loaded at boot","your deploy step, not your hope"],"tone":"win"}]}}}},{"title":"Why it survives past Friday","narrative":["One decision keeps this pipeline alive, and you already made it in step 2: <b>scope every pass to the diff, not the repository</b>. Everything else is style.","Run the arithmetic on a real repo. Four hundred services, forty commits a day. A full-repo pass drafts 400 concepts per commit at roughly 1.5K tokens each — around 600K tokens per commit, 24 million tokens a day. A diff-scoped pass on a typical commit touches one or two services: about 3K tokens per commit, 120K a day. Same freshness on the concepts that actually changed, for a two-hundredth of the cost.","The failure that follows from getting this wrong is not a big bill. It is that the pipeline gets switched off during its first expensive week — and a switched-off pipeline means confident staleness, which is the exact condition the whole system was built to prevent. A team that re-scans everything on every commit finds the pipeline too expensive well before their repo is large enough to need it."],"youDo":"Before you commit to any of this, measure your own delta: run one real multi-agent task with and without the bundle and write down both token counts. That number is yours; every number below is somebody else's.","state":{"label":"400 services · 40 commits/day","before":{"title":"THE COST MODEL IN ONE DECISION","view":{"type":"bars","unit":"tokens / day","max":24000000,"items":[{"label":"full-repo pass","value":24000000,"tone":"bad","note":"400 drafts × ~1.5K × 40 commits — a budget line that gets the pipeline killed"},{"label":"diff-scoped pass","value":120000,"tone":"win","note":"~2 drafts × ~1.5K × 40 commits — a rounding error, and identical freshness where it matters"}]}},"after":{"title":"AND THE NUMBER NOT TO QUOTE","view":{"type":"note","text":"You will see \"up to 95% token reduction versus naive document loading\" attached to this pattern. Treat it the way this course treats every headline: it is <b>anecdotal and unvalidated at production scale</b>, and it comes from focused, stable knowledge domains that flatter it. It plausibly indicates the <em>direction</em> of savings for pre-compiled context. It is not a planning input. And the prior gate still applies: if nothing agentic is consuming your bundle, you are not building a knowledge pipeline — you are maintaining a wiki nobody reads."}}}}]},{"id":"kg-mcp-handshake","badge":"WALKTHROUGH","color":"#8B5CF6","time":"~5 min","title":"Three round trips to an answer","spec":"M09 · registering, announcing, calling","intro":"Wire a graph server into an agent and follow the JSON. Two of the three round trips happen once per session; only the third is paid per question — and one of them is the smoke test that stops you shipping a benchmark built on a dead server.","provenance":{"kind":"measured","source":"labs/M09-mcp-graph-server/solution/server.py#selftest, labs/sample-project, labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-multi.json#S1"},"foot":"Every tool response below is this server's real output over orderflow — reproduce with <code>python labs/M09-mcp-graph-server/solution/server.py --selftest</code>","steps":[{"title":"One line to register","narrative":["There is no deployment step here. You are telling the assistant: when a session starts in this project, spawn this subprocess and speak JSON to it over its stdin and stdout. No port, no daemon, no auth.","Everything after the <code>--</code> is the command line the client will run. Point it at the server file and, for anything other than orderflow, at a prebuilt graph with <code>--graph</code>. Absolute paths — the client does not inherit your shell's working directory."],"youDo":"<code>claude mcp add orderflow-graph -- python /absolute/path/to/labs/M09-mcp-graph-server/solution/server.py</code>. For a scripted run, write the same thing as a config file instead and pass <code>--mcp-config mcp.json</code>.","source":"labs/CAPSTONE-2-java-token-benchmark/live_bench/mcp-config.template.json","terminal":[{"kind":"prompt","text":"claude mcp add orderflow-graph -- python D:/work/.../labs/M09-mcp-graph-server/solution/server.py"},{"kind":"out-pass","text":"Added stdio MCP server orderflow-graph to local config"},{"kind":"prompt","text":"claude mcp list"},{"kind":"out","text":"orderflow-graph   stdio   python .../solution/server.py   ✓ connected"}],"state":{"label":"mcp.json · the file form of that command","before":{"title":"WHAT THE CLIENT STORES","view":{"type":"json","data":{"server":"orderflow-graph","transport":"stdio","command":"python","args":".../solution/server.py --graph .../graph.json"},"highlight":["transport"]}},"after":{"title":"WHAT IT DOESN'T STORE","view":{"type":"note","text":"No URL, no port, no credential. The whole server is a subprocess reading JSON from stdin — the lab's is about 120 lines of Python. And because it speaks plain MCP, the same binary serves Claude Code, opencode, or any other MCP client without a per-agent integration."}}}},{"title":"Smoke-test it before you trust it","narrative":["Do this before the first real session, every time. Run the server standalone and confirm it loads the graph and answers.","The reason is the ugliest bug in this course. Capstone 2's first two benchmark campaigns measured a \"graph arm\" whose MCP server was crashing at startup on an SDK import rename. Nothing errored in the transcripts. The agent simply saw no tools, fell back to Read and Grep, and produced entirely plausible numbers for a configuration that never existed.","A component that fails silently under a client that degrades gracefully produces confident, wrong measurements. Six seconds of smoke test buys you the right to believe your own results."],"youDo":"<code>python labs/M09-mcp-graph-server/solution/server.py --selftest</code> — it must print <code>SELFTEST PASSED</code>. Serving a foreign graph, run it plain and look for the <code>serving over stdio</code> line with a non-zero node count.","source":"labs/M09-mcp-graph-server/solution/server.py#selftest, labs/CAPSTONE-2-java-token-benchmark/live_bench/SCENARIOS.md#scenario-4, labs/CAPSTONE-2-java-token-benchmark/README.md#spring-graph-shape","terminal":[{"kind":"prompt","text":"python labs/M09-mcp-graph-server/solution/server.py --selftest"},{"kind":"out","text":"{\n  \"symbol\": \"decode_jwt\",\n  \"callers\": [\"shared.auth.verify_token\"]\n}"},{"kind":"out","text":"{\n  \"error\": \"symbol 'not_a_symbol' not in graph — it may be external; try grep\"\n}"},{"kind":"out-pass","text":"SELFTEST PASSED"},{"kind":"prompt","text":"python .../server.py --graph D:/tmp/spring-graph.json"},{"kind":"out-pass","text":"graph:spring-graph: serving over stdio (110885 nodes, 432741 edges)"}],"state":{"label":"selftest · 4 assertions","before":{"title":"GREEN","view":{"type":"tests","run":4,"failures":0,"big":"SELFTEST PASSED","note":"graph_callers resolves · graph_callees resolves · explore composes · an unknown symbol returns the graceful-miss dict instead of raising"}},"after":{"title":"WHAT A SILENT FAILURE LOOKS LIKE","view":{"type":"rows","columns":["symptom","with file tools available","with the graph forced"],"rows":[{"cells":["server crashes at startup","invisible — agent falls back to grep","session reports \"tools unavailable\""]},{"cells":["your benchmark says","plausible numbers for a fiction","an obvious, loud failure"],"tone":"bad"},{"cells":["what you should run first","a forced smoke session — no fallback to hide behind","—"],"tone":"win"}]}}}},{"title":"initialize, then tools/list","narrative":["The session starts and the client opens the handshake. <code>initialize</code> exchanges capabilities; <code>tools/list</code> asks what this server can do; the server replies with names and JSON input schemas.","Both of those happen <b>once per session</b>, not once per question. What they buy is a permanent addition to the agent's tool menu, sitting next to Read and Bash — three named functions the model can call the same way it calls anything else."],"claudeSays":"The model now has three more callable functions with typed parameters. It has not read a single line of your source code, and the graph itself has not entered the context window — only the tool names and their schemas.","source":"labs/M09-mcp-graph-server/solution/server.py#serve","terminal":[{"kind":"out","text":"→ initialize  {\"protocolVersion\":\"2025-06-18\",\"clientInfo\":{\"name\":\"claude-code\"}}"},{"kind":"out","text":"← capabilities {\"tools\":{}}  serverInfo {\"name\":\"orderflow-graph\"}"},{"kind":"out","text":"→ tools/list  {}"},{"kind":"out-pass","text":"← graph_callers, graph_callees, explore   (each: {symbol: string})"},{"kind":"out","text":"orderflow-graph: serving over stdio (36 nodes, 22 edges)"}],"state":{"label":"the announced tool surface","before":{"title":"THREE TOOLS, SHAPED AROUND THE QUESTION","view":{"type":"rows","columns":["tool","the question it answers","payload"],"rows":[{"cells":["<code>graph_callers(symbol)</code>","\"Who calls <code>verify_token</code>?\"","one line of caller names"]},{"cells":["<code>graph_callees(symbol)</code>","\"What does <code>handle_payment_webhook</code> call?\"","one line of callee names"]},{"cells":["<code>explore(symbol)</code>","\"What is this and how dangerous is it to touch?\"","composite: location, both directions, blast radius"],"tone":"win"}]}},"after":{"title":"WHY THE THIRD ONE EXISTS","view":{"type":"note","text":"Give an agent only single-purpose lookups and it makes four round trips to investigate one symbol — four tool-call overheads, four chances to lose the thread. <code>explore</code> collapses that chain into one call. The principle generalises: <b>shape tools around the agent's investigation pattern, not around your data model.</b> Your indexes are separate; the agent's question is not."}}}},{"title":"tools/call graph_callers(\"decode_jwt\")","narrative":["Now the round trip that repeats. The model decides on its own that this is a caller question, picks the tool, and fills in the parameter.","The response is the whole point of the architecture. <code>graph.json</code> stays on the server; the client never sees it. What crosses the wire is an <em>answer</em> — a symbol and its callers — and that is all that enters the context window."],"youDo":"Ask a caller question in a session where the server is registered, then check the result against <code>labs/sample-project/README.md</code>'s ground-truth list. <code>graph_callers(\"decode_jwt\")</code> must return exactly <code>[\"shared.auth.verify_token\"]</code>; an empty list means your reverse index is keyed by source instead of target.","claudeSays":"It reasons over the returned names, not over <code>shared/auth.py</code>. The file is never opened, so its imports, its docstrings and its HMAC plumbing cost nothing.","source":"labs/M09-mcp-graph-server/solution/server.py#graph_callers","terminal":[{"kind":"prompt","text":"who calls decode_jwt, and is anything else reaching it?"},{"kind":"tool","text":"graph_callers(symbol=\"decode_jwt\")"},{"kind":"out-pass","text":"{\n  \"symbol\": \"decode_jwt\",\n  \"callers\": [\"shared.auth.verify_token\"]\n}"},{"kind":"claude","text":"Exactly one caller: shared.auth.verify_token, in the same file.\nNothing reaches decode_jwt directly — every service goes through\nverify_token, so that is the only place to change the contract."}],"state":{"label":"what crossed the wire","before":{"title":"BEFORE — the pre-MCP route","view":{"type":"rows","columns":["action","enters context as"],"rows":[{"cells":["<code>grep -rn decode_jwt</code>","a hit list that mixes calls with mentions"]},{"cells":["Read <code>shared/auth.py</code>","the entire file — signing key, HMAC, base64 padding"],"tone":"bad"},{"cells":["Read each other candidate","each one whole, whether or not it was a real call site"],"tone":"bad"}]}},"after":{"title":"AFTER — the tool result","view":{"type":"json","data":{"symbol":"decode_jwt","callers":"shared.auth.verify_token"},"highlight":["callers"]}}}},{"title":"explore: the whole structural picture in one call","narrative":["When the agent's real question is \"how dangerous is it to touch this?\", the composite tool answers it in a single round trip. Callers, callees, the file and line, and a transitive blast radius computed by breadth-first search over the reverse index.","Two fields deserve your attention. <code>blast_radius</code> counts every symbol that transitively depends on this one — the honest scope of a change. <code>ambiguous</code> is the tool admitting its own uncertainty: it is true when the bare name resolved to more than one node, which is exactly when you should not trust the caller list as complete."],"claudeSays":"One call instead of four. The model gets location, both edge directions, and the risk number together, so it can answer without a follow-up query it would otherwise have to plan.","source":"labs/M09-mcp-graph-server/solution/server.py#explore","terminal":[{"kind":"prompt","text":"if I change verify_token's signature, what breaks?"},{"kind":"tool","text":"explore(symbol=\"verify_token\")"},{"kind":"out-pass","text":"{\n  \"symbol\": \"verify_token\",\n  \"kind\": \"function\",\n  \"location\": \"shared/auth.py:41\",\n  \"callers\": [\"services.billing.app.post_invoice\"],\n  \"callees\": [\"shared.auth.AuthError\", \"shared.auth.decode_jwt\"],\n  \"blast_radius\": 1,\n  \"ambiguous\": false\n}"},{"kind":"claude","text":"Blast radius 1: only billing's post_invoice calls it, and the name is\nunambiguous so that list is complete rather than a sample. Downstream\nyou'd keep decode_jwt and AuthError intact. This is a safe change."}],"state":{"label":"explore(\"verify_token\") · real server output","before":{"title":"FOUR CALLS, THE OLD WAY","view":{"type":"rows","columns":["round trip","what it returns"],"rows":[{"cells":["<code>graph_callers</code>","the caller list"]},{"cells":["<code>graph_callees</code>","the callee list"]},{"cells":["a Read to find the definition","the file, whole"],"tone":"bad"},{"cells":["a BFS the agent has to plan itself","the blast radius, maybe"],"tone":"bad"}]}},"after":{"title":"ONE CALL","view":{"type":"json","data":{"symbol":"verify_token","kind":"function","location":"shared/auth.py:41","callers":"services.billing.app.post_invoice","callees":"shared.auth.AuthError, shared.auth.decode_jwt","blast_radius":1},"highlight":["blast_radius"]}}}},{"title":"What it costs — and the two traps","narrative":["The arithmetic is genuinely good on one question. A caller answer is a line of names; the file read it replaces is thousands of tokens. In okf-rs's own codebase, answering \"who calls <code>cmd_generate</code>?\" by reading the 672-line file costs roughly 6,000 tokens against about 15 for the tool call. That is arithmetic, not a session measurement.","The session measurement is less flattering, and it splits on <em>how</em> you integrate. Capstone 2 asked \"who calls <code>registerBeanDefinition</code>?\" through real agent sessions on spring-framework. With the graph merely <b>available</b> next to file tools, the model queried it, distrusted the thousand-name fan-out, re-verified against files, and paid for both paths. With the graph <b>forced</b> as the only tool, it answered in one turn.","The second trap is in the server you just read. <code>load_graph</code> runs once, at startup. Regenerate <code>graph.json</code> mid-session and this process keeps serving the old one until it restarts — a stale answer that looks exactly like a fresh one. M11 is about that."],"source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-multi.json#S1","state":{"label":"measured · spring-framework · \"who calls registerBeanDefinition\" · medians of 3 fresh sessions","before":{"title":"SAME SERVER, SAME QUESTION, THREE INTEGRATIONS","view":{"type":"rows","columns":["arm","turns","tokens","vs baseline"],"rows":[{"cells":["baseline — Read/Glob/Grep, no graph","3","116,033","the control"]},{"cells":["graph available alongside files","4","154,266","+33% — paid for both paths"],"tone":"bad"},{"cells":["graph forced, no file access","1","41,822","−64%"],"tone":"win"}]}},"after":{"title":"THE RULE THAT FALLS OUT","view":{"type":"note","text":"Serving a graph is not the same as saving tokens. It saves tokens when the question is structural, the repo is large, and the agent has no cheaper path to double-check on. Offering the graph as an option was the <b>worst</b> configuration in the campaign. And whatever you measure, smoke-test the server first — otherwise you may be measuring a subprocess that died at startup."}}}}]},{"id":"kg-hybrid-stack","badge":"WALKTHROUGH","color":"#06B6D4","time":"~5 min","title":"One question, three layers","spec":"M10 · which layer owns which question class","intro":"Send the same question to all three layers of the stack. Two of them fail, in two completely different ways — and then the question flips and the winner loses. The routing rule falls out of both results.","provenance":{"kind":"illustrative","source":"a narrated session over labs/sample-project; the concept file, the graph server behaviour and the deliberately stale doc are real lab artifacts, cited per step"},"foot":"Do it for real: M10's Hands-On routes ten orderflow queries, then the router skeleton in <code>router.py</code> automates the same calls.","steps":[{"title":"One question, three places to send it","narrative":["orderflow has all three layers wired: a <b>vector index</b> over docs, tickets and Slack; a <b>structural graph</b> extracted from the AST; and an <b>OKF bundle</b> of curated concept files. Three retrieval mechanisms, one agent.","The question is the one that already cost this team money — <em>what is the canonical definition of weekly active users?</em> Nothing in its wording tells you which layer owns it. That decision is the whole subject of this module, so before building a router, ask all three and watch what comes back."],"youDo":"Ask each layer the same thing, separately, and keep the three answers side by side: <code>What is the canonical definition of weekly active users?</code>","terminal":[{"kind":"prompt","text":"what is the canonical definition of weekly active users?"},{"kind":"claude","text":"Three retrieval surfaces are registered. I'll query each one\nindependently so we can compare what they return."}],"state":{"label":"the stack, before anyone routes anything","before":{"title":"WHAT EACH LAYER OWNS","view":{"type":"rows","columns":["layer","owns","retrieval","ingest cost"],"rows":[{"cells":["vector RAG","the unstructured long tail","probabilistic — nearest neighbour","embedding + re-indexing"]},{"cells":["structural graph","what the code <b>is</b>","deterministic — edge traversal","zero-LLM AST parse"]},{"cells":["OKF bundle","what engineers <b>know</b>","deterministic — exact file","curation labour (M08's pipeline)"]}]}}}},{"title":"Vector RAG: the confidently wrong answer","narrative":["The vector index does exactly what it was built to do — it returns the <em>most similar</em> passage. That passage is a paragraph in <code>docs/architecture.md</code> that is dense with the right keywords and carries a definition the team retired months ago: <em>\"unique users with any API call in 7 days\"</em>, no tester exclusion.","Look at what the retrieval response does <b>not</b> contain: any signal that this text is superseded. Similarity is not canonicity, and no amount of prompt engineering converts one into the other. This is the M02 failure mode reproduced on purpose — the sample repo ships that paragraph so you can watch it happen."],"claudeSays":"The layer returned its top-ranked chunk with a similarity score. The score says the text is close to the question. It says nothing at all about whether the text is true today.","source":"labs/sample-project/docs/architecture.md","terminal":[{"kind":"tool","text":"vector_search(\"canonical definition weekly active users\")"},{"kind":"out","text":"top hit  docs/architecture.md  (score 0.89)\n\"...WAU as unique users with any API call in 7 days...\""},{"kind":"claude","text":"WAU is the count of unique users making any API call within a\nrolling 7-day window."},{"kind":"gate","text":"⏸  checked against services/orders/metrics.py"},{"kind":"out-fail","text":"✕ WRONG — canonical rule is completed orders, and testers are excluded"}],"state":{"label":"similarity vs canonicity","before":{"title":"WHAT CAME BACK vs WHAT IS TRUE","view":{"type":"rows","columns":["rule","retrieved answer","canonical (metrics.py)"],"rows":[{"cells":["window","7 days","7 days"],"tone":"win"},{"cells":["activity signal","any API call","<b>≥ 1 completed order</b>"],"tone":"bad"},{"cells":["internal testers","not mentioned","<b>excluded by name</b>"],"tone":"bad"}]}}}},{"title":"The structural graph: an address, never a meaning","narrative":["Send the same question to the graph server and it answers honestly, which is not the same as usefully. <code>explore(\"weekly_active_users\")</code> returns a node kind and a file and line — a precise <b>address</b> — and, for this particular symbol, an empty caller list and an empty callee list. It cannot return the tester-exclusion rule, because that rule is not an edge.","This is the layer's defining limit, and it is a feature: the graph never guesses at intent. Ask it about a symbol it has never seen and it says so — <code>not in graph — it may be external; try grep</code> — instead of returning the nearest plausible thing. A layer that fails loudly is a layer a router can safely fall back from."],"source":"labs/M09-mcp-graph-server/solution/server.py#explore","terminal":[{"kind":"tool","text":"explore(symbol=\"weekly_active_users\")"},{"kind":"out","text":"kind: function · location: services/orders/metrics.py:16\ncallers: [] · callees: [] · blast_radius: 0"},{"kind":"claude","text":"The graph tells me where the computation lives, not what rule it\nencodes. To answer I'd still have to open and read metrics.py."}],"state":{"label":"what an edge can and cannot carry","before":{"title":"THE GRAPH'S ANSWER","view":{"type":"json","data":{"symbol":"weekly_active_users","kind":"function","location":"services/orders/metrics.py:16","callers":[],"callees":[],"blast_radius":0,"why_excludes_testers":"not representable as an edge"},"highlight":["why_excludes_testers"]}}}},{"title":"OKF: the exact file, in one read","narrative":["The bundle has no ranking step and no search. <code>knowledge/analytics/metrics/weekly_active_users.md</code> either exists or it does not, and when it exists you get all of it: the 7-day window, the completed-order requirement, the three named tester accounts, and a <code>resource:</code> pointer at the code that <em>is</em> the definition.","That last line is the piece the other two layers structurally cannot produce. The concept is an <b>attested computation</b> — it does not merely describe WAU, it names <code>services/orders/metrics.py::weekly_active_users</code> as the source of truth, so a reader can check the prose against the code instead of trusting it."],"source":"labs/M06-okf-authoring/solution/knowledge/analytics/metrics/weekly_active_users.md","terminal":[{"kind":"tool","text":"read_concept(\"analytics/metrics/weekly_active_users\")"},{"kind":"out-pass","text":"type: metric · resource: services/orders/metrics.py"},{"kind":"claude","text":"WAU = unique customer_id values with at least one COMPLETED order\ncompleted inside a rolling 7-day window, excluding cust_qa_1,\ncust_qa_2 and cust_loadtest. Source of truth: metrics.py."}],"state":{"label":"same question, two layers","before":{"title":"BEFORE — routed to vector search","view":{"type":"note","text":"\"Unique users making any API call within a rolling 7-day window.\" Retrieved with a 0.89 similarity score from a paragraph the team retired. <b>Wrong, with no signal that it is wrong.</b>"}},"after":{"title":"AFTER — routed to the bundle","view":{"type":"stack","views":[{"type":"note","text":"\"Unique customers with ≥1 completed order in a rolling 7-day window, excluding internal test accounts.\" One file read, no ranking, no score."},{"type":"rows","columns":["required fact","present?"],"rows":[{"cells":["7-day rolling window","yes"],"tone":"win"},{"cells":["completed orders, not API calls","yes"],"tone":"win"},{"cells":["tester exclusion, named accounts","yes"],"tone":"win"},{"cells":["pointer to the attested computation","yes"],"tone":"win"}]}]}}}},{"title":"Flip the question and the winner loses","narrative":["Now ask <em>who calls <code>verify_token</code>, directly and transitively?</em> and the ranking inverts completely. The bundle has no concept for it — and if you wrote one, its caller list would be stale by the next merge, which is exactly the hand-maintained map this course exists to stop writing. Vector search returns prose that mentions authentication and answers nothing.","The graph answers in one call, deterministically, with provenance on every edge: <code>verify_token → decode_jwt</code>, EXTRACTED, same file. Two questions, two winners, two different losers. That is what \"complementary, not competing\" actually looks like in a terminal."],"youDo":"Run both questions against all three layers yourself in the M10 Hands-On, and note which failures are loud and which are silent.","source":"labs/sample-project/README.md","terminal":[{"kind":"prompt","text":"who calls verify_token, directly and transitively?"},{"kind":"tool","text":"read_concept(\"security/verify-token\") → no such concept"},{"kind":"tool","text":"vector_search(\"who calls verify_token\") → 4 doc chunks about auth, 0 callers"},{"kind":"tool","text":"graph_callers(symbol=\"verify_token\")"},{"kind":"out-pass","text":"callers: [\"services.billing.app.post_invoice\"] · verify_token → decode_jwt (EXTRACTED)"}],"state":{"label":"two question classes, opposite verdicts","before":{"title":"WHO WINS WHAT","view":{"type":"rows","columns":["question","class","right layer","wrong layer fails how"],"rows":[{"cells":["canonical WAU definition","canonical","<b>OKF bundle</b>","RAG: confidently wrong, no signal"],"tone":"win"},{"cells":["who calls <code>verify_token</code>","structural","<b>graph</b>","OKF: no concept; RAG: prose, no edges"],"tone":"win"},{"cells":["themes in last quarter's tickets","exploratory","<b>vector RAG</b>","graph: not in graph; OKF: nobody curated it"],"tone":"win"}]}}}},{"title":"The routing rule","narrative":["Three questions is enough to write the rule down: <b>structure → graph, canon → bundle, everything undocumented → search.</b> A router is forty lines of dispatch over layers you already built, and its only job is to keep each question inside the jurisdiction where it can be answered deterministically.","One asymmetry matters more than the classification: every fallback degrades <em>toward</em> vector search and <b>never</b> toward OKF. Search is honestly probabilistic and always available; a fuzzy answer wearing the bundle's authority is precisely the failure step 2 just showed you.","The sibling course measured the same shape on a different domain. Across ten standing questions, median input tokens ran naive <b>1,696</b> · graph <b>443</b> · okf <b>186</b> · notes <b>197</b> — with every arm correct <em>except</em> naive, which failed an abstention question, and compressed, which failed an aggregation question. Cheapest and correct were not the same column, and neither was any single arm."],"claudeSays":"Classify, dispatch, log the decision. When a layer returns a graceful miss, catch it and fall through — do not retry the same layer with a reworded question.","state":{"label":"the router, and what justifies it","before":{"title":"THE DISPATCH TABLE","view":{"type":"rows","columns":["cue in the question","route to","on a miss"],"rows":[{"cells":["who calls · depends on · blast radius · cycle","graph server (M09)","degrade to vector search"]},{"cells":["canonical · definition of · SLA · runbook","OKF concept file (M06)","say so — never guess"]},{"cells":["anything else","vector search","it <em>is</em> the fallback"]}]}},"after":{"title":"WHY BOTHER — the accuracy case, not the token case","view":{"type":"bars","unit":"% key-fact coverage","max":100,"items":[{"label":"baseline agent","value":70.8,"tone":"bad","note":"vector RAG + grep exploration, ERPNext (1M+ LOC)"},{"label":"graph + OKF hybrid","value":82.0,"tone":"win","note":"+11.2 points · ~140K tokens per query session"}]}}}}]},{"id":"kg-freshness-gate","badge":"WALKTHROUGH","color":"#EF4444","time":"~5 min","title":"The map that lied","spec":"M11 · one commit, no rebuild, and the gate that caught it","intro":"The code moved. The graph did not. The agent answered anyway — instantly, authoritatively, and wrong. Watch the failure happen with every light green, then watch sixty lines of CI refuse to let it through.","provenance":{"kind":"illustrative","source":"a narrated session over labs/sample-project; every command, message and exit code is copied from labs/M11-freshness-gate/solution/freshness_gate.py, cited per step"},"foot":"Run it for real: <code>labs/M11-freshness-gate/</code> — Step 2 is the one most \"production\" setups have never actually executed.","steps":[{"title":"A commit that changed the graph's shape — and did not rebuild it","narrative":["A developer adds a second caller for <code>decode_jwt</code>: the notifications worker now verifies its own webhook signatures instead of trusting the bus. Two lines. They commit and move on.","The post-commit hook does not fire. Pick your reason — the Windows shell has no <code>nohup</code>, the extension allowlist drifted, the resource gate skipped under load, or somebody typed <code>--no-verify</code>. It does not matter which, because <b>all four produce the same symptom and none of them print anything.</b> The commit succeeds. <code>graph.json</code> keeps the mtime it had this morning."],"youDo":"Reproduce the state without waiting for a real bug: <code>git commit --allow-empty -qm \"commit without rebuilding the graph\"</code>","terminal":[{"kind":"prompt","text":"git commit -qm \"notifications: verify webhook signatures locally\""},{"kind":"out","text":"(no [enrich] output — the hook never ran)"},{"kind":"prompt","text":"git log -1 --format=%ct  &amp;&amp;  stat -c %Y graphify-out/graph.json"},{"kind":"out-fail","text":"HEAD      1756377720\ngraph.json 1756349104        ← 7h 57m older than the commit"}],"state":{"label":"code vs map","before":{"title":"BEFORE — the commit","view":{"type":"diff","file":"services/notifications/worker.py","lines":[["p","from shared.events import subscribe"],["p",""],["p","def handle_payment_settled(event):"],["p","    invoice_id = event[\"invoice_id\"]"]]}},"after":{"title":"AFTER — the commit, but not the rebuild","view":{"type":"diff","file":"services/notifications/worker.py","lines":[["p","from shared.events import subscribe"],["a","from shared.auth import decode_jwt"],["p",""],["p","def handle_payment_settled(event):"],["a","    claims = decode_jwt(event[\"signature\"])   # new edge, ungraphed"],["p","    invoice_id = event[\"invoice_id\"]"]]}}}},{"title":"The agent answers from the old map, at full confidence","narrative":["Nobody knows the graph is behind, least of all the agent. Someone asks the standard pre-refactor question — <em>who calls <code>decode_jwt</code>?</em> — and the MCP server answers in one round trip, from the copy it holds.","Read the response closely: it is well-formed, deterministic, provenance-tagged, and <b>missing the caller added eight hours ago</b>. Nothing in its shape reveals its age. The agent concludes the blast radius is one module and proposes changing the signature.","This is why the module insists a stale graph is worse than no graph. With no graph the agent reads files — slow, expensive, <em>current</em>. With a stale one it gets a fast, confident, wrong answer and has no reason to distrust it."],"claudeSays":"The server did not lie. It served exactly what was on disk, which had stopped describing the repository at 09:25 this morning.","source":"labs/M09-mcp-graph-server/solution/server.py#graph_callers","terminal":[{"kind":"prompt","text":"who calls decode_jwt? safe to change its signature?"},{"kind":"tool","text":"graph_callers(symbol=\"decode_jwt\")"},{"kind":"out","text":"{\"callers\": [\"shared.auth.verify_token\"]}"},{"kind":"claude","text":"One caller, inside the same module. Blast radius is contained —\nchanging the signature is safe with a single call-site update."},{"kind":"out-fail","text":"✕ the real answer is TWO callers · services.notifications.worker breaks on deploy"}],"state":{"label":"graph_callers(\"decode_jwt\")","before":{"title":"WHAT THE AGENT SAW","view":{"type":"json","data":{"symbol":"decode_jwt","callers":["shared.auth.verify_token"],"provenance":"EXTRACTED","graph_built":"09:25","head_commit":"17:22"},"highlight":["graph_built","head_commit"]}},"after":{"title":"WHAT WAS TRUE","view":{"type":"json","data":{"symbol":"decode_jwt","callers":["shared.auth.verify_token","services.notifications.worker"],"provenance":"EXTRACTED","graph_built":"—","head_commit":"17:22"},"highlight":["callers"]}}}},{"title":"Why nothing warned you: four doors, all green","narrative":["The instinct is to go fix the hook. The module's point is that fixing this hook does not fix the class of problem, because a rebuild pipeline has <b>four independently documented ways to stop working while reporting success</b>, and new ones ship regularly.","The fourth is the nastiest and the least intuitive: a rebuild can succeed <em>completely</em> and the agent still gets the old answer, because the MCP server loaded <code>graph.json</code> at startup and has no hot-reload. Fresh graph on disk, stale graph in memory, simultaneously — and no artifact anywhere records that the two have diverged.","So the defence cannot be \"fix these four bugs\". It has to be refusing to <b>trust</b> a freshness you have not <b>measured</b>."],"state":{"label":"four silent failure mechanisms","before":{"title":"EACH ONE EXITS CLEAN","view":{"type":"rows","columns":["mechanism","what actually happens","what you see"],"rows":[{"cells":["missing <code>nohup</code>","Git-for-Windows has no <code>nohup</code>; the detached rebuild never starts","nothing"],"tone":"bad"},{"cells":["<code>CODE_EXTS</code> allowlist drift","hook's extension list diverged from <code>graphify/detect.py</code>; valid commits skip the rebuild","nothing"],"tone":"bad"},{"cells":["resource gate","CPU &gt; 50% → skip, retry \"on the next commit\" — which may be days away","nothing"],"tone":"bad"},{"cells":["MCP startup cache","rebuild succeeds; the running server keeps its startup copy until bounced","nothing"],"tone":"bad"}]}},"after":{"title":"THE COMMON SYMPTOM — which is the opening","view":{"type":"note","text":"However the rebuild died, the artifact ends up <b>older than HEAD</b>. Four causes, one observable. That is what makes a single timestamp comparison a complete detector rather than a partial one."}}}},{"title":"The gate: one clock against another","narrative":["<code>freshness_gate.py</code> compares <code>graph.json</code>'s mtime against <code>git log -1 --format=%ct</code>. Fresh means the artifact was generated at or after the last commit. Note it compares against <b>commit time, not wall-clock age</b> — a repo untouched for a month with a month-old graph is perfectly fresh.","Run it on a healthy repo and it says so and exits 0. Then make it stale on purpose — an empty commit is enough — and the same command turns into a stop sign: the lag in commits, an actionable fix, and <b>exit 1</b>.","Read the fix line all the way to the end. It does not stop at \"rerun the extractor\"; it names the MCP restart, because door 4 is not fixed by regeneration alone."],"youDo":"<code>cd labs/sample-project</code> then <code>python ../M11-freshness-gate/solution/freshness_gate.py . --max-age-commits 0</code>","source":"labs/M11-freshness-gate/solution/freshness_gate.py","terminal":[{"kind":"prompt","text":"python ../M11-freshness-gate/solution/freshness_gate.py . --max-age-commits 0"},{"kind":"out-pass","text":"FRESH: graph.json generated at/after HEAD commit"},{"kind":"prompt","text":"git commit --allow-empty -qm \"commit without rebuilding the graph\""},{"kind":"prompt","text":"python ../M11-freshness-gate/solution/freshness_gate.py . --max-age-commits 0"},{"kind":"gate","text":"⏸  FRESHNESS GATE — artifact clock vs git clock"},{"kind":"out-fail","text":"STALE: graph.json predates HEAD by 1 commit(s)\n  fix: python labs/shared_tools/kg_extract.py <repo> --out graphify-out/graph.json  (then restart any MCP server holding the old graph)"},{"kind":"out-fail","text":"$? = 1   → pipeline blocked"}],"state":{"label":"the comparison, both ways","before":{"title":"PASS — exit 0, agents may trust the graph","view":{"type":"rows","columns":["input","value","verdict"],"rows":[{"cells":["<code>git log -1 --format=%ct</code>","HEAD at 14:02",""]},{"cells":["<code>graph.json</code> mtime","14:03",""]},{"cells":["mtime ≥ HEAD time","true","<b>FRESH</b>"],"tone":"win"}]}},"after":{"title":"FAIL — exit 1, pipeline blocked","view":{"type":"rows","columns":["input","value","verdict"],"rows":[{"cells":["<code>git log -1 --format=%ct</code>","HEAD at 17:22",""]},{"cells":["<code>graph.json</code> mtime","09:25",""]},{"cells":["<code>git rev-list --count --since=&lt;mtime&gt;</code>","1 commit",""]},{"cells":["lag &gt; <code>--max-age-commits=0</code>","true","<b>STALE</b>"],"tone":"bad"}]}}}},{"title":"--cross-check: when the clock is fresh and the content is not","narrative":["A timestamp can be current while the contents are wrong — a partial rebuild, a refused overwrite, a report and a graph telling different stories. Clocks cannot see that; counts can.","<code>--cross-check</code> re-extracts into a throwaway file and compares node and edge counts against the stored graph. Agreement prints <code>CROSS-CHECK OK</code>; disagreement prints <code>DESYNC</code> with both pairs and exits 1. The <code>finally</code> block deletes the temporary file, and that matters more than it sounds: a leftover <code>.freshcheck.json</code> becomes tomorrow's confusing fourth artifact.","Below, the sabotage is a <code>fraud_check()</code> call added to <code>webhooks.py</code> and committed with the graph touched but not regenerated — clock says fine, counts say otherwise."],"youDo":"Re-run the gate with <code>--cross-check</code> after any commit that adds a function.","source":"labs/M11-freshness-gate/solution/freshness_gate.py","terminal":[{"kind":"prompt","text":"python ../M11-freshness-gate/solution/freshness_gate.py . --max-age-commits 0 --cross-check"},{"kind":"out-pass","text":"FRESH: graph.json generated at/after HEAD commit"},{"kind":"tool","text":"re-extracting into graphify-out/graph.freshcheck.json …"},{"kind":"out-fail","text":"DESYNC: stored graph has 36n/22e, fresh extraction has 37n/23e"},{"kind":"out","text":"graph.freshcheck.json removed (finally: never leave a 4th artifact)"}],"state":{"label":"two checks, two failure classes","before":{"title":"WHAT EACH CHECK CATCHES","view":{"type":"rows","columns":["check","compares","catches","misses"],"rows":[{"cells":["timestamp","mtime vs <code>git log -1</code>","all four silent hook deaths","a rebuild that ran but wrote partial output"]},{"cells":["<code>--cross-check</code>","stored counts vs a fresh extraction","artifact desync, refused overwrites","an artifact that is wrong <em>and</em> consistently wrong"]}]}}}},{"title":"Where it runs, and what it deliberately will not do","narrative":["Placement is the whole point: the gate goes <b>before</b> any agent-consuming step. A freshness check that runs after an agent has already acted on a stale map is a postmortem, not a gate. And it must block — warning-only freshness checks are ignored by their second week.","Notice what these sixty lines do not do: they never repair anything. They refuse to proceed and name the fix. Keeping detection and repair separate means a broken repair path can never silence detection.","Stay honest in both directions. Above the ~500-file floor the gate is cheap insurance against a rebuild cost that is genuinely brutal — betweenness centrality is O(V×E), and one 450K-node / 690K-edge monorepo was killed on a 96-core Xeon after <b>114 minutes</b> without finishing. Below the floor, the whole pipeline is ceremony and the gate is guarding nothing. Measure which side you are on before you adopt any of it.","The module's exit exam is a single sentence you should now be able to answer mechanically: <em>how would you detect a stale graph within 24 hours?</em> \"CI runs the gate on every push and blocks on lag &gt; 0\" passes. \"The hooks handle it\" does not."],"youDo":"Add the gate as the first step of your pipeline, ahead of every job that reads the graph.","terminal":[{"kind":"tool","text":"ci.yml"},{"kind":"out","text":"- name: Graph freshness gate\n  run: python ci/freshness_gate.py . --max-age-commits 0 --cross-check\n- name: OKF bundle lint\n  run: python ci/validate.py knowledge\n- name: Agent-consuming jobs\n  run: ...        # only reachable if both gates passed"}],"state":{"label":"belief vs measurement","before":{"title":"ANSWERS TO THE 24-HOUR QUESTION","view":{"type":"rows","columns":["answer","verdict"],"rows":[{"cells":["\"CI runs the freshness gate on every push and blocks on lag &gt; 0\"","passes — mechanical"],"tone":"win"},{"cells":["\"A nightly job compares artifact timestamps to HEAD and pages past 6 hours\"","passes — mechanical"],"tone":"win"},{"cells":["\"The MCP server exposes a status tool; the orchestrator refuses older graphs\"","passes — mechanical"],"tone":"win"},{"cells":["\"We installed the hooks, so we're covered\"","fails — a belief"],"tone":"bad"},{"cells":["\"We'd notice\" / \"it hasn't happened yet\"","fails — a demo that hasn't failed yet"],"tone":"bad"}]}}}}]},{"id":"kg-layered-claude-md","badge":"WALKTHROUGH","color":"#6366F1","time":"~5 min","title":"Where do I even start?","spec":"M12 · the layered CLAUDE.md, and what it actually cost","intro":"Split the root instruction file into a root file plus per-module files, watch what the agent does differently — then read our own measurement of the pattern, which is a +2% wash on a 9,195-file repo and a −10% win on a 36-file one. The pattern is real. The free lunch is not.","provenance":{"kind":"illustrative","source":"the orderflow setup is narrated over labs/sample-project; steps 4 and 5 carry the course's own measured grids, cited per step"},"foot":"Run it for real: M12's Hands-On builds the pair on <code>labs/sample-project/</code>; the measurement lives in <code>labs/CAPSTONE-2-java-token-benchmark/live_bench/</code>.","steps":[{"title":"One file, 340 lines, loaded every session","narrative":["orderflow's instructions started the way most repos' do: one root <code>CLAUDE.md</code> that grew every time somebody got burned. Commit format, FastAPI conventions, the event-bus rule, the deploy checklist, the metric definitions, a paragraph about the old Terraform layout nobody has touched since March.","That file is loaded at session start whether the task needs it or not — about <b>1,200 tokens</b> before the agent has read a single line of code. And the cost is not only the budget: instructions compete for attention, so 340 lines of everything means nothing stands out. The agent obeys the parts it happens to weight."],"youDo":"Count your own: <code>wc -l CLAUDE.md</code>. If you scroll past irrelevant sections when you edit it, the agent is reading those sections in full, every session.","terminal":[{"kind":"prompt","text":"wc -l CLAUDE.md"},{"kind":"out","text":"340 CLAUDE.md"},{"kind":"prompt","text":"sessions are timing out early — find and fix it in the billing auth path"},{"kind":"claude","text":"Loading repository instructions… I'll start by orienting in the\nrepo, then locate the session-timeout logic."},{"kind":"out-fail","text":"340 lines of instructions loaded · none of them mention the billing service's error mapping"}],"state":{"label":"startup load, before any work","before":{"title":"WHAT'S IN THE ROOT FILE","view":{"type":"rows","columns":["section","lines","relevant to a billing auth bug?"],"rows":[{"cells":["repo layout + commit conventions","40","yes"],"tone":"win"},{"cells":["billing service specifics","50","yes"],"tone":"win"},{"cells":["orders + notifications specifics","95","no"],"tone":"bad"},{"cells":["deploy checklist","60","no — and it's a procedure, not a fact"],"tone":"bad"},{"cells":["metric definitions","45","no — the bundle owns these"],"tone":"bad"},{"cells":["legacy Terraform notes","50","no"],"tone":"bad"}]}}}},{"title":"Split it along the lookup path","narrative":["The mechanism the pattern rides on is simple and worth stating exactly: the agent loads <code>CLAUDE.md</code> files <b>from your current working directory up to the repository root</b>. Start it inside <code>services/billing/</code> and it loads that file plus every parent's — and <em>nothing</em> from sibling directories.","So the split writes itself. Repo-wide facts stay at the root and stay short: what the services are, where shared code lives, how commits are named, which directories are generated. Everything a single service owns moves into that service's own file, where it costs zero tokens in every session that works elsewhere."],"youDo":"Create <code>labs/sample-project/CLAUDE.md</code> (repo-wide facts only) and <code>labs/sample-project/services/billing/CLAUDE.md</code> (stack specifics). Check: the root file under 25 lines, the billing file mentioning nothing about orders or notifications.","terminal":[{"kind":"tool","text":"Write  labs/sample-project/CLAUDE.md"},{"kind":"out","text":"# Repository Structure\nThree services under services/: billing, orders, notifications.\nShared code in shared/ (auth, db pool, event bus). Tests: `pytest`.\n\n# Commit Conventions\n- Prefix commits with the service name: \"billing: fix webhook idempotency\"\n- knowledge/ is refreshed by the post-commit hook — never hand-edit\n  generated Dependencies sections"},{"kind":"tool","text":"Write  labs/sample-project/services/billing/CLAUDE.md"},{"kind":"out","text":"# Billing Service\nFastAPI app in app.py. Domain logic in invoice.py, webhooks in webhooks.py.\n## Code Patterns\n- Every route verifies auth via shared.auth.verify_token — never inline JWT\n- State changes publish via shared.events.publish; consumers stay isolated\n- Raise WebhookError for bad payloads; app.py maps it to HTTP 400"}],"state":{"label":"one binder → two station guides","before":{"title":"BEFORE — everything at the root","view":{"type":"note","text":"<code>CLAUDE.md</code> · 340 lines · loaded in full from every directory, for every task. The billing rule and the Terraform note carry identical weight."}},"after":{"title":"AFTER — split along the load path","view":{"type":"rows","columns":["file","lines","loaded when"],"rows":[{"cells":["<code>CLAUDE.md</code> (root)","~20","always — it is on every path"],"tone":"win"},{"cells":["<code>services/billing/CLAUDE.md</code>","~12","only from inside <code>services/billing/</code>"],"tone":"win"},{"cells":["<code>.claude/skills/bundle-maintenance/</code>","—","only when the task matches the description"],"tone":"win"},{"cells":["deploy checklist, metric definitions","—","moved out: a skill and the OKF bundle own them"]}]}}}},{"title":"What the agent does differently","narrative":["Start the agent from <code>services/billing/</code> and ask something that spans both files. It answers the commit convention from the root file and the <code>WebhookError → HTTP 400</code> mapping from the service file — <b>without opening a single source file</b>, because both facts were already in context before the question arrived.","The second difference is where it goes when the answer <em>isn't</em> pre-loaded. Told that every route verifies auth via <code>shared.auth.verify_token</code>, it opens that path first instead of fanning out through the repo looking for something auth-shaped. The originating case study for this pattern reports 147 file reads dropping to about 12 on that split alone, and 340 startup lines dropping to roughly 90.","Hold that reported number loosely — it is someone else's before/after, on someone else's repo. The next two steps are ours."],"youDo":"<code>cd labs/sample-project/services/billing</code>, start the agent there, and ask: \"what are this repo's commit conventions and this service's error-handling pattern?\"","claudeSays":"Both answers came from loaded instruction files. No Read, no Grep — the orientation was already paid for at startup, and it was small.","terminal":[{"kind":"prompt","text":"what are this repo's commit conventions and this service's error-handling pattern?"},{"kind":"out","text":"loaded: services/billing/CLAUDE.md → services/../CLAUDE.md  (2 files, ~32 lines)"},{"kind":"claude","text":"Commits are prefixed with the service name (\"billing: …\").\nBilling raises WebhookError for bad payloads; app.py maps it to a\n400. Routes must verify auth through shared.auth.verify_token."},{"kind":"out-pass","text":"0 file reads · both facts already in context"}],"state":{"label":"the reported before/after — not our measurement","before":{"title":"REPORTED BY THE ORIGINATING CASE STUDY","view":{"type":"rows","columns":["","one root file","layered + the other five patterns"],"rows":[{"cells":["startup instruction load","340 lines every session","~90 lines, task-relevant"]},{"cells":["file reads in main context","147","~4"]},{"cells":["attempts","3 failed, then success","1"]},{"cells":["wall clock","35 minutes","6 minutes"]}]}},"after":{"title":"WHAT THAT TABLE IS AND ISN'T","view":{"type":"note","text":"A single reported session, on a repo we cannot inspect, with all six patterns applied at once — so it cannot tell you what the layered files alone are worth. We ran that experiment separately, on two repos, with three fresh sessions per cell. It is less flattering."}}}},{"title":"Measured: 22 CLAUDE.mds on spring-framework","narrative":["The <code>init</code> arm of Capstone 2 is this pattern and nothing else: a generated <code>CLAUDE.md</code> in <b>every</b> <code>spring-*</code> module — 22 files across 9,195 Java files — with the same tools, same questions and same model as the baseline. The only variable is the repo state. Every figure below is a median of three independent fresh sessions.","The headline is a wash: <b>600K vs 585K all-in, +2%</b>. But the average hides the actual finding. On S1 the map sent the agent straight to the right module and won <b>30%</b> in two turns instead of three. On S2 the auto-loaded context never paid for itself and cost <b>+58%</b>. Structural questions overall got <em>worse</em> by 16%; logic questions got 7% better.","And it is not free to create. Generating those 22 files ran ~$0.15 and ~35 seconds per module, about <b>$3.40 once</b> — which amortizes only across sessions that land on the winning pattern."],"source":"labs/CAPSTONE-2-java-token-benchmark/live_bench/SCENARIOS.md, labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-multi.json","terminal":[{"kind":"prompt","text":"python init_claude_mds.py D:/tmp/spring-framework --prefix spring-"},{"kind":"out","text":"wrote 22 CLAUDE.md files · ~35s and ~$0.15 per module · $3.40 total"},{"kind":"prompt","text":"python run_live_bench.py D:/tmp/spring-framework --arms init --reps 3"},{"kind":"out","text":"S1  81,352 tok ·  2 turns        S2  196,892 tok ·  4 turns\nL1 202,820 tok ·  5 turns        L2  118,449 tok ·  4 turns"},{"kind":"gate","text":"⏸  compared against the baseline arm (same tools, clean repo)"},{"kind":"out-fail","text":"structural 278K (+16%) · logic 321K (−7%) · all four 600K (+2%)"},{"kind":"prompt","text":"python init_claude_mds.py D:/tmp/spring-framework --remove"}],"state":{"label":"spring-framework · 9,195 files · medians of 3","before":{"title":"PER QUESTION — the +2% average splits in two","view":{"type":"rows","columns":["question","baseline","init (22 CLAUDE.mds)","delta"],"rows":[{"cells":["S1 · who calls <code>registerBeanDefinition</code>","116,039 · 3t","<b>81,352 · 2t</b>","−30%"],"tone":"win"},{"cells":["S2 · which methods call <code>ResolvableType.forClass</code>","124,583 · 3t","196,892 · 4t","+58%"],"tone":"bad"},{"cells":["L1 · why can <code>BeanDefinitionOverrideException</code> throw","231,012 · 6t","202,820 · 5t","−12%"],"tone":"win"},{"cells":["L2 · post-processor registration during <code>refresh()</code>","113,808 · 3t","118,449 · 4t","+4%"]}]}},"after":{"title":"ROLLED UP — the honest headline","view":{"type":"bars","unit":"tokens (all four questions)","max":620000,"items":[{"label":"baseline","value":585000,"note":"clean repo, zero CLAUDE.md files — the control"},{"label":"init","value":600000,"tone":"bad","note":"+2%, plus ~$3.40 one-time generation"}]}}}},{"title":"36 files, and a single root file is the best arm","narrative":["Run the same four scenarios on a small repo and the verdict flips. On <b>priorauth-api-boot3</b> — 36 Java files, a Spring Boot 3 prior-authorization API — the init arm is a <em>single 55-line root</em> <code>CLAUDE.md</code> (for a single-module app you init the root, not each package), and it is the best arm overall: <b>565K vs 629K, −10%</b>.","The biggest win is on the orientation-heavy logic question — <em>when does MANUAL_REVIEW happen</em> — where 196K over 7 turns became 120K over 3, a <b>−38%</b> swing. The pure-lookup question barely moved: 74K → 77K. And it still loses somewhere: the eligibility-exception question went 199K → 250K.","Two repos, opposite verdicts, same pattern. Which lever wins is a property of the repo and the question mix, not of the tool — which is the same conclusion the ~500-file payoff floor delivered for graphs in M04."],"source":"labs/CAPSTONE-2-java-token-benchmark/expected_output/live-run-priorauth.json, labs/CAPSTONE-2-java-token-benchmark/live_bench/SCENARIOS.md","terminal":[{"kind":"prompt","text":"python run_live_bench.py D:/tmp/priorauth-api-boot3 --arms baseline init --reps 3"},{"kind":"out","text":"36 files · 4 questions · 3 reps · repo_claude_md_count: baseline 0, init 1"},{"kind":"out-pass","text":"baseline 629K   →   init 565K   (−10%, one 55-line root CLAUDE.md)"}],"state":{"label":"priorauth-api-boot3 · 36 files · medians of 3","before":{"title":"PER QUESTION — where the −10% comes from","view":{"type":"rows","columns":["question","baseline","init (root CLAUDE.md)","delta"],"rows":[{"cells":["who calls <code>setStatus</code>","160,469 · 4t","<b>117,730 · 3t</b>","−27%"],"tone":"win"},{"cells":["who calls <code>findByMemberNumber</code>","<b>73,648 · 2t</b>","76,745 · 2t","+4%"]},{"cells":["when does MANUAL_REVIEW happen","195,754 · 7t","<b>120,445 · 3t</b>","−38%"],"tone":"win"},{"cells":["eligibility exception semantics","<b>198,857 · 7t</b>","250,473 · 9t","+26%"],"tone":"bad"},{"cells":["<b>all four</b>","<b>629K</b>","<b>565K</b>","<b>−10%</b>"],"tone":"win"}]}},"after":{"title":"THE TWO GRIDS SIDE BY SIDE","view":{"type":"rows","columns":["repo","files","CLAUDE.md shape","all-questions delta"],"rows":[{"cells":["spring-framework","9,195","one per module (22 files)","+2% — a wash"],"tone":"bad"},{"cells":["priorauth-api-boot3","36","one 55-line root file","−10% — best arm"],"tone":"win"}]}}}},{"title":"Orientation, not an index","narrative":["The two grids explain each other once you stop treating <code>CLAUDE.md</code> as a lookup table. It is <b>orientation and conventions</b> context. It pays off when a session's first problem is <em>where do I even start?</em> — the S1 win, the MANUAL_REVIEW win — and it is pure overhead when the agent already knows where to look, which is why the pure-lookup questions moved by single digits or went backwards.","So the placement rule is doing real work, not tidiness. Facts the agent needs every session belong in <code>CLAUDE.md</code>. Procedures and reference material become skills, which cost <b>zero tokens</b> in sessions that do not match their description. Anything canonical — a metric definition, an SLA — belongs in the OKF bundle where a freshness gate can watch it, not duplicated into an instruction file where it will quietly rot.","And keep the scale in view. The layered pattern is the whole of this course's discipline done by hand: a manual <code>index.md</code> hierarchy, a hand-written <code>.graphifyignore</code>, progressive disclosure without any tooling. On a repo small enough that everything fits, the manual version can beat the machinery outright — as 36 files just did."],"youDo":"Before writing per-module files across a large repo, run the cheap version of our experiment: one root file, three fresh sessions, your own questions. Expand only if the numbers move.","state":{"label":"symptom → what to write, and where","before":{"title":"THE PLACEMENT RULE","view":{"type":"rows","columns":["what it is","where it goes","cost when unused"],"rows":[{"cells":["repo-wide fact (layout, commit format)","root <code>CLAUDE.md</code>","loaded every session — keep it ~20 lines"]},{"cells":["module-owned convention","<code>&lt;module&gt;/CLAUDE.md</code>","zero outside that directory"],"tone":"win"},{"cells":["a procedure or checklist","<code>.claude/skills/&lt;name&gt;/SKILL.md</code>","zero until the description matches"],"tone":"win"},{"cells":["a canonical definition or SLA","the OKF bundle","zero — routed to on demand, and gated for freshness"],"tone":"win"},{"cells":["a caller list, a dependency map","the graph — never a hand-written file","it would be stale by the next merge"],"tone":"bad"}]}},"after":{"title":"WHAT WE ACTUALLY MEASURED","view":{"type":"note","text":"Per-module <code>CLAUDE.md</code> files on a 9,195-file repo: <b>+16% on structural questions, −7% on logic, +2% overall</b>, plus ~$3.40 to generate. One root file on a 36-file repo: <b>−10%, the best arm in the grid</b>. Neither number licenses \"always add CLAUDE.md files\". Both license the habit underneath it: write down orientation, measure whether it helped, and delete it if it did not."}}}}]},{"id":"kg-capstone-pipeline","badge":"WALKTHROUGH","color":"#10B981","time":"~5 min","title":"Five stages, five proofs","spec":"Capstone · the pipeline end to end","intro":"A map of the build, not a tutorial. One stage per step: the artifact it produces, and the check that proves the artifact is real. The lab packet has the eighteen steps; this is the shape they add up to.","provenance":{"kind":"illustrative","source":"a walk of labs/CAPSTONE-knowledge-pipeline/README.md over labs/sample-project; every command and output is taken from the lab solutions, cited per step"},"foot":"Build it for real: <code>labs/CAPSTONE-knowledge-pipeline/README.md</code> — seven phases, eighteen steps, two deliberate sabotages.","steps":[{"title":"Stage 1 — extract the structural graph","narrative":["The structural layer is deterministic extraction: identical source in, identical graph out, zero LLM calls and therefore zero hallucination risk on extracted edges. That is what lets the provenance tag on an edge honestly say <code>EXTRACTED</code>.","<b>Artifact:</b> <code>graphify-out/graph.json</code>. <b>Check:</b> orderflow is small enough to verify by hand — that is why the course uses it. Every ground-truth relationship listed in <code>sample-project/README.md</code> must appear, and an in-degree tally must put the <code>shared/</code> modules at the top: that cluster is the god node the architecture doc warned about, and its centrality is what makes a change there a wide-blast-radius change."],"youDo":"<code>graphify update .</code> if it is installed, or the offline fallback: <code>python ../shared_tools/kg_extract.py . --out graphify-out/graph.json</code>","source":"labs/shared_tools/kg_extract.py, labs/sample-project/README.md","terminal":[{"kind":"prompt","text":"python ../shared_tools/kg_extract.py . --out graphify-out/graph.json"},{"kind":"out-pass","text":"Rebuilt: 36 nodes, 22 edges -> graphify-out/graph.json\n  nodes: {'class': 4, 'function': 18, 'module': 14}\n  edges: {'EXTRACTED': 9, 'INFERRED': 13}"},{"kind":"prompt","text":"python -c \"…Counter over graph['edges']…\"   # in-degree by module"},{"kind":"out-pass","text":"[('shared.auth', 6), ('shared.db', 5), ('services.billing.webhooks', 4)]"}],"state":{"label":"graph.json vs the README's ground truth","before":{"title":"CHECK — every declared edge present","view":{"type":"rows","columns":["ground-truth relationship","in the graph?","provenance"],"rows":[{"cells":["<code>verify_token → decode_jwt</code> (same file)","yes","EXTRACTED"],"tone":"win"},{"cells":["<code>webhooks → invoice.mark_paid</code>","yes","INFERRED"],"tone":"win"},{"cells":["<code>webhooks → shared.events.publish</code>","yes","INFERRED"],"tone":"win"},{"cells":["<code>worker → subscribe</code> (payment.settled)","yes","INFERRED"],"tone":"win"},{"cells":["<code>orders → DatabasePool.execute</code>","yes","INFERRED"],"tone":"win"},{"cells":["god node = the <code>shared/</code> cluster","yes — <code>shared.auth</code> and <code>shared.db</code> top in-degree","—"],"tone":"win"}]}}}},{"title":"Stage 2 — author the OKF bundle","narrative":["The graph knows what the code <em>is</em>. It cannot know that WAU excludes testers on purpose, or that ADR-001 chose an in-process bus over a broker. That intent is the narrative layer: three Service concepts, two analytics concepts, an <code>index.md</code> the agent reads pre-flight, and a <code>log.md</code> recording what the bundle knows changed.","<b>Artifact:</b> <code>knowledge/</code>. <b>Check:</b> lint returns zero errors, and the WAU concept is an <b>attested computation</b> — it names <code>services/orders/metrics.py::weekly_active_users</code> as the source of truth rather than restating the rule in prose that can drift away from the code."],"youDo":"<code>python ../M06-okf-authoring/solution/validate.py knowledge</code> — and keep the body structure identical across Service concepts, because consistency is what agents parse.","source":"labs/M06-okf-authoring/solution/validate.py, labs/M06-okf-authoring/solution/knowledge/analytics/metrics/weekly_active_users.md","terminal":[{"kind":"prompt","text":"python ../M06-okf-authoring/solution/validate.py knowledge"},{"kind":"out-pass","text":"5 concepts valid, 0 errors"}],"state":{"label":"the concept that closes the incident from the brief","before":{"title":"BEFORE — the definition lives in prose","view":{"type":"note","text":"<code>docs/architecture.md</code> carries a retired paragraph: \"unique users with any API call in 7 days\", no tester exclusion. Nothing links it to code, so nothing can tell you it stopped being true."}},"after":{"title":"AFTER — the definition points at the code","view":{"type":"spec","id":"knowledge/analytics/metrics/weekly_active_users.md","status":"LINT CLEAN","rows":[["type","metric"],["resource","services/orders/metrics.py"],["source of truth","metrics.py::weekly_active_users"],["window","rolling 7 days"],["activity","≥ 1 completed order"],["excludes","cust_qa_1, cust_qa_2, cust_loadtest"]]}}}},{"title":"Stage 3 — install the enrichment hook","narrative":["A bundle nobody maintains is a wiki nobody reads. The post-commit hook scopes its scan to the git diff — touch <code>webhooks.py</code> and only <code>billing-service.md</code> is rescanned. Diff-scoping is the entire cost model: full-repo rescans per commit are what make teams switch pipelines off.","<b>Artifact:</b> <code>.git/hooks/post-commit</code>. <b>Check:</b> two behaviours, not one. A real change refreshes exactly one concept and appends <code>log.md</code>; a broken concept makes the hook <b>fail loudly, non-zero</b>. Note what this hook deliberately does not have: no <code>nohup</code>, no backgrounding, no silent resource-gated skips — the three mechanisms M11 catalogued."],"youDo":"Sabotage #1: delete the <code>type:</code> line from a concept, commit any code change, and confirm the hook exits non-zero naming the file. Then restore it.","source":"labs/M08-enrichment-hook/solution/post-commit, labs/M08-enrichment-hook/solution/refresh_concepts.py","terminal":[{"kind":"prompt","text":"git commit -qm \"billing: add fraud_check call to webhooks\""},{"kind":"out-pass","text":"[enrich] changed: services/billing/webhooks.py -> concept billing-service\n[enrich] refreshed Dependencies (4 edges) in billing-service.md\n[enrich] log.md updated\n[enrich] lint: 5 concepts valid, 0 errors"},{"kind":"gate","text":"⏸  SABOTAGE #1 — `type:` removed from billing-service.md"},{"kind":"prompt","text":"git commit -qm \"billing: another change\""},{"kind":"out-fail","text":"ERROR knowledge/services/billing-service.md: missing required field 'type'\n4 concepts valid, 1 errors\n[enrich] FAILED — bundle NOT published (lint rejected it). Fix before trusting or committing the bundle."}],"state":{"label":"one commit, one concept","before":{"title":"CHECK — did diff-scoping hold?","view":{"type":"rows","columns":["concept file","touched by the commit?","expected"],"rows":[{"cells":["<code>services/billing-service.md</code>","yes — Dependencies refreshed","yes"],"tone":"win"},{"cells":["<code>services/orders-service.md</code>","no","no"],"tone":"win"},{"cells":["<code>services/notifications-service.md</code>","no","no"],"tone":"win"},{"cells":["<code>knowledge/log.md</code>","yes — dated entry appended","yes"],"tone":"win"}]}}}},{"title":"Stage 4 — serve both layers over MCP","narrative":["Two artifacts on disk help nobody until an agent can reach them in one round trip. The MCP server exposes <code>graph_callers</code>, <code>graph_callees</code> and the composite <code>explore</code> over stdio, and <code>index.md</code> routes canonical questions to the right concept file.","<b>Artifact:</b> a registered server. <b>Check:</b> <code>--selftest</code> before you trust anything — a silently broken server plus graceful fallback produces confident garbage that looks like a successful run. Then the three baseline questions come back in one tool call each, and an unknown symbol returns an honest miss instead of a plausible guess."],"youDo":"<code>python server.py --selftest</code> must print <code>SELFTEST PASSED</code> before you run <code>claude mcp add orderflow-graph -- python /abs/path/to/server.py</code>.","source":"labs/M09-mcp-graph-server/solution/server.py","terminal":[{"kind":"prompt","text":"python server.py --selftest"},{"kind":"out-pass","text":"SELFTEST PASSED"},{"kind":"prompt","text":"who calls decode_jwt, directly and transitively?"},{"kind":"tool","text":"graph_callers(symbol=\"decode_jwt\")"},{"kind":"out-pass","text":"{\"callers\": [

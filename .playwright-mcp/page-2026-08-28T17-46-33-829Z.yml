      - generic [ref=f27e157]:
        - generic [ref=f27e158]: ✅ Why It Matters
        - paragraph [ref=f27e159]: "Layers turn vague complaints into line items. \"The agent is expensive\" becomes \"tool results are 2,341 of our 3,131 tokens — 75% of the budget is exploration dumps.\" That is a real number from this module's lab fixture, and once you can see it, the fix is obvious: attack the biggest line, not the prompt. The whole architecture of this course — graph for tool results, bundle for retrieved, index for the static prefix — is an attack plan ordered by layer size."

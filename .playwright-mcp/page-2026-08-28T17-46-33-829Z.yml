    - generic [ref=f27e52]:
      - heading "The Coupling Premise" [level=2] [ref=f27e53]
      - paragraph [ref=f27e54]:
        - text: If you took the sibling course
        - emphasis [ref=f27e55]: Building AI Agents with Claude
        - text: ", you met context engineering in module M03B: the discipline of deciding what the model sees, in what order, compressed how. If you started here instead, you've spent two modules learning graphs and RAG limits without anyone naming the discipline you were practicing."
      - paragraph [ref=f27e56]:
        - text: "Here is the claim this module exists to make explicit:"
        - strong [ref=f27e57]: this entire course is applied context engineering.
        - text: Every mechanism in Tracks 2 through 5 — tree-sitter graphs, OKF bundles, MCP servers, freshness gates — is one of context engineering's four levers, industrialized. The sibling course teaches the levers as techniques you apply by hand inside one conversation. This course builds the infrastructure that pulls those levers automatically, for every agent, on every task.
      - generic [ref=f27e58]:
        - text: 💡 Everyday Analogy
        - paragraph [ref=f27e59]:
          - strong [ref=f27e60]: "BEFORE:"
          - text: The sibling course's M03B uses a packing analogy — preparing a suitcase for a trip. You can throw things in (add), use packing cubes (compress), ship a box ahead to the hotel (retrieve it there), or hand bags to a travel buddy (offload). That works beautifully for one traveler packing one suitcase — one agent, one conversation, one context window.
        - paragraph [ref=f27e61]:
          - strong [ref=f27e62]: "PAIN:"
          - text: "Now imagine a company where a thousand travelers take the same trip every day. Each one packs from scratch, ships their own boxes, negotiates their own buddy system. The packing skill doesn't scale — every traveler re-derives the same decisions, and most of them pack badly under deadline pressure. That is your engineering org running coding agents without shared context infrastructure: every session re-explores the repo, re-derives the schema, re-argues about the metric definition."
        - paragraph [ref=f27e63]:
          - strong [ref=f27e64]: "MAPPING:"
          - text: This course builds the airline's luggage
          - emphasis [ref=f27e65]: infrastructure
          - text: ": the pre-shipped hotel boxes are your structural graph and OKF bundle (built once, queried by everyone), the packing-cube factory is your report and summary generators, and the freshness gate is the inspection that catches a box that's been sitting at the hotel for three weeks with last season's clothes in it. Same four levers — operated by machinery instead of willpower."
      - paragraph [ref=f27e66]: The rest of this module walks the mapping in detail, using the sibling course's own vocabulary and numbers so learners from either side land in the same place.
    - generic [ref=f27e67]:
      - 'heading "What the Model Actually Sees: The Six Layers" [level=2] [ref=f27e68]'
      - generic [ref=f27e69]:
        - text: 📐 Technical Definition
        - paragraph [ref=f27e70]:
          - text: "From the sibling course, verbatim:"
          - emphasis [ref=f27e71]: "\"Context engineering is the practice of deciding what content occupies the model's context window on each turn, in what order, and how it is compressed or fetched. Prompt engineering is a sub-discipline of context engineering that handles the authoring of one piece of that context (typically the system prompt or current user message).\""
        - paragraph [ref=f27e72]:
          - text: "And the line that reframes everything:"
          - emphasis [ref=f27e73]:
            - text: "\"Prompt engineering asks 'what words go in this message?' Context engineering asks 'what gets included at all, in what order, fresh or cached, full or summarized?'"
            - strong [ref=f27e74]: The first is a writing problem. The second is a budgeting problem.
            - text: "\""
      - paragraph [ref=f27e75]:
        - text: "The budget has six line items. On any turn, the model's context window contains: the"
        - generic [ref=f27e76]:
          - text: system prompt
          - generic: The standing instructions loaded at the start of every turn — identity, rules, conventions. Static by design.
        - text: ", the"
        - generic [ref=f27e77]:
          - text: tool definitions
          - generic: The JSON schemas describing every tool the agent can call. Loaded whether or not the tools get used.
        - text: ", the conversation"
        - strong [ref=f27e78]: history
        - text: ", any"
        - strong [ref=f27e79]: retrieved
        - text: documents, accumulated
        - strong [ref=f27e80]: tool results
        - text: ", and the"
        - strong [ref=f27e81]: current turn
        - text: — the user's actual message.
      - paragraph [ref=f27e82]: "M03B grounds this with an inventory of a real research agent at turn 8. Watch the animation build it, and watch where the user's message ends up:"
      - img "Animated stacked bar filling with the six context layers to 9,685 tokens; the current-turn layer is a tiny sliver" [ref=f27e83]:
        - generic [ref=f27e84]: SIX_LAYERS — one turn's context budget, layer by layer
        - img [ref=f27e85]:
          - generic [ref=f27e86]:
            - generic [ref=f27e87]: system
            - generic [ref=f27e89]: tools
            - generic [ref=f27e91]: history
            - generic [ref=f27e93]: retrieved
            - generic [ref=f27e95]: tool results
            - generic [ref=f27e97]: current
          - generic [ref=f27e99]: 0 tokens
        - generic [ref=f27e100]:
          - text: "Turn 8 of a research agent: system 420 · tools 1,180 · history 3,250 · retrieved 2,800 · tool results 1,950 · current turn 85 ="
          - strong [ref=f27e101]: 9,685 tokens
          - text: . The message the user typed is
          - strong [ref=f27e102]: 0.9%
          - text: of what the model reads.
        - generic [ref=f27e103]:
          - button "Play six layers animation" [ref=f27e104] [cursor=pointer]: ▶
          - button "Pause six layers animation" [ref=f27e105] [cursor=pointer]: ⏸
          - button "Restart six layers animation" [ref=f27e106] [cursor=pointer]: ↻
      - paragraph [ref=f27e107]: "Sit with that 0.9% for a second. When an agent answers badly, the instinct is to rewrite the prompt — to polish the 85 tokens. But the other 9,600 tokens are where the answer actually lives or dies: which files got dumped in as tool results, whether the retrieved doc is the current one or the stale one, whether turn 3's resolved error is still taking up residence. Optimizing the 0.9% while ignoring the 99.1% is why \"prompt engineering\" alone plateaus."
      - paragraph [ref=f27e108]:
        - text: You have already seen this exact failure in this course, before it had a name. M00's agent read 147 files to fix a 3-line bug — that was the
        - emphasis [ref=f27e109]: tool results
        - text: layer eating the whole budget. M02's RAG pipeline retrieved a stale WAU definition — that was the
        - emphasis [ref=f27e110]: retrieved
        - text: layer poisoning the well. The six-layer inventory is the diagnostic frame those stories were missing.

      - paragraph [ref=f26e292]:
        - text: "Watch the animation's final frames:"
        - code [ref=f26e293]: DatabasePool
        - text: sits between billing and orders, carrying more shortest paths than any other shared node, while
        - code [ref=f26e294]: publish
        - text: is the one that actually touches all three communities. In orderflow that's
        - code [ref=f26e295]: shared/db.py
        - text: — billing and orders both route through it, and it sits on more shortest paths than any other shared module. Graph tools call these
        - strong [ref=f26e296]: god nodes
        - text: ": the main characters of your codebase, identified by"
        - generic [ref=f26e297]:
          - text: centrality
          - generic: A family of graph measures scoring how "important" a node is — by how many edges it has (degree), or how many shortest paths run through it (betweenness).
        - text: "measures. The corpus definition is memorable and accurate:"
        - emphasis [ref=f26e298]: "\"the classes everything else depends on — we call these God Nodes because if they die, the universe ends.\""
      - paragraph [ref=f26e299]:
        - text: "Why you care, concretely: a god node is where refactoring risk, review scrutiny, and onboarding attention should concentrate. Any change to"
        - code [ref=f26e300]: shared/db.py
        - text: "has, by definition, the largest possible blast radius. A new engineer (or agent) reading the graph learns in seconds what might take weeks of tribal exposure:"
        - emphasis [ref=f26e301]: this
        - text: is the file you don't touch casually.
      - paragraph [ref=f26e302]:
        - text: Now the honest cost accounting. The strictest centrality measure —
        - strong [ref=f26e303]: betweenness centrality
        - text: ", which counts how many shortest paths pass through each node — costs"
        - strong [ref=f26e304]: O(V×E)
        - text: ": nodes times edges. On orderflow (36 nodes, 22 edges) that's nothing. On a real monorepo it's a wall: one documented case in the corpus involved a"
        - strong [ref=f26e305]: 450,000-node, 690,000-edge
        - text: graph — roughly
        - strong [ref=f26e306]: 310 billion operations
        - text: ", single-threaded, because the algorithm doesn't parallelize cleanly. A full rebuild on a 96-core Xeon was"
        - strong [ref=f26e307]: killed after 114 minutes without completing
        - text: ", while a different (smaller) repo finished in ~10 minutes on a laptop. Remember this number in M11: it's why \"just rebuild the graph on every commit\" stops being a plan at scale, and why cheap proxies like plain degree count (which our lab uses) are often the right engineering choice."
    - generic [ref=f26e308]:
      - heading "Blast radius — impact analysis as a graph walk" [level=2] [ref=f26e309]
      - paragraph [ref=f26e310]:
        - text: "The single most valuable query a code graph answers is the one that prevents outages:"
        - emphasis [ref=f26e311]: "\"if I change this, what could break?\""
        - text: "The graph formulation is clean: the"
        - strong [ref=f26e312]: blast radius
        - text: of a node is everything reachable by walking
        - emphasis [ref=f26e313]: incoming
        - text: call edges transitively — callers, callers-of-callers, and so on. It's a
        - generic [ref=f26e314]:
          - text: breadth-first search
          - generic: "BFS: explore a graph level by level from a starting node, using a queue and a visited-set so nothing is processed twice."
        - text: over the reversed graph, about ten lines of code, and you write it below.
      - paragraph [ref=f26e315]:
        - text: Mature tools score the result rather than just listing it. okf-rs's
        - code [ref=f26e316]: impact
        - text: "command, for instance, ranks every changed concept between two git refs by three factors:"
        - strong [ref=f26e317]: transitive-caller count
        - text: (the raw radius),
        - strong [ref=f26e318]: public-API membership
        - text: (external consumers can't be refactored alongside you), and
        - strong [ref=f26e319]: cycle participation
        - text: (changes inside dependency cycles propagate unpredictably). Its
        - code [ref=f26e320]: review
        - text: subcommand turns that into a PR comment with a
        - code [ref=f26e321]: "--fail-on-risk"
        - text: CI gate — impact analysis promoted from a query to a policy.
      - paragraph [ref=f26e322]:
        - text: "The corpus example that sells the feature: a developer asks, \"if I delete this 'deprecated' method, will the payment gateway explode?\" — and the graph shows"
        - emphasis [ref=f26e323]: the 14 hidden dependencies that say Yes
        - text: . Fourteen facts no one person remembered, retrieved in milliseconds.
    - generic [ref=f26e324]:
      - heading "Provenance — the honesty layer" [level=2] [ref=f26e325]
      - paragraph [ref=f26e326]: One primitive remains, and it's the one that separates trustworthy graphs from confident guessers.
      - paragraph [ref=f26e327]:
        - text: Not every edge is equally certain. When a parser sees
        - code [ref=f26e328]: decode_jwt(token)

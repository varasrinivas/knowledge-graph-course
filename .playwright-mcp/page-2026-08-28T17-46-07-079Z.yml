      - generic [ref=f26e202]:
        - generic [ref=f26e203]: 💰 Why it matters — the arithmetic you'll reuse all course
        - paragraph [ref=f26e204]:
          - text: "A real measured example from the corpus (you'll rebuild it in M09): answering \"who calls"
          - code [ref=f26e205]: cmd_generate
          - text: "?\" by hand meant opening a 672-line, ~24 KB file and reading enough of it to find the caller — roughly"
          - strong [ref=f26e206]: 6,000 tokens
          - text: ". The equivalent graph query returned one line: about"
          - strong [ref=f26e207]: 15 tokens
          - text: . That's ~400× for a single question — and it compounds, because the agent never re-opens that file after context compaction either. Per query and per session, traversal's cost stays flat while search's cost grows.
    - generic [ref=f26e208]:
      - heading "Multi-hop reasoning — where flat retrieval structurally fails" [level=2] [ref=f26e209]
      - paragraph [ref=f26e210]:
        - text: "Some questions cannot be answered from any single file, no matter how cleverly you retrieve it. Consider:"
        - emphasis [ref=f26e211]:
          - text: "\"What breaks in the API layer if I alter the schema in"
          - code [ref=f26e212]: db/migrations/04_users.sql
          - text: "?\""
        - text: The answer requires
        - emphasis [ref=f26e213]: chaining
        - text: "facts: the migration alters a table → a model class maps that table → a repository uses the model → three route handlers call the repository. Four files. The connecting facts never co-occur in one place; each hop lives in a different file, and some hops (the model↔table mapping) are implicit."
      - paragraph [ref=f26e214]:
        - text: "A graph answers this by construction: it's a path. Start at the table node, walk"
        - code [ref=f26e215]: maps_to
        - text: →
        - code [ref=f26e216]: used_by
        - text: →
        - code [ref=f26e217]: called_by
        - text: "edges, and the four-file chain falls out as a sequence of lookups. In orderflow miniature: change"
        - code [ref=f26e218]: decode_jwt
        - text: "'s claims format, and the graph walks"
        - code [ref=f26e219]: decode_jwt ← verify_token ← post_invoice
        - text: — two hops from an auth helper to a billing route that never mentions JWTs at all.
      - paragraph [ref=f26e220]: "Hold this example: in M02 you'll see exactly why chunk-based retrieval cannot make this chain (the hops are never co-located in a chunk), and in M10 \"multi-hop reasoning failure\" becomes the first of two formal triggers that justify adding a structural graph to a production stack."
    - generic [ref=f26e221]:
      - heading "Communities — subsystems the graph discovers by itself" [level=2] [ref=f26e222]
      - generic [ref=f26e223]:
        - text: 💡 Everyday Analogy
        - paragraph [ref=f26e224]:
          - strong [ref=f26e225]: Before
          - text: ": at a wedding reception with 100 guests, nobody hands you a seating chart of who knows whom. Yet watch the room for ten minutes and the structure is obvious — clusters form: the bride's university friends, the groom's coworkers, the extended family. Nobody assigned those clusters; they emerge from who actually talks to whom."
        - paragraph [ref=f26e226]:
          - strong [ref=f26e227]: The pain
          - text: ": codebases have the same latent structure — the billing code all calls other billing code — but nothing in the file system"
          - emphasis [ref=f26e228]: enforces
          - text: "that the folders match the conversation patterns. In old codebases they often don't: the \"utils\" folder talks to everyone, and a \"microservices\" architecture turns out to be, as the corpus memorably put it, a secret monolith in a trench coat."
        - paragraph [ref=f26e229]:
          - strong [ref=f26e230]: The mapping
          - text: ":"
          - strong [ref=f26e231]: community detection
          - text: is the algorithm that watches the room. It clusters nodes that are densely connected to each other and sparsely connected to everyone else. The clusters it finds are your
          - emphasis [ref=f26e232]: actual
          - text: subsystems — the architecture as practiced, not as drawn on the wiki.
      - generic [ref=f26e233]:
        - text: 📐 Technical Definition
        - paragraph [ref=f26e234]:
          - text: Community detection algorithms maximize
          - generic [ref=f26e235]:
            - text: modularity
            - generic: A score measuring how much denser connections are inside clusters than you'd expect by random chance. High modularity = crisp subsystems.
          - text: — the degree to which edges concentrate inside clusters rather than between them. Two algorithms matter for this course.
          - strong [ref=f26e236]: Leiden
          - text: "(used by Graphify) is a refinement of the classic Louvain method: fast, and guarantees well-connected communities."
          - strong [ref=f26e237]: Clauset–Newman–Moore
          - text: (used by okf-rs) is an agglomerative modularity maximizer — okf-rs's own dogfooding showed it correctly splitting an 18-crate workspace that naive connected-components analysis collapsed into one blob.
        - paragraph [ref=f26e238]:
          - text: "That last contrast deserves one more sentence, because it's a common trap:"
          - emphasis [ref=f26e239]: connected components
          - text: "only asks \"is there ANY path between these nodes?\" — and in real code, everything reaches everything through shared utilities, so you get one giant component. Modularity-based methods ask the sharper question: \"are these nodes"
          - emphasis [ref=f26e240]: unusually densely
          - text: connected?" — which is what separates billing from notifications even though both touch the database pool.
        - paragraph [ref=f26e241]: "On orderflow, community detection finds three clusters — billing, orders, notifications — matching the service boundaries. On a healthy codebase that's typical. On an unhealthy one, the mismatch IS the finding: a \"shared\" module that community detection assigns to billing is a module that only billing really uses."
      - generic [ref=f26e242]:
        - generic [ref=f26e243]: ⚠️ Where it breaks (file this for M11)
        - paragraph [ref=f26e244]:
          - text: In legacy enterprise monoliths, community detection often clusters
          - emphasis [ref=f26e245]: unrelated
          - text: "modules together merely because they all reference shared infrastructure — logging singletons, telemetry helpers. The wedding-party equivalent: everyone talks to the bartender, but that doesn't make the whole room one friend group. Treat detected communities as a strong hint, not gospel, and expect noise proportional to how tangled the codebase already is."

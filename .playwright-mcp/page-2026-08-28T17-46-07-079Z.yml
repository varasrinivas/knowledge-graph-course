      - 'progressbar "Course progress: module 2 of 14" [ref=f26e28]'
      - paragraph [ref=f26e30]:
        - text: "Every tool in this course — Graphify, CodeGraph, okf-rs, even OKF's humble Markdown links — is built from the same seven primitives: nodes, typed edges, traversal, multi-hop paths, communities, centrality, and provenance. In this module you build all seven by hand, in ~40 lines of dependency-free code, over the"
        - strong [ref=f26e31]: orderflow
        - text: repo. When a tool's README later says "Leiden community detection identified 13 subsystems," you'll know exactly what happened.
    - generic [ref=f26e32]:
      - heading "Learning objectives" [level=2] [ref=f26e33]
      - generic [ref=f26e34]:
        - paragraph [ref=f26e35]: "By the end of this module you will be able to:"
        - list [ref=f26e36]:
          - listitem [ref=f26e37]:
            - text: Model a codebase as a
            - strong [ref=f26e38]: directed graph of typed edges
            - text: and explain why "code is a social network, not a book."
          - listitem [ref=f26e39]:
            - text: Contrast
            - strong [ref=f26e40]: deterministic traversal
            - text: with probabilistic search, including the cost model of each.
          - listitem [ref=f26e41]:
            - text: Explain what
            - strong [ref=f26e42]: communities
            - text: and
            - strong [ref=f26e43]: god nodes
            - text: reveal about software architecture — and what computing them costs at scale.
          - listitem [ref=f26e44]:
            - text: Compute a
            - strong [ref=f26e45]: blast radius
            - text: (transitive impact set) with a breadth-first search you wrote yourself.
          - listitem [ref=f26e46]:
            - text: Apply the
            - strong [ref=f26e47]: EXTRACTED / INFERRED / AMBIGUOUS
            - text: provenance discipline that separates honest graphs from confident guessers.
    - generic [ref=f26e48]:
      - heading "Nodes, edges, and why the types matter" [level=2] [ref=f26e49]
      - generic [ref=f26e50]:
        - text: 💡 Everyday Analogy
        - paragraph [ref=f26e51]:
          - strong [ref=f26e52]: Before
          - text: ": think of how you read a novel — front to back, page by page, because a book's structure IS its reading order. Now think about how you actually navigate a city: nobody reads a city front to back. You use a map of"
          - emphasis [ref=f26e53]: places
          - text: and the
          - emphasis [ref=f26e54]: roads between them
          - text: ", and you care what KIND of road each one is — footpath, one-way street, highway."
        - paragraph [ref=f26e55]:
          - strong [ref=f26e56]: The pain
          - text: ": your IDE — and a mapless AI agent — treats code like the novel: files and line numbers, read in order. But nobody experiences a codebase that way. You experience it as \"this function calls that one,\" \"this class inherits from that one,\" \"this module imports those three.\" Reading files front-to-back to answer a relationship question is like reading every street sign in a city to find one address."
        - paragraph [ref=f26e57]:
          - strong [ref=f26e58]: The mapping
          - text: ": a knowledge graph is the city map for code. Functions, classes, and modules are the"
          - emphasis [ref=f26e59]: places
          - text: (nodes). Calls, imports, and inheritance are the
          - emphasis [ref=f26e60]: roads
          - text: "(edges) — and each road is labeled with its kind and its direction. One article in this course's corpus put it perfectly: your code isn't a book; it's a"
          - strong [ref=f26e61]: social network of narcissistic objects all trying to talk over each other
          - text: . A graph is just the honest picture of who talks to whom.
      - generic [ref=f26e62]:
        - text: 📐 Technical Definition
        - paragraph [ref=f26e63]:
          - text: A
          - generic [ref=f26e64]:
            - text: graph
            - generic: A data structure made of nodes (things) and edges (relationships between pairs of things). Nothing more exotic than that.
          - text: is a set of
          - strong [ref=f26e65]: nodes
          - text: and a set of
          - strong [ref=f26e66]: edges
          - text: "connecting pairs of nodes. For code, the nodes are program entities: modules, classes, functions, methods — and in richer graphs, database tables, API routes, documents, even diagrams."
        - paragraph [ref=f26e67]:
          - text: The edges are what elevate this above a file listing, and two properties do the work. First, edges are
          - strong [ref=f26e68]: directed
          - text: ":"
          - code [ref=f26e69]: verify_token → decode_jwt
          - text: means verify_token calls decode_jwt, and emphatically not the reverse — direction is the difference between "what do I depend on?" and "who depends on me?", two completely different questions. Second, edges are
          - strong [ref=f26e70]: typed
          - text: ":"
          - code [ref=f26e71]: calls
          - text: ","
          - code [ref=f26e72]: imports
          - text: ","
          - code [ref=f26e73]: inherits
          - text: ","
          - code [ref=f26e74]: implements
          - text: ","
          - code [ref=f26e75]: publishes_to
          - text: . A typed edge is a fact with a precise meaning; an untyped line between two boxes is just decoration.
        - paragraph [ref=f26e76]: "Here is what one node and one edge actually look like in the machine-readable form every tool in this course emits — this exact shape comes from the course's own extractor running on orderflow:"
      - generic [ref=f26e77]:
        - generic [ref=f26e78]:

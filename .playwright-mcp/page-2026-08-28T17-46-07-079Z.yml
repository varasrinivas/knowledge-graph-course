      - generic [ref=f26e128]:
        - generic [ref=f26e129]: ⚠️ Common misconceptions
        - paragraph [ref=f26e130]:
          - strong [ref=f26e131]: "\"A knowledge graph needs a graph database.\""
          - text: "— No. Every tool you'll meet stores its graph in ordinary things: a JSON file (Graphify), a SQLite file (CodeGraph), a folder of Markdown files with links (OKF, okf-rs). The graph is the"
          - emphasis [ref=f26e132]: shape of the data
          - text: ", not a product you install."
        - paragraph [ref=f26e133]:
          - strong [ref=f26e134]: "\"More edges = better graph.\""
          - text: — The opposite, usually. An edge is a claim; false or noisy claims poison every query that touches them. That's why provenance tags (below) exist, and why messy code produces graphs "like a ball of yarn after a cat attack."
        - paragraph [ref=f26e135]:
          - strong [ref=f26e136]: "\"The folder tree is already a graph.\""
          - text: — It is — but of the wrong relationship. Directories encode
          - emphasis [ref=f26e137]: where files sit
          - text: ", not"
          - emphasis [ref=f26e138]: who talks to whom
          - text: . orderflow's
          - code [ref=f26e139]: billing
          - text: and
          - code [ref=f26e140]: notifications
          - text: "folders are siblings, yet at runtime they're intimate: billing publishes the very events notifications consumes. Only an edge can say that."
    - generic [ref=f26e141]:
      - heading "Traversal vs search — the determinism dividend" [level=2] [ref=f26e142]
      - paragraph [ref=f26e143]: A map is only useful if following it is cheaper than wandering. Here's the precise sense in which it is.
      - paragraph [ref=f26e144]:
        - text: To answer
        - emphasis [ref=f26e145]:
          - text: "\"who calls"
          - code [ref=f26e146]: decode_jwt
          - text: "?\""
        - text: without a graph, an agent
        - strong [ref=f26e147]: searches
        - text: ": grep for the name (getting every mention — imports, comments, strings), open each candidate file, and read enough surrounding code to judge which hits are real call sites. The cost is proportional to the number and size of files touched, and the result is a judgment call. Run it twice, phrase the question differently, and you may get different answers."
      - paragraph [ref=f26e148]:
        - text: With a graph, the agent
        - strong [ref=f26e149]: traverses
        - text: ": look up the node, follow its incoming"
        - code [ref=f26e150]: calls
        - text: edges, done. The cost is proportional to the number of edges followed — usually a handful — and the answer is
        - emphasis [ref=f26e151]: a fact retrieved
        - text: ", not a text interpreted. Same question, every time, same answer. That repeatability is what the course means by"
        - strong [ref=f26e152]: deterministic
        - text: ": no similarity thresholds, no ranking, no luck."
      - paragraph [ref=f26e153]:
        - text: This is also the moment to name the complexity honestly. Search costs
        - emphasis [ref=f26e154]: O(files × file size)
        - text: in tokens per query, paid every query. Traversal costs
        - emphasis [ref=f26e155]: O(edges followed)
        - text: — after a one-time extraction cost paid when the graph is built. Extraction moved the expensive work out of the query path. You'll hear this called "compile once, query forever," and it's the same economic trick a database index plays.
      - generic [ref=f26e156]:

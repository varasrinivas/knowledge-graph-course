    - generic [ref=f25e47]:
      - heading "The 147-file bug fix" [level=2] [ref=f25e48]
      - paragraph [ref=f25e49]:
        - text: Here is a true story, the kind every developer who uses an AI coding assistant eventually collects. A developer asks Claude Code to fix a session-timeout bug in their authentication middleware. The fix, it will turn out, is
        - strong [ref=f25e50]: three lines
        - text: — a wrong comparison operator on one line, plus a small test.
      - paragraph [ref=f25e51]:
        - text: But before the agent gets anywhere near those three lines, it starts
        - emphasis [ref=f25e52]: reading
        - text: . It reads the logging system. It reads the database migration history. It reads half the API endpoints. For reasons known only to itself, it reads the Terraform configs. The developer watches the file counter climb — 50, 90, 120 — and finally hits Escape at
        - strong [ref=f25e53]: file 147
        - text: .
      - paragraph [ref=f25e54]:
        - text: "The natural reaction is to blame the model: \"it's not smart enough to know where to look.\" But that diagnosis is wrong, and the wrongness matters. The agent was doing exactly what any newcomer to that codebase would do without a guide: exploring. Every file it opened was a reasonable guess. The problem wasn't intelligence."
        - strong [ref=f25e55]: The agent had no map.
      - paragraph [ref=f25e56]: "This course is about building that map — not by hand, and not once, but as a living system that stays true while the code underneath it keeps changing. By the capstone you will have built one: a structural graph extracted from code, a curated knowledge bundle describing what the code means, a server that lets any agent query both in a single call, and the monitoring that catches the map going stale before an agent trusts a lie."

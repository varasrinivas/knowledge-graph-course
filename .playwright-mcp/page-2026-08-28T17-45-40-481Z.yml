        - text: "Two framing notes before you start. First, the baseline: M02 makes you build and break the RAG-only approach so you understand precisely which failures the later layers fix — you cannot evaluate a cure without seeing the disease. Second, the capstone: everything converges on a single build where you wire all four stages together over a small mock monorepo called"

    - generic [ref=f25e207]:
      - heading "Exploration tokens vs reasoning tokens" [level=2] [ref=f25e208]
      - generic [ref=f25e209]:
        - text: 💡 Everyday Analogy
        - paragraph [ref=f25e210]:
          - strong [ref=f25e211]: Before
          - text: ride-hailing apps, imagine hiring a taxi in a city with no street signs and a driver with no map. The meter starts the moment you get in — and it runs at the same rate whether the driver is making progress toward your destination or circling the same block trying to find it.
        - paragraph [ref=f25e212]:
          - strong [ref=f25e213]: The pain
          - text: ": at the end of the ride you pay a fortune, and most of the fare bought you nothing. You didn't pay for transportation; you paid for the driver's confusion. Worse, tomorrow's driver starts just as lost — the confusion is re-purchased every single trip."
        - paragraph [ref=f25e214]:
          - strong [ref=f25e215]: The mapping
          - text: ": an AI coding agent's"
          - generic [ref=f25e216]:
            - text: context window
            - generic: The fixed amount of text (measured in tokens) a model can consider at once — every file it reads, every instruction, every previous message counts against it.
          - text: is the taxi meter. Every file the agent opens costs its full size in
          - generic [ref=f25e217]:
            - text: tokens
            - generic: The unit LLMs read and bill in — roughly 4 characters of text per token. A 500-line source file is about 2,000 tokens.
          - text: ", whether that file contained the answer or not. When the agent explores instead of navigating, you pay for the circling. And the next session starts just as lost."
      - generic [ref=f25e218]:
        - text: 📐 Technical Definition
        - paragraph [ref=f25e219]:
          - text: In an agentic coding session, spent tokens split into two kinds of work.
          - strong [ref=f25e220]: Reasoning tokens
          - text: are spent thinking about your actual question — designing the fix, weighing tradeoffs, writing code.
          - strong [ref=f25e221]: Exploration tokens
          - text: "are spent locating the relevant code: reading files, grepping for symbols, tracing imports, opening related modules to check a hunch."
        - paragraph [ref=f25e222]:
          - text: "The uncomfortable empirical fact: on codebases of any real size,"
          - strong [ref=f25e223]: the majority of tokens are exploration
          - text: ". The agent isn't thinking hard about your question for most of the session. It is trying to find where the relevant code lives. And exploration has a second, sneakier cost: when the context window fills up and gets"
          - generic [ref=f25e224]:
            - text: compacted
            - generic: When a conversation outgrows the context window, older content is summarized or dropped. Files the agent read earlier are gone — re-consulting them means re-reading them at full price.
          - text: ", files the agent already read are forgotten — and re-opened at full price. Context usage grows with session length even when the task doesn't."
        - paragraph [ref=f25e225]:
          - text: Contrast that with a lookup. If a pre-built index can answer "who calls this function?" directly, the agent spends a handful of tokens on the answer instead of thousands on the search. The work of understanding the codebase's structure was done
          - emphasis [ref=f25e226]: once
          - text: ", ahead of time — not re-paid on every query, by every agent, every day."
      - generic [ref=f25e227]:
        - generic [ref=f25e228]: 💰 Why it matters — real numbers
        - paragraph [ref=f25e229]:
          - text: In one published benchmark across seven open-source projects (same model, same tasks, the only variable being whether a pre-built code graph was available), answering exploration-heavy questions on the VS Code repository dropped from
          - strong [ref=f25e230]: 2.8 million tokens to 601,000 tokens
          - text: "per benchmark run. On the Excalidraw repo: 3.5 million → 344,000. Aggregate across all seven projects:"
          - strong [ref=f25e231]: 57% fewer tokens, 71% fewer tool calls, 46% faster answers, 35% lower cost
          - text: — with zero change to the model. Every one of those saved tokens was mechanical file exploration that contributed nothing to answer quality. (You'll dissect these benchmarks — including where they get much less impressive — in M05.)
      - generic [ref=f25e232]:
        - generic [ref=f25e233]: ⚠️ Common misconceptions
        - paragraph [ref=f25e234]:
          - strong [ref=f25e235]: "\"Bigger context windows will fix this.\""
          - text: — No. A bigger window lets the agent read
          - emphasis [ref=f25e236]: more
          - text: "irrelevant files before answering, at proportionally higher cost. And models demonstrably degrade as context fills: they forget earlier instructions, re-read files they already saw, and make mistakes they wouldn't make with a clean context. The fix is keeping irrelevant content out, not making room for more of it."
        - paragraph [ref=f25e237]:
          - strong [ref=f25e238]: "\"Smarter models will fix this.\""
          - text: "— A model that needs to read 50 files and burn 3 million tokens to answer will never be used casually, no matter how intelligent it is. The friction is structural. As one analysis put it: the fastest way to make an AI coding tool better might not be to make it smarter — it might be to give it a map."
        - paragraph [ref=f25e239]:
          - strong [ref=f25e240]: "\"This is only about money.\""
          - text: — It's also about correctness. An agent skimming dozens of half-relevant files picks up wrong assumptions along the way. Fewer, more targeted reads mean fewer wrong beliefs in the agent's working model of your system.
    - generic [ref=f25e241]:
      - heading "The context-assembly problem" [level=2] [ref=f25e242]
      - paragraph [ref=f25e243]:
        - text: Exploration waste is the symptom you can see on an invoice. The deeper disease has a name — Google's engineers called it the
        - emphasis [ref=f25e244]: context-assembly problem
        - text: — and it isn't about code at all.
      - paragraph [ref=f25e245]:
        - text: "Ask a seemingly simple question inside any real organization:"
        - emphasis [ref=f25e246]: "\"How do we compute weekly active users from our event stream?\""
        - text: The answer exists. But where? Usually scattered across a metadata catalog, a wiki page nobody has opened since last year, a code comment, a Slack argument between two data engineers, and the memory of one senior engineer who is on vacation this week.
      - paragraph [ref=f25e247]:
        - text: "Every time a team builds a new AI agent, that agent has to reassemble the answer from scratch — because none of those places agree on a format, and none of them was written to be read by a machine. Table schemas, metric definitions, JOIN paths, incident runbooks, API contracts: the knowledge that agents need most is exactly the knowledge that lives in the most fragmented places. The cost isn't one-time. It's a recurring tax on"
        - strong [ref=f25e248]: every task, every agent, every teammate running one
        - text: .
      - paragraph [ref=f25e249]: And stale context isn't just slow — it's actively dangerous. An agent acting on an outdated mental model of a service's dependencies doesn't merely waste tokens; it can confidently change something it didn't know was connected to something else. (In M02 you'll watch an agent retrieve a stale metric definition and ship a wrong dashboard without a single error appearing anywhere.)
      - heading "Karpathy's LLM Wiki" [level=3] [ref=f25e250]
      - paragraph [ref=f25e251]:
        - text: In April 2026, Andrej Karpathy posted a thought experiment that crystallized the fix. Instead of having a model search the same raw documents over and over, let it
        - strong [ref=f25e252]: build and maintain a living wiki
        - text: — a compiled, cross-linked set of Markdown notes that serves as durable external memory. Drop papers, notes, screenshots, and architecture docs into a folder, and let an AI that understands their relationships keep the wiki current.
      - paragraph [ref=f25e253]:
        - text: "The insight that stuck with engineers was about temperament, not technology: humans abandon personal wikis because the upkeep is tedious — fixing cross-references, updating stale pages, logging changes. But as Google's own materials later put it:"
        - emphasis [ref=f25e254]: "\"LLMs don't get bored, don't forget to update a cross-reference, and can touch 15 files in one pass. The bookkeeping that causes humans to abandon personal wikis is exactly what LLMs are good at.\""
      - paragraph [ref=f25e255]:
        - text: "Think of it as compilation. Source code isn't re-parsed from scratch every time you run a program — it's compiled once and reused. Stable knowledge about your systems deserves the same treatment:"
        - strong [ref=f25e256]: compiled once, kept current incrementally, and looked up instead of re-derived
        - text: . That single idea — knowledge as a compiled artifact — is the seed of everything in this course.

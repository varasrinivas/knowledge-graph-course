      - generic [ref=f25e378]:
        - generic [ref=f25e379]: ⚠️ Common misconceptions
        - paragraph [ref=f25e380]:
          - strong [ref=f25e381]: "\"Knowledge graphs replace RAG.\""
          - text: — The single most viral misframing in this entire field, and this course will push back on it repeatedly. Graph tools' own benchmarks show they
          - emphasis [ref=f25e382]: tie
          - text: well-tuned vector RAG on retrieval accuracy (M04 has the exact numbers). Their real advantages are determinism, ingest cost, and structural queries RAG cannot express. The three layers are complements. Teams that rip out RAG to install a graph are solving a problem they don't have.
        - paragraph [ref=f25e383]:
          - strong [ref=f25e384]: "\"One tool will cover all three layers.\""
          - text: — Every tool you'll meet specializes. Graphify extracts what the code is; OKF curates what engineers know; vector search handles the remainder. The architecture question is never "which one wins" but "which layer owns which context" (M10 gives you the decision matrix).

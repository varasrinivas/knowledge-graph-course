        - generic [ref=f25e418]: ✅ Why this order
        - paragraph [ref=f25e419]:
          - text: "The course teaches extraction before curation because extraction is free and deterministic — you can trust it blindly and build intuition fast. It teaches curation before serving because a server with nothing worth serving teaches nothing. And it teaches maintenance last but insists it matters most: the field's own production postmortems (M11 walks through four of them) show that"
          - strong [ref=f25e420]: the demo is easy and staying-true-over-time is the actual engineering problem
